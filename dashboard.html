  }).join('');
}

async function toggleNoteCheck(noteId, idx){
  const note=await db.get('notes',noteId);
  if(!note) return;
  let count=0;
  const lines=note.content.split('\n');
  for(let i=0;i<lines.length;i++){
    if(/^- \[(x| )\] /.test(lines[i])){
      if(count===idx){
        lines[i]=lines[i].startsWith('- [x] ')
          ?lines[i].replace('- [x] ','- [ ] ')
          :lines[i].replace('- [ ] ','- [x] ');
        break;
      }
      count++;
    }
  }
  note.content=lines.join('\n');
  note.updatedAt=Date.now();
  await db.put('notes',note);
  await loadNotes();
}

  const body=document.getElementById('nb-'+id);

  body.classList.toggle('expanded');

}

function noteDragStart(e,id){
  _dragNoteId=id;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{
    const el=document.querySelector(`[data-note-id="${id}"]`);
    if(el) el.classList.add('dragging');
  },0);
}

function noteDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const card=e.currentTarget;
  if(card.dataset.noteId!==_dragNoteId) card.classList.add('drag-over');
}

function noteDragLeave(e){
  if(!e.currentTarget.contains(e.relatedTarget)){
    e.currentTarget.classList.remove('drag-over');
  }
}

async function noteDrop(e,targetId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!_dragNoteId||_dragNoteId===targetId){_dragNoteId=null;return;}
  const cards=[...document.querySelectorAll('[data-note-id]')];
  const ids=cards.map(c=>c.dataset.noteId);
  const fromIdx=ids.indexOf(_dragNoteId);
  const toIdx=ids.indexOf(targetId);
  if(fromIdx<0||toIdx<0){_dragNoteId=null;return;}
  ids.splice(fromIdx,1);
  ids.splice(toIdx,0,_dragNoteId);
  for(let i=0;i<ids.length;i++){
    const note=await db.get('notes',ids[i]);
    if(note) await db.put('notes',{...note,order:i});
  }
  _dragNoteId=null;
  await loadNotes();
}

function noteDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.note-card.drag-over').forEach(el=>el.classList.remove('drag-over'));
  _dragNoteId=null;
}

async function renderTodoCal(){
  const allTodos = await db.getByIndex('todos','projectId',PROJECT_ID);
  todoDotDates = new Set(allTodos.map(t=>t.date));

  const {year, month} = todoCal;
  const todayStr = new Date().toISOString().slice(0,10);
  const firstDow = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month+1, 0).getDate();
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1;d<=lastDate;d++){
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'cal-day';
    if(ds===todayStr) cls += ' today';
    if(ds===todoSelectedDate) cls += ' selected';
    cells += `<div class="${cls}" data-cal-date="${ds}">${d}${todoDotDates.has(ds)?'<div class="cal-dot"></div>':''}</div>`;
  }
  const totalCells = firstDow + lastDate;
  for(let i=0;i<(7-totalCells%7)%7;i++) cells += `<div class="cal-day empty"></div>`;

  const pane = document.getElementById('todo-cal-pane');
  if(!pane) return;
  pane.innerHTML = `
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev">‹</button>
      <span class="cal-month-label">${year}년 ${monthNames[month]}</span>
      <button class="cal-nav" id="cal-next">›</button>
    </div>
    <div class="cal-grid">
      ${DAYS_KO.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
  `;

  document.getElementById('cal-prev').addEventListener('click',()=>{
    if(todoCal.month===0) todoCal={year:todoCal.year-1,month:11};
    else todoCal={...todoCal,month:todoCal.month-1};
    renderTodoCal();
  });
  document.getElementById('cal-next').addEventListener('click',()=>{
    if(todoCal.month===11) todoCal={year:todoCal.year+1,month:0};
    else todoCal={...todoCal,month:todoCal.month+1};
    renderTodoCal();
  });
  pane.addEventListener('click',e=>{
    const cell=e.target.closest('[data-cal-date]');
    if(!cell) return;
    todoSelectedDate=cell.dataset.calDate;
    renderTodoCal();
    loadTodayTodos();
  });
}

function todoDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');

}

function parseTodoTag(content){
  const m = (content||'').match(/^\[([^\]]+)\]\s*/);
  return m ? {tag:m[1], text:content.slice(m[0].length)} : {tag:'', text:content};
}

async function renderTodoDeadlineBody(){
  const body = document.getElementById('todo-view-body');
  if(!body) return;
  const allTodos = await db.getByIndex('todos','projectId',PROJECT_ID);
  const today = new Date().toISOString().slice(0,10);
  const todayDate = new Date(today);

  const items = allTodos.filter(t=>!t.done && t.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline));

  if(!items.length){
    body.innerHTML=`<div class="deadline-no-items">
      <div style="font-weight:600">마감일이 지정된 미완료 할일이 없습니다</div>
      <div style="font-size:12px;color:var(--text3)">회의록에서 <code>~날짜</code>로 추출하거나<br>할일 수정에서 기한을 설정하세요</div>
    </div>`;
    return;
  }

  // 기준 날짜 계산
  const thisWeekEnd=(()=>{const d=new Date(todayDate);d.setDate(d.getDate()+(6-d.getDay()));return d.toISOString().slice(0,10);})();
  const nextWeekEnd=(()=>{const d=new Date(todayDate);d.setDate(d.getDate()+7+(6-d.getDay()));return d.toISOString().slice(0,10);})();
  const thisMonthEnd=new Date(todayDate.getFullYear(),todayDate.getMonth()+1,0).toISOString().slice(0,10);

  const groups=[
    {key:'overdue',  label:'지연',    cls:'overdue',     items:[]},
    {key:'thisweek', label:'이번 주',  cls:'this-week',   items:[]},
    {key:'nextweek', label:'📆 다음 주',  cls:'next-week',   items:[]},
    {key:'month',    label:'🗓️ 이번 달', cls:'this-month',  items:[]},
    {key:'later',    label:'그 이후', cls:'later',        items:[]},
  ];
  for(const t of items){
    if(t.deadline<today) groups[0].items.push(t);
    else if(t.deadline<=thisWeekEnd) groups[1].items.push(t);
    else if(t.deadline<=nextWeekEnd) groups[2].items.push(t);
    else if(t.deadline<=thisMonthEnd) groups[3].items.push(t);
    else groups[4].items.push(t);
  }

  const dTag=(dl)=>{
    const diff=Math.round((new Date(dl)-new Date(today))/86400000);
    if(diff<0) return `D+${Math.abs(diff)}`;
    if(diff===0) return 'D-Day';
    return `D-${diff}`;
  };

  let html='<div class="deadline-view">';
  for(const g of groups){
    if(!g.items.length) continue;
    html+=`<div class="deadline-group ${g.cls}">
      <div class="deadline-group-header">
        <span class="deadline-group-label">${g.label}</span>
        <span class="deadline-group-count">${g.items.length}건</span>
      </div>`;
    for(const t of g.items){
      const isOverdue=t.deadline<today, isSoon=!isOverdue&&t.deadline<=thisWeekEnd;
      const dateTag=`<span class="deadline-item-date ${isOverdue?'overdue':isSoon?'soon':''}">${dTag(t.deadline)}<br><span style="font-size:10px;font-weight:400">${t.deadline}</span></span>`;
      html+=todoItemHTML(t, dateTag);
    }
    html+='</div>';
  }
  html+='</div>';
  body.innerHTML=html;

  body.addEventListener('change', async e=>{
    const id=e.target.dataset.chkId; if(!id) return;
    const t=await db.get('todos',id); if(!t) return;
    t.done=!t.done; await db.put('todos',t);
    await renderTodoDeadlineBody();
  });
  body.addEventListener('click', async e=>{
    const edit=e.target.closest('[data-edit-id]');
    if(edit){await editTodoModal(edit.dataset.editId);return;}
    const del=e.target.closest('[data-del-id]');
    if(del){await deleteTodo(del.dataset.delId);return;}
    const commChip=e.target.closest('[data-src-comm-id]');
    if(commChip){renderTab('comm');setTimeout(()=>openThread(commChip.dataset.srcCommId,'comm'),150);}
  });
}

async function loadTodayTodos(){
  const listPane = document.getElementById('todo-view-body') || document.getElementById('todo-list-pane');
  if(!listPane) return;

  const todayStr = new Date().toISOString().slice(0,10);
  const isToday = todoSelectedDate === todayStr;

  const allTodos = await db.getByIndex('todos','projectId',PROJECT_ID);
  const items = allTodos.filter(t=>t.date===todoSelectedDate).sort((a,b)=>a.createdAt-b.createdAt);

  // 오늘 뷰일 때만 과거 미완료 이월 항목 수집
  const overdue = isToday
    ? allTodos.filter(t=>!t.done && t.date && t.date < todayStr).sort((a,b)=>a.date.localeCompare(b.date))
    : [];

  const d = new Date(todoSelectedDate+'T00:00:00');
  const dateLabel = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS_KO[d.getDay()]})`;
  const doneCount = items.filter(t=>t.done).length;

  // 이월 섹션 HTML
  const rolloverHTML = overdue.length ? `
    <div class="todo-rollover-section" id="rollover-section">
      <div class="todo-rollover-header" onclick="document.getElementById('rollover-list').classList.toggle('hidden')">
        <span class="todo-rollover-count">${overdue.length}</span>
        <span class="todo-rollover-header-label">미완료 이월 항목</span>
        <button class="btn-rollover-all" onclick="event.stopPropagation();rolloverAllTodos()">↩ 전체 오늘로</button>
      </div>
      <div class="todo-rollover-list" id="rollover-list">
        ${overdue.map(t=>`
          <div class="todo-rollover-item" data-rollover-id="${t.id}">
            <span class="todo-rollover-from">${todoDateLabel(t.date)}</span>
            <span style="flex:1;font-size:13px;color:var(--text)">${esc(t.content)}</span>
            ${t.time?`<span class="todo-chip" style="font-size:11px">⏰ ${esc(t.time)}</span>`:''}
            <button class="btn-rollover-one" data-rollover-id="${t.id}">↩ 오늘로</button>
          </div>`).join('')}
      </div>
    </div>` : '';

  listPane.innerHTML = `
    <div class="todo-date-header">
      <span class="todo-date-label">${dateLabel}</span>
      <span class="todo-count-badge">${items.length}개 · ${doneCount}개 완료</span>
      ${items.length>0?`<button class="btn-ghost" id="btn-todo-delete-all" style="margin-left:auto;font-size:12px;color:var(--red);padding:3px 8px">전체 삭제</button>`:''}
    </div>
    ${rolloverHTML}
    <div class="todo-add-section">
      <div class="todo-add-main">
        <input type="text" id="todo-input" placeholder="할 일 추가 (Enter)">
        <button class="todo-add-toggle" id="todo-detail-toggle">▾ 상세</button>
        <button class="todo-add-btn" id="btn-todo-add">추가</button>
      </div>
      <div class="todo-detail-fields hidden" id="todo-detail-fields">
        <div><input type="time" id="todo-time" placeholder="시간 (예: 14:00)"></div>
        <div><input type="text" id="todo-assignee" placeholder="담당자"></div>
        <div><input type="date" id="todo-deadline" placeholder="마감일"></div>
        <div class="memo-row"><input type="text" id="todo-memo" placeholder="메모"></div>
      </div>
    </div>
    <div id="todo-list">
      ${items.length===0
        ? `<div class="empty-state"><p>할 일이 없습니다</p><span>위에서 추가해보세요</span></div>`
        : items.map(t=>{
            const extra = t.originalDate
              ? `<span class="todo-rolled-badge" title="${t.originalDate}에서 이월">
                   ${todoDateLabel(t.originalDate)} 이월
                   <button class="btn-restore-one" data-restore-id="${t.id}">되돌리기</button>
                 </span>`
              : '';
            return todoItemHTML(t, extra);
          }).join('')}
    </div>
  `;

  const input = document.getElementById('todo-input');
  const addBtn = document.getElementById('btn-todo-add');
  const detailToggle = document.getElementById('todo-detail-toggle');
  const detailFields = document.getElementById('todo-detail-fields');

  detailToggle.addEventListener('click',()=>{
    const hidden = detailFields.classList.toggle('hidden');
    detailToggle.textContent = hidden ? '▾ 상세' : '▲ 상세';
  });

  const doAdd = async()=>{
    const content = input.value.trim();
    if(!content) return;
    const time = document.getElementById('todo-time')?.value||'';
    const assignee = document.getElementById('todo-assignee')?.value.trim()||'';
    const deadline = document.getElementById('todo-deadline')?.value||'';
    const memo = document.getElementById('todo-memo')?.value.trim()||'';
    await db.put('todos',{
      id:genId(), projectId:PROJECT_ID, date:todoSelectedDate,
      content, time, assignee, deadline, memo, done:false, createdAt:Date.now()
    });
    await refreshTodoView();
  };

  addBtn.addEventListener('click', doAdd);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){e.preventDefault();doAdd();} });

  document.getElementById('btn-todo-delete-all')?.addEventListener('click', async()=>{
    if(!confirm(`${dateLabel}의 할일 ${items.length}개를 모두 삭제하시겠습니까?`)) return;
    await Promise.all(items.map(t=>db.delete('todos',t.id)));
    await refreshTodoView();
  });

  listPane.addEventListener('change', async e=>{
    const id = e.target.dataset.chkId;
    if(!id) return;
    const t = await db.get('todos',id);
    if(!t) return;
    t.done = !t.done;
    await db.put('todos',t);
    await refreshTodoView();
  });

  listPane.addEventListener('click', async e=>{
    const rollBtn = e.target.closest('[data-rollover-id]');
    if(rollBtn){ await rolloverTodo(rollBtn.dataset.rolloverId); return; }
    const restoreBtn = e.target.closest('[data-restore-id]');
    if(restoreBtn){ await restoreTodo(restoreBtn.dataset.restoreId); return; }
    const editBtn = e.target.closest('[data-edit-id]');
    if(editBtn){ await editTodoModal(editBtn.dataset.editId); return; }
    const delBtn = e.target.closest('[data-del-id]');
    if(delBtn){ await deleteTodo(delBtn.dataset.delId); return; }
    const commChip = e.target.closest('[data-src-comm-id]');
    if(commChip){ renderTab('comm'); setTimeout(()=>openThread(commChip.dataset.srcCommId,'comm'),150); return; }
  });

  // 백로그 → Daily 드롭존
  const todoList = document.getElementById('todo-list');
  if(todoList){
    todoList.classList.add('todo-list-dropzone');
    todoList.addEventListener('dragover',e=>{
      if(!e.dataTransfer.types.includes('backlog-todo-id')) return;
      e.preventDefault();
      todoList.classList.add('drop-active');
    });
    todoList.addEventListener('dragleave',e=>{
      if(!todoList.contains(e.relatedTarget)) todoList.classList.remove('drop-active');
    });
    todoList.addEventListener('drop',async e=>{
      const id=e.dataTransfer.getData('backlog-todo-id');
      if(!id) return;
      e.preventDefault();
      todoList.classList.remove('drop-active');
      const t=await db.get('todos',id);
      if(!t) return;
      t.date=todoSelectedDate;
      await db.put('todos',t);
      await refreshTodoView();
      await renderBacklog();
    });
  }
}

async function rolloverTodo(id){
  const t = await db.get('todos', id);
  if(!t) return;
  t.originalDate = t.date;
  t.date = new Date().toISOString().slice(0,10);
  await db.put('todos', t);
  await refreshTodoView();
}

async function rolloverAllTodos(){
  const todayStr = new Date().toISOString().slice(0,10);
  const all = await db.getByIndex('todos','projectId',PROJECT_ID);
  const overdue = all.filter(t=>!t.done && t.date && t.date < todayStr);
  await Promise.all(overdue.map(t=>{
    t.originalDate = t.originalDate || t.date;
    t.date = todayStr;
    return db.put('todos',t);
  }));
  showToast(`↩ ${overdue.length}개 오늘로 이월했습니다`);
  await refreshTodoView();
}

async function rolloverTodoToDate(id, targetDate){
  const t = await db.get('todos', id);
  if(!t) return;
  t.originalDate = t.originalDate || t.date;
  t.date = targetDate;
  await db.put('todos', t);
  await renderTodoWeeklyBody();
}

async function restoreTodo(id){
  const t = await db.get('todos', id);
  if(!t?.originalDate) return;
  t.date = t.originalDate;
  delete t.originalDate;
  await db.put('todos', t);
  await refreshTodoView();
}

async function deleteTodo(id){
  const item = await db.get('todos', id);
  if(!item) return;
  // 백로그 출처 항목이 날짜에 배정된 상태면 삭제 대신 백로그로 복귀
  if(item.backlog && item.date){
    item.date = '';
    delete item.originalDate;
    await db.put('todos', item);
    closeModal();
    showToast('백로그로 되돌렸습니다');
    await refreshTodoView();
    await renderBacklog();
    return;
  }
  confirmDelete(item.content||'할일', async()=>{
    pushUndo('todos', item, item.content||'할일', async()=>{closeModal();await refreshTodoView();});

    closeModal();
    showToast('삭제됨 · Ctrl+Z로 실행 취소');
    await refreshTodoView();
    await renderBacklog();

async function renderBacklog(){
  const pane = document.getElementById('todo-backlog-pane');
  if(!pane) return;
  const all = await db.getByIndex('todos','projectId',PROJECT_ID);
  const items = all.filter(t=>!t.date).sort((a,b)=>a.createdAt-b.createdAt);

  // [태그] 파싱 후 그룹핑
  const parseTag = content => {
    const m = content.match(/^\[([^\]]+)\]\s*/);
    return m ? {tag: m[1], text: content.slice(m[0].length)} : {tag: '', text: content};
  };
  const groups = {};
  const groupOrder = [];
  for(const t of items){
    const {tag} = parseTag(t.content);
    if(!groups[tag]){ groups[tag]=[]; groupOrder.push(tag); }
    groups[tag].push(t);
  }
  const listHTML = items.length===0
    ? `<div class="todo-backlog-empty">날짜 없는 할일을<br>여기 추가하세요<br><br>⠿ 드래그해서<br>날짜 배정</div>`
    : groupOrder.map(tag=>{
        const tagHeaderHTML = tag ? `<div class="backlog-group-header">${esc(tag)}</div>` : '';
        // tag 안에서 group 필드로 2차 그룹핑
        const subGroups = {};
        const subOrder = [];
        for(const t of groups[tag]){
          const g = t.group||'';
          if(!subGroups[g]){ subGroups[g]=[]; subOrder.push(g); }
          subGroups[g].push(t);
        }
        const subHTML = subOrder.map(g=>{
          const subHeaderHTML = g ? `<div class="backlog-step-header">${esc(g)}</div>` : '';
          const itemsHTML = subGroups[g].map(t=>{
            const {text} = parseTag(t.content);
            const badgeHTML = tag ? `<span class="backlog-badge">${esc(tag)}</span>` : '';
            return `<div class="todo-backlog-item" draggable="true" data-backlog-id="${t.id}">
              <span class="backlog-drag-handle">⠿</span>
              <span class="backlog-text">${esc(text)}</span>
              ${badgeHTML}
              <button class="backlog-del" data-backlog-del="${t.id}" title="삭제">×</button>
            </div>`;
          }).join('');
          return subHeaderHTML + itemsHTML;
        }).join('');
        return tagHeaderHTML + subHTML;
      }).join('');

  pane.innerHTML = `
    <div class="todo-backlog-add-row">
      <input type="text" id="backlog-input" placeholder="할일 추가 (Enter)">
      <button id="backlog-add-btn">+</button>
    </div>
    <div class="todo-backlog-list" id="backlog-list">${listHTML}</div>`;

  const input = document.getElementById('backlog-input');
  const addBtn = document.getElementById('backlog-add-btn');
  const doAdd = async()=>{
    const content = input.value.trim();
    if(!content) return;
    await db.put('todos',{id:genId(),projectId:PROJECT_ID,date:'',content,time:'',assignee:'',deadline:'',memo:'',done:false,backlog:true,createdAt:Date.now()});
    input.value='';
    await renderBacklog();
  };
  addBtn.addEventListener('click',doAdd);
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doAdd();}});

  pane.addEventListener('click',async e=>{
    const delBtn=e.target.closest('[data-backlog-del]');
    if(!delBtn) return;
    await db.delete('todos',delBtn.dataset.backlogDel);
    await renderBacklog();
  });

  const list = document.getElementById('backlog-list');
  list.addEventListener('dragstart',e=>{
    const item=e.target.closest('[data-backlog-id]');
    if(!item) return;
    e.dataTransfer.setData('backlog-todo-id',item.dataset.backlogId);
    e.dataTransfer.effectAllowed='move';
    setTimeout(()=>item.classList.add('is-dragging'),0);
  });
  list.addEventListener('dragend',e=>{
    const item=e.target.closest('[data-backlog-id]');
    if(item) item.classList.remove('is-dragging');
  });
}

function localDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getWeekRange(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=d.getDay();
  const mondayOffset=dow===0?-6:1-dow;
  const mon=new Date(d);
  mon.setDate(d.getDate()+mondayOffset);
  const dates=[];
  for(let i=0;i<7;i++){
    const day=new Date(mon);
    day.setDate(mon.getDate()+i);
    dates.push(localDateStr(day)); // 로컬 날짜 기준 (toISOString은 UTC라 KST에서 하루 밀림)
  }
  return dates; // [월,화,수,목,금,토,일]
}

async function renderTodoWeeklyBody(){
  const body=document.getElementById('todo-view-body');
  if(!body) return;
  body.style.overflow='hidden';

  const allTodos=await db.getByIndex('todos','projectId',PROJECT_ID);
  const todayStr=localDateStr(new Date());
  const weekDates=getWeekRange(todoSelectedDate);
  const DAY_LABELS=['월','화','수','목','금','토','일'];

  // colsHtml 안에서 참조하므로 먼저 선언
  const isCurrentWeek = weekDates[0] <= todayStr && todayStr <= weekDates[6];

  const colsHtml=weekDates.map((ds,idx)=>{
    const isToday=ds===todayStr;
    const isWeekend=idx>=5;
    const d=new Date(ds+'T00:00:00');
    const dayItems=allTodos.filter(t=>t.date===ds).sort((a,b)=>a.createdAt-b.createdAt);
    const itemsHtml=dayItems.map(t=>`
      <div class="todo-week-card${t.done?' done-card':''}${t.originalDate?' rolled-card':''}"
           data-week-todo-id="${t.id}"
           ${t.originalDate&&isCurrentWeek?`draggable="true" data-drag-back-id="${t.id}"`:''}
      >${t.originalDate&&isCurrentWeek?'<span class="drag-handle" style="font-size:11px">⠿</span>':''}${esc(t.content)}${t.originalDate?`<span class="todo-rolled-badge" style="font-size:10px;margin-left:4px">${todoDateLabel(t.originalDate)}</span>`:''}
      </div>`).join('');
    return `
      <div class="todo-week-col${isWeekend?' weekend':''}${idx<5?` day-col-${idx}`:''}" data-week-date="${ds}">
        <div class="todo-week-col-header${isToday?' today-col':''}">
          <div class="todo-week-dow">${DAY_LABELS[idx]}</div>
          <div class="todo-week-date${isToday?' today-date':''}">${d.getMonth()+1}/${d.getDate()}</div>
        </div>
        <div class="todo-week-items" id="week-items-${ds}">${itemsHtml}</div>
        <button class="todo-week-add" data-week-add="${ds}" style="display:inline-flex;align-items:center;gap:3px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>추가</button>
      </div>`;
  }).join('');

  const monD=new Date(weekDates[0]+'T00:00:00');
  const sunD=new Date(weekDates[6]+'T00:00:00');
  const weekLabel=`${monD.getFullYear()}년 ${monD.getMonth()+1}월 ${monD.getDate()}일 ~ ${sunD.getMonth()+1}월 ${sunD.getDate()}일`;

  // 이번 주 보고 있을 때만 이월 섹션 표시
  const overdue = isCurrentWeek
    ? allTodos.filter(t=>!t.done && t.date && t.date < weekDates[0]).sort((a,b)=>a.date.localeCompare(b.date))
    : [];

  const rolloverHTML = isCurrentWeek ? `
    <div class="todo-rollover-section" id="week-rollover-section" style="margin-bottom:12px;flex-shrink:0">
      <div class="todo-rollover-header" onclick="document.getElementById('week-rollover-list').classList.toggle('hidden')">
        <span class="todo-rollover-count">${overdue.length}</span>
        <span class="todo-rollover-header-label">미완료 이월 항목</span>
        ${overdue.length?`<button class="btn-rollover-all" onclick="event.stopPropagation();rolloverAllTodos()">↩ 전체 이번 주로</button>`:''}
      </div>
      <div class="todo-rollover-list" id="week-rollover-list">
        ${overdue.length
          ? overdue.map(t=>`
              <div class="todo-rollover-item" draggable="true" data-drag-id="${t.id}">
                <span class="drag-handle">⠿</span>
                <span class="todo-rollover-from">${todoDateLabel(t.date)}</span>
                <span style="flex:1;font-size:13px;color:var(--text)">${esc(t.content)}</span>
                ${t.time?`<span class="todo-chip" style="font-size:11px">⏰ ${esc(t.time)}</span>`:''}
              </div>`).join('')
          : `<div class="week-rollover-dropzone" id="week-rollover-dropzone">
               이월된 항목을 여기로 드래그하면 원래 날짜로 되돌아갑니다
             </div>`}
      </div>
    </div>` : '';

  body.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0">
      <button class="cal-nav" id="week-prev">‹</button>
      <span style="font-weight:700;font-size:14px;color:var(--text)">${weekLabel}</span>
      <button class="cal-nav" id="week-next">›</button>
      <button class="btn-ghost" id="week-today" style="margin-left:auto;font-size:12px">오늘</button>
    </div>
    ${rolloverHTML}
    <div class="todo-weekly-grid">${colsHtml}</div>`;

  document.getElementById('week-prev').addEventListener('click',()=>{
    const prev=new Date(weekDates[0]+'T00:00:00');
    prev.setDate(prev.getDate()-7);
    todoSelectedDate=localDateStr(prev);
    renderTodoWeeklyBody();
  });
  document.getElementById('week-next').addEventListener('click',()=>{
    const next=new Date(weekDates[0]+'T00:00:00');
    next.setDate(next.getDate()+7);
    todoSelectedDate=localDateStr(next);
    renderTodoWeeklyBody();
  });
  document.getElementById('week-today').addEventListener('click',()=>{
    todoSelectedDate=localDateStr(new Date());
    renderTodoWeeklyBody();
  });

  // 드래그앤드롭 — 이월 항목 → 요일 컬럼
  const rolloverSection = document.getElementById('week-rollover-section');
  if(rolloverSection){
    // 이월 섹션 → 컬럼 드래그
    rolloverSection.addEventListener('dragstart', e=>{
      const item = e.target.closest('[data-drag-id]');
      if(!item) return;
      e.dataTransfer.setData('text/plain', JSON.stringify({id:item.dataset.dragId, dir:'to-col'}));
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>item.classList.add('is-dragging'), 0);
    });
    rolloverSection.addEventListener('dragend', e=>{
      const item = e.target.closest('[data-drag-id]');
      if(item) item.classList.remove('is-dragging');
    });
    // 컬럼 → 이월 섹션으로 되돌리기 드롭 존
    const rolloverList = document.getElementById('week-rollover-list');
    rolloverSection.addEventListener('dragover', e=>{
      const payload = (()=>{try{return JSON.parse(e.dataTransfer.types.includes('text/plain')?'{"dir":"to-col"}':'{}')}catch{return{}}})();
      // 컬럼에서 오는 드래그만 허용
      rolloverSection.classList.add('rollover-drop-active');
      e.preventDefault();
    });
    rolloverSection.addEventListener('dragleave', e=>{
      if(!rolloverSection.contains(e.relatedTarget)) rolloverSection.classList.remove('rollover-drop-active');
    });
    rolloverSection.addEventListener('drop', async e=>{
      e.preventDefault();
      rolloverSection.classList.remove('rollover-drop-active');
      try{
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        if(data.dir==='to-rollover') await restoreTodo(data.id);
      }catch(err){}
    });
  }

  // 컬럼 카드 → 이월 섹션 드래그 시작
  document.querySelectorAll('[data-drag-back-id]').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', JSON.stringify({id:card.dataset.dragBackId, dir:'to-rollover'}));
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(()=>card.classList.add('is-dragging'), 0);
      e.stopPropagation();
    });
    card.addEventListener('dragend', ()=>card.classList.remove('is-dragging'));
  });

  document.querySelectorAll('.todo-week-col[data-week-date]').forEach(col=>{
    const targetDate = col.dataset.weekDate;
    col.addEventListener('dragover', e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const isBacklog = e.dataTransfer.types.includes('backlog-todo-id');
      col.classList.add(isBacklog ? 'backlog-drop-target' : 'drop-target');
    });
    col.addEventListener('dragleave', e=>{
      if(!col.contains(e.relatedTarget)){
        col.classList.remove('drop-target');
        col.classList.remove('backlog-drop-target');
      }
    });
    col.addEventListener('drop', async e=>{
      e.preventDefault();
      col.classList.remove('drop-target');
      col.classList.remove('backlog-drop-target');
      // 백로그 → 날짜 배정
      const backlogId = e.dataTransfer.getData('backlog-todo-id');
      if(backlogId){
        const t = await db.get('todos', backlogId);
        if(t){ t.date = targetDate; await db.put('todos', t); }
        await renderTodoWeeklyBody();
        await renderBacklog();
        return;
      }
      // 이월 항목 → 컬럼
      try{
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        if(data.dir==='to-col') await rolloverTodoToDate(data.id, targetDate);
      }catch(err){}
    });
  });

  body.addEventListener('click',async e=>{
    const addBtn=e.target.closest('[data-week-add]');
    if(addBtn){await quickAddWeeklyTodo(addBtn.dataset.weekAdd);return;}
    const card=e.target.closest('[data-week-todo-id]');
    if(card){await editTodoModal(card.dataset.weekTodoId);return;}
  });
}

async function renderTodoMonthlyBody(){
  const body=document.getElementById('todo-view-body');
  if(!body) return;
  body.style.overflowY='auto';

  const allTodos=await db.getByIndex('todos','projectId',PROJECT_ID);
  const todayStr=new Date().toISOString().slice(0,10);
  const {year,month}=todoCal;
  const monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const firstDow=new Date(year,month,1).getDay();
  const lastDate=new Date(year,month+1,0).getDate();

  const todoMap={};
  allTodos.forEach(t=>{
    if(!todoMap[t.date]) todoMap[t.date]=[];
    todoMap[t.date].push(t);
  });

  let cellsHtml='';
  for(let i=0;i<firstDow;i++) cellsHtml+=`<div class="todo-month-cell empty"></div>`;
  for(let d=1;d<=lastDate;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const dayTodos=(todoMap[ds]||[]).sort((a,b)=>a.createdAt-b.createdAt);
    const MAX=3;
    const previewHtml=dayTodos.slice(0,MAX).map(t=>
      `<div class="todo-month-item-preview${t.done?' done-preview':''}">${esc(t.content)}</div>`
    ).join('');
    const moreCount=dayTodos.length-MAX;
    const moreHtml=moreCount>0?`<div class="todo-month-more">+${moreCount}건</div>`:'';
    cellsHtml+=`
      <div class="todo-month-cell${isToday?' today-cell':''}" data-month-date="${ds}">
        <div class="todo-month-day-num">${d}</div>
        ${previewHtml}${moreHtml}
      </div>`;
  }
  const totalCells=firstDow+lastDate;
  const remainder=(7-totalCells%7)%7;
  for(let i=0;i<remainder;i++) cellsHtml+=`<div class="todo-month-cell empty"></div>`;

  body.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0">
      <button class="cal-nav" id="month-prev">‹</button>
      <span style="font-weight:700;font-size:15px;color:var(--text)">${year}년 ${monthNames[month]}</span>
      <button class="cal-nav" id="month-next">›</button>
      <button class="btn-ghost" id="month-today" style="margin-left:auto;font-size:12px">오늘</button>
    </div>
    <div class="todo-monthly-grid">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="todo-month-dow-header">${d}</div>`).join('')}
      ${cellsHtml}
    </div>`;

  document.getElementById('month-prev').addEventListener('click',()=>{
    if(todoCal.month===0) todoCal={year:todoCal.year-1,month:11};
    else todoCal={...todoCal,month:todoCal.month-1};
    renderTodoMonthlyBody();
  });
  document.getElementById('month-next').addEventListener('click',()=>{
    if(todoCal.month===11) todoCal={year:todoCal.year+1,month:0};
    else todoCal={...todoCal,month:todoCal.month+1};
    renderTodoMonthlyBody();
  });
  document.getElementById('month-today').addEventListener('click',()=>{
    todoCal={year:new Date().getFullYear(),month:new Date().getMonth()};
    todoSelectedDate=new Date().toISOString().slice(0,10);
    renderTodoMonthlyBody();
  });

  body.addEventListener('click',e=>{
    const cell=e.target.closest('[data-month-date]');
    if(!cell) return;
    todoSelectedDate=cell.dataset.monthDate;
    const d=new Date(todoSelectedDate+'T00:00:00');
    todoCal={year:d.getFullYear(),month:d.getMonth()};
    todoView='daily';

function initResizer(){
  const resizer=document.getElementById('pane-resizer');
  const pane=document.getElementById('thread-pane');
  if(!resizer||!pane) return;
  resizer.classList.add('visible');
  // clone to remove old listeners
  const fresh=resizer.cloneNode(true);
  resizer.parentNode.replaceChild(fresh,resizer);
  fresh.addEventListener('mousedown',e=>{
    const startX=e.clientX;
    const startW=pane.offsetWidth;
    fresh.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
    const onMove=e=>{
      const w=Math.max(280,Math.min(1200,startW-(e.clientX-startX)));
      pane.style.transition='none';
      pane.style.width=w+'px';
      localStorage.setItem('thread-pane-width',w);
    };
    const onUp=()=>{
      fresh.classList.remove('dragging');
      document.body.style.cursor='';
      document.body.style.userSelect='';
      pane.style.transition='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    e.preventDefault();
  });
}

async function openThread(id, type){
  selectedItem={id,type};
  const pane=document.getElementById('thread-pane');
  if(!pane) return;
  const savedW=parseInt(localStorage.getItem('thread-pane-width'))||420;
  pane.style.width=savedW+'px';
  if(type==='issue'){
    pane.classList.add('open','overlay-mode');
  } else {
    pane.classList.remove('overlay-mode');
    pane.classList.add('open');
  }

  // 헤더 정보 로드
  let item, headerHtml='', metaHtml='';
  if(type==='comm'){
    item=await db.get('communications',id);
    headerHtml=inlineSlackHtml(item?.subject||item?.date||'');
    const ownerStr = Array.isArray(item?.owner) ? item.owner.join(', ') : (item?.participants||'');
    metaHtml=`${item?.date?`<span>${esc(item.date)}</span>`:''}${item?.channel?`<span>${esc(item.channel)}</span>`:''}${ownerStr?`<span>${esc(ownerStr)}</span>`:''}`;
  } else if(type==='issue'){
    item=await db.get('issues',id);
    const pl={high:'🔴 높음',medium:'🟡 보통',low:'🟢 낮음'};
    headerHtml=esc(item?.title||'');
    metaHtml=`<span>${pl[item?.priority]||''}</span><span>📂 ${esc(item?.category||'')}</span>${item?.assignee?`<span>👤 ${esc(item.assignee)}</span>`:''}`;
  } else if(type==='note'){
    item=await db.get('notes',id);
    headerHtml=esc(item?.title||'(제목 없음)');
  }

  let origContent='', origExtra='';
  if(type==='comm'){
    const summary = item?.summary||item?.content||'';
    const actionItems = Array.isArray(item?.actionItems) ? item.actionItems : (item?.actionItems?[item.actionItems]:[]);
    const msgs = item?.messages||[];
    // 날짜별 그룹
    const dateGroupMap={};
    msgs.forEach(m=>{
      const d=m.date||(m.datetime||'').slice(0,10)||'';
      if(!dateGroupMap[d]) dateGroupMap[d]=[];
      dateGroupMap[d].push(m);
    });
    const msgsHtml = Object.entries(dateGroupMap).map(([d,ms])=>`
      <div class="slack-date-header" style="position:static">${d}</div>
      ${ms.map(m=>`<div class="slack-msg">
        <div class="slack-msg-meta">
          <span class="slack-msg-time">${esc(m.time||'')}</span>
          <span class="slack-msg-speaker">${esc(m.speaker||'')}${m.recipients?.length?' → '+m.recipients.map(r=>esc(r)).join(', '):''}</span>
        </div>
        <div class="slack-msg-text">${slackToHtml(m.text||m.content||'')}</div>
      </div>`).join('')}`).join('');
    const nextAction = item?.nextAction || '';
    origContent = `
      ${summary?`<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:600;color:var(--text3);display:block;margin-bottom:4px">요약</label><div class="note-rendered">${renderSummaryAsBullets(summary)}</div></div>`:''}
      ${nextAction?`<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:600;color:var(--text3);display:block;margin-bottom:4px">다음 액션</label><div class="note-rendered">${renderSummaryAsBullets(nextAction)}</div></div>`:''}
      ${actionItems.length?`<div style="margin-bottom:12px"><label style="font-size:11px;font-weight:600;color:var(--text3);display:block;margin-bottom:4px">액션아이템</label>${actionItems.map(a=>`<div style="font-size:13px;color:var(--text2);padding:2px 0">· ${esc(a)}</div>`).join('')}</div>`:''}
      ${msgs.length?`<div><label style="font-size:11px;font-weight:600;color:var(--text3);display:block;margin-bottom:4px">메시지 (${msgs.length}건)</label><div class="slack-thread-preview" style="max-height:none">${msgsHtml}</div></div>`:''}
      ${item?.sourceUrl?`<a href="${esc(item.sourceUrl)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);text-decoration:none;margin-top:8px">↗ 원문 바로가기</a>`:''}
    `;
  } else {
    origContent=item?.content?`<div class="note-rendered">${renderMarkdown(item.content)}</div>`:'';
  }

  pane.innerHTML=`
    <div class="thread-header">
      <span class="thread-header-title">${headerHtml}</span>
      <button class="thread-close" onclick="closeThread()">✕</button>
    </div>
    <div class="thread-messages" id="thread-messages">
      ${(origContent||metaHtml)?`
      <div class="thread-orig-block">
        ${metaHtml?`<div class="thread-original-meta">${metaHtml}</div>`:''}
        ${origContent}${origExtra}
      </div>`:''}
      <div id="thread-replies"></div>
    </div>
    <div class="thread-compose">
      ${makeToolbarHtml('thread-input')}
      <textarea id="thread-input" placeholder="스레드에 내용 추가"></textarea>
      <div class="thread-compose-row">
        <button class="btn-primary" id="btn-thread-send">전송</button>
      </div>
    </div>
  `;

  attachToolbars(pane);
  document.getElementById('btn-thread-send').addEventListener('click', async()=>{
    const ta=document.getElementById('thread-input');
    const content=ta.value.trim();
    if(!content) return;
    await db.put('threads',{
      id:genId(), parentId:id, projectId:PROJECT_ID,
      content, createdAt:Date.now()
    });
    ta.value='';
    await loadThreadMessages(id);
    // 목록 스크롤 맨 아래로
    const msgs=document.getElementById('thread-messages');
    if(msgs) msgs.scrollTop=msgs.scrollHeight;
  });

  document.getElementById('thread-input').addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
      e.preventDefault();
      document.getElementById('btn-thread-send').click();
    }
  });

  await loadThreadMessages(id);
  initResizer();
}

async function loadThreadMessages(parentId){
  const el=document.getElementById('thread-replies')||document.getElementById('thread-messages');
  if(!el) return;
  const items=await db.getByIndex('threads','parentId',parentId);
  items.sort((a,b)=>a.createdAt-b.createdAt);
  if(!items.length){
    el.innerHTML=`<div class="thread-empty">아직 스레드가 없습니다<br><span style="font-size:12px">아래에 내용을 입력해보세요</span></div>`;
    return;
  }
  el.innerHTML=items.map(t=>`
    <div class="thread-msg" id="thread-msg-${t.id}">
      <div class="thread-msg-meta">
        ${new Date(t.createdAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
        ${t.updatedAt?`<span style="color:var(--text3);font-size:10px;margin-left:4px">(수정됨)</span>`:''}
        <button onclick="editThread('${t.id}')" style="background:none;border:none;cursor:pointer;color:var(--blue);font-size:11px;margin-left:6px;padding:0">수정</button>
        <button onclick="deleteThread('${t.id}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;margin-left:4px;padding:0">삭제</button>
      </div>
      <div class="thread-msg-content note-rendered" id="thread-content-${t.id}">${renderMarkdown(t.content)}</div>
    </div>
  `).join('');
}

async function deleteThread(id){
  const item = await db.get('threads', id);
  if(!item) return;
  confirmDelete('댓글', async()=>{
    pushUndo('threads', item, '댓글', async()=>{if(selectedItem) await loadThreadMessages(selectedItem.id);});
    await db.delete('threads', id);
    showToast('삭제됨 · Ctrl+Z로 실행 취소');
    if(selectedItem) await loadThreadMessages(selectedItem.id);
  });
}

async function editThread(id){
  const t=await db.get('threads',id);
  if(!t) return;
  const contentEl=document.getElementById('thread-content-'+id);
  if(!contentEl) return;
  const escaped=( t.content||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  contentEl.innerHTML=`
    <textarea id="thread-edit-${id}" style="width:100%;border:1px solid var(--border2);border-radius:4px;padding:7px 9px;font-family:inherit;font-size:13px;line-height:1.65;color:var(--text);background:var(--bg);resize:vertical;min-height:80px;box-sizing:border-box">${escaped}</textarea>
    <div style="display:flex;justify-content:flex-end;gap:6px;margin-top:6px">
      <button onclick="saveThread('${id}')" class="btn-primary" style="font-size:12px;padding:4px 12px">저장</button>
      <button onclick="cancelThreadEdit()" class="btn-ghost" style="font-size:12px;padding:4px 12px">취소</button>
    </div>
  `;
  document.getElementById('thread-edit-'+id).focus();
}

async function saveThread(id){
  const t=await db.get('threads',id);
  if(!t) return;
  const ta=document.getElementById('thread-edit-'+id);
  if(!ta) return;
  const content=ta.value.trim();
  if(!content){alert('내용을 입력해주세요');return;}
  await db.put('threads',{...t, content, updatedAt:Date.now()});
  if(selectedItem) await loadThreadMessages(selectedItem.id);
}

async function cancelThreadEdit(){
  if(selectedItem) await loadThreadMessages(selectedItem.id);
}

function closeThread(){
  selectedItem=null;
  const pane=document.getElementById('thread-pane');
  if(pane){pane.style.width='0';pane.classList.remove('open','overlay-mode');pane.innerHTML='';}
  const resizer=document.getElementById('pane-resizer');
  if(resizer) resizer.classList.remove('visible');
}

function writeGmailConfig(proj){
  const cfg = {
    projectName: proj.clientName||proj.name||'MCE',
    domains: proj.gmailDomains||[],
    projectId: PROJECT_ID,
    syncFilePath: 'G:\\내 드라이브\\Projects\\Project-Archive\\_sync\\gmail-sync.json',
    updatedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='gmail-config.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function importGmailSync(file){
  if(!file) return;
  let data;
  try{
    data = JSON.parse(await file.text());
  } catch(e){
    alert('파일을 읽는 중 오류가 발생했습니다: '+e.message);
    return;
  }
  const emails = data.emails||[];
  if(!emails.length){
    alert('파일에 메일 데이터가 없습니다.');
    return;
  }
  const existing = await db.getByIndex('communications','projectId',PROJECT_ID);
  const importedIds = new Set(existing.map(c=>c.gmailThreadId).filter(Boolean));
  const newEmails = emails.filter(e=>e.gmailThreadId && !importedIds.has(e.gmailThreadId));

  if(!newEmails.length){
    alert('새로 가져올 메일이 없습니다.\n(이미 모두 가져왔거나 중복된 항목입니다)');
    return;
  }

  showModal('Gmail 동기화 미리보기', `
    <p style="color:var(--text2);font-size:13px;margin-bottom:14px">
      <strong>${newEmails.length}개</strong>의 새 메일을 커뮤니케이션 기록으로 가져옵니다.
      ${data.syncedAt?`<span style="font-size:11px;color:var(--text3);margin-left:8px">동기화 시각: ${new Date(data.syncedAt).toLocaleString('ko-KR')}</span>`:''}
    </p>
    <div style="display:flex;flex-direction:column;gap:8px;max-height:380px;overflow-y:auto">
      ${newEmails.map(e=>`
        <div style="border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--radius);padding:10px 12px;background:var(--bg2)">
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
            <span style="font-size:11px;font-weight:600;color:var(--text3)">${esc(e.date)}</span>
            <span style="font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.participants)}</span>
          </div>
          <div style="font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px">${esc(e.subject||'(제목 없음)')}</div>
          <div style="font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(e.summary||'')}</div>
        </div>`).join('')}
    </div>
  `,[
    {label:`${newEmails.length}개 모두 가져오기`, cls:'btn-primary', action: async()=>{
      for(const e of newEmails){
        await db.put('communications',{
          id: e.gmailThreadId || genId(),
          projectId: PROJECT_ID,
          date: e.date,
          type: '이메일',
          participants: e.participants||'',
          content: (e.subject?`**${e.subject}**\n\n`:'') + (e.summary||''),
          subject: e.subject||'',
          gmailThreadId: e.gmailThreadId,
          createdAt: Date.now(),
        });
      }
      closeModal();
      renderTab('comm');
    }},
    {label:'취소', cls:'btn-ghost', action:()=>closeModal()},
  ]);
}

// ── COMM SIDE PANEL ───────────────────────────────────────────────
function openCommPanel(title, bodyHtml, buttons=[]){
  document.getElementById('comm-panel-title').textContent = title;
  document.getElementById('comm-panel-body').innerHTML = bodyHtml;
  window._commPanelState = { title, bodyHtml, buttons };
  const footer = document.getElementById('comm-panel-footer');
  footer.innerHTML = '';
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = b.cls||'btn-ghost';
    btn.textContent = b.label;
    btn.addEventListener('click', async()=>{ const r=await b.action(); if(r===false) return; });
    footer.appendChild(btn);
  });
  document.getElementById('comm-side-panel').classList.add('open');
  document.getElementById('comm-panel-backdrop').classList.add('open');
  document.getElementById('comm-panel-body').scrollTop = 0;
}
function restoreCommPanelInput(){
  const s = window._commPanelState;
  if(!s) return;
  openCommPanel(s.title, s.bodyHtml, s.buttons);
}
function closeCommPanel(){
  document.getElementById('comm-side-panel').classList.remove('open');
  document.getElementById('comm-panel-backdrop').classList.remove('open');
}
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('comm-panel-close').addEventListener('click', closeCommPanel);
  document.getElementById('comm-panel-backdrop').addEventListener('click', closeCommPanel);
});

function showModal(title, bodyHtml, buttons=[], preventClose=false, wide=false){
  const BTN_ICONS={
    '저장':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    '취소':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    '삭제':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
    '복사':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  };
  document.getElementById('modal').classList.toggle('modal-wide', wide);
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=bodyHtml;
  const footer=document.getElementById('modal-footer');
  footer.innerHTML='';
  buttons.forEach(b=>{
    const btn=document.createElement('button');
    btn.className=b.cls||'btn-ghost';
    btn.innerHTML=(BTN_ICONS[b.label]||'')+esc(b.label);
    btn.addEventListener('click',async()=>{
      const result=await b.action();
      if(result===false) return;
    });
    footer.appendChild(btn);
  });
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('modal-close').style.display=preventClose?'none':'';
  document.getElementById('modal-overlay').dataset.preventClose=preventClose?'1':'';
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
}
function confirmDelete(label, onConfirm){
  showModal('삭제 확인', `
    <p style="color:var(--text2);margin:0">"<strong>${esc(label)}</strong>"을(를) 삭제하시겠습니까?</p>
    <p style="font-size:12px;color:var(--text3);margin:8px 0 0">삭제 후 Ctrl+Z로 실행 취소할 수 있습니다.</p>
  `,[
    {label:'삭제', cls:'btn-danger', action: onConfirm},
    {label:'취소', cls:'btn-ghost', action: ()=>closeModal()},
  ]);
}
function showToast(msg, duration=2500){
  let t=document.getElementById('__toast');
  if(!t){
    t=document.createElement('div');
    t.id='__toast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:8px;font-size:13px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity='1';
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>{t.style.opacity='0'},duration);
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────
async function exportData(){
  const p=await db.get('projects',PROJECT_ID);
  const comms=await db.getByIndex('communications','projectId',PROJECT_ID);
  const files=await db.getByIndex('files','projectId',PROJECT_ID);
  const issues=await db.getByIndex('issues','projectId',PROJECT_ID);
  const notes=await db.getByIndex('notes','projectId',PROJECT_ID);
  const todos=await db.getByIndex('todos','projectId',PROJECT_ID);

  const threads=await new Promise(r=>{const req=db.transaction('threads','readonly').objectStore('threads').getAll();req.onsuccess=()=>r(req.result);});
  const exportObj={
    version:4,
    exportedAt:new Date().toISOString(),
    project:p,
    communications:comms,
    files:files.map(({data,...rest})=>rest),
    issues,
    notes,
    todos,
    threads,
  };
  const blob=new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const name=(p?.clientName||'MCE').replace(/\s+/g,'_');
  a.href=url;a.download=`${name}_dashboard_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function importData(file){
  if(!file) return;
  if(!confirm('현재 데이터(파일 제외)를 가져오기 데이터로 덮어씁니까?\n파일 첨부는 별도로 다시 업로드해야 합니다.')) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(data.project) await db.put('projects',data.project);
    for(const c of(data.communications||[])) await db.put('communications',c);
    for(const i of(data.issues||[])) await db.put('issues',i);
    for(const n of(data.notes||[])) await db.put('notes',n);
    for(const t of(data.todos||[])) await db.put('todos',t);
    for(const t of(data.threads||[])) await db.put('threads',t);
    project=await db.get('projects',PROJECT_ID);
    renderHeader();
    renderTab(currentTab);
    alert('가져오기 완료');
  }catch(e){
    alert('파일을 읽는 중 오류가 발생했습니다: '+e.message);
  }
}

// ── GLOBAL SEARCH ────────────────────────────────────────────────
let gsearchFocusIdx = -1;

function openGlobalSearch(){
  document.getElementById('gsearch-overlay').classList.remove('hidden');
  const inp = document.getElementById('gsearch-input');
  inp.value = '';
  inp.focus();
  gsearchFocusIdx = -1;
  document.getElementById('gsearch-results').innerHTML = '<div class="gsearch-empty">검색어를 입력하세요</div>';
}

function closeGlobalSearch(){
  document.getElementById('gsearch-overlay').classList.add('hidden');
}

function gsHighlight(text, query){
  if(!text) return '';
  if(!query) return esc(text);
  const idx = String(text).toLowerCase().indexOf(query.toLowerCase());
  if(idx < 0) return esc(text);
  const t = String(text);
  return esc(t.slice(0,idx))
    + `<span class="gsearch-highlight">${esc(t.slice(idx, idx+query.length))}</span>`
    + esc(t.slice(idx+query.length));
}

async function runGlobalSearch(query){
  const q = query.toLowerCase().trim();
  if(!q) return [];
  const results = [];

  const comms = await db.getByIndex('communications','projectId',PROJECT_ID);
  comms.forEach(c=>{
    const fields = [c.content, c.participants, c.type, c.date];
    if(fields.some(f=>(f||'').toLowerCase().includes(q))){
      const matchIn = (c.participants||'').toLowerCase().includes(q) ? '참석자 일치'
        : (c.date||'').includes(q) ? '날짜 일치' : '내용 일치';
      results.push({
        tab:'comm', threadType:'comm', icon:'💬', section:'커뮤니케이션',
        title:`${c.date} · ${c.type}`,
        meta:`${c.participants||''}  ·  ${matchIn}`,
        preview:(c.content||'').replace(/\n/g,' ').slice(0,80),
        id:c.id,
      });
    }
  });

  const files = await db.getByIndex('files','projectId',PROJECT_ID);
  files.forEach(f=>{
    if((f.name||'').toLowerCase().includes(q)||(f.category||'').toLowerCase().includes(q)){
      results.push({
        tab:'files', icon:'📎', section:'파일',
        title:f.name,
        meta:`${f.category} · ${fmtSize(f.size)}`,
        id:f.id,
      });
    }
  });

  const issues = await db.getByIndex('issues','projectId',PROJECT_ID);
  issues.forEach(i=>{
    const fields = [i.title, i.content, i.assignee, i.category];
    if(fields.some(f=>(f||'').toLowerCase().includes(q))){
      const pl={high:'🔴 높음',medium:'🟡 보통',low:'🟢 낮음'};
      const matchIn = (i.title||'').toLowerCase().includes(q) ? '제목 일치'
        : (i.assignee||'').toLowerCase().includes(q) ? '담당자 일치' : '내용 일치';
      results.push({
        tab:'issues', threadType:'issue', icon:'⚠️', section:'이슈',
        title:i.title,
        meta:`${pl[i.priority]||''} · ${i.category} · ${matchIn}`,
        preview:(i.content||'').replace(/\n/g,' ').slice(0,80),
        id:i.id,
      });
    }
  });

  const notes = await db.getByIndex('notes','projectId',PROJECT_ID);
  notes.forEach(n=>{
    if((n.title||'').toLowerCase().includes(q)||(n.content||'').toLowerCase().includes(q)){
      const matchIn = (n.title||'').toLowerCase().includes(q) ? '제목 일치' : '내용 일치';
      results.push({
        tab:'notes', threadType:'note', icon:'📝', section:'노트',
        title:n.title||'(제목 없음)',
        meta:`${new Date(n.updatedAt).toLocaleDateString('ko-KR')} · ${matchIn}`,
        preview:(n.content||'').replace(/\n/g,' ').slice(0,80),
        id:n.id,
      });
    }
  });

  const todos = await db.getByIndex('todos','projectId',PROJECT_ID);
  todos.forEach(t=>{
    if([t.content,t.memo,t.assignee].some(f=>(f||'').toLowerCase().includes(q))){
      results.push({
        tab:'todo', icon:'📅', section:'할일',
        title:t.content,
        meta:`${t.date}${t.done?' · ✅ 완료':''}${t.assignee?' · '+t.assignee:''}`,
        id:t.id,
        date:t.date,
      });
    }
  });

  return results;
}

async function renderGsearchResults(query){
  const el = document.getElementById('gsearch-results');
  if(!el) return;
  gsearchFocusIdx = -1;

  if(!query.trim()){
    el.innerHTML = '<div class="gsearch-empty">검색어를 입력하세요</div>';
    return;
  }

  const results = await runGlobalSearch(query);

  if(!results.length){
    el.innerHTML = `<div class="gsearch-empty">"${esc(query)}" 검색 결과가 없습니다</div>`;
    return;
  }

  const sections = {};
  results.forEach(r=>{
    if(!sections[r.section]) sections[r.section]=[];
    sections[r.section].push(r);
  });

  let html = '';
  const sectionOrder = ['커뮤니케이션','파일','이슈','노트','할일'];
  sectionOrder.forEach(sec=>{
    const items = sections[sec];
    if(!items) return;
    html += `<div class="gsearch-section-label">${esc(sec)} <span style="font-weight:400;letter-spacing:0">(${items.length})</span></div>`;
    items.forEach(r=>{
      const titleHtml = gsHighlight(r.title, query);
      const previewText = r.preview ? r.preview : '';
      const previewHtml = previewText ? gsHighlight(previewText, query) : '';
      const metaStr = r.meta || '';
      html += `
        <div class="gsearch-item" data-gtab="${esc(r.tab)}" data-gid="${esc(r.id)}" data-gtype="${esc(r.threadType||'')}" data-gdate="${esc(r.date||'')}">
          <span class="gsearch-item-icon">${r.icon}</span>
          <div class="gsearch-item-body">
            <div class="gsearch-item-title">${titleHtml}</div>
            <div class="gsearch-item-meta">${esc(metaStr)}${previewHtml?' — '+previewHtml:''}</div>
          </div>
          <span class="gsearch-item-badge">${esc(sec)}</span>
        </div>`;
    });
  });

  el.innerHTML = html;
}

function gsearchGo(item){
  const tab = item.dataset.gtab;
  const id = item.dataset.gid;
  const type = item.dataset.gtype;
  const date = item.dataset.gdate;
  closeGlobalSearch();
  renderTab(tab);
  if(type && ['comm','issue','note'].includes(type)){
    setTimeout(()=>openThread(id, type), 150);
  } else if(tab==='todo' && date){
    todoSelectedDate = date;
    todoView = 'daily';
    setTimeout(()=>renderTodo(), 50);
  }
}

// ── EVENT LISTENERS ───────────────────────────────────────────────
document.getElementById('tab-nav').addEventListener('click', e=>{
  const btn=e.target.closest('button');
  if(!btn) return;
  if(btn.dataset.tab) renderTab(btn.dataset.tab);
  else if(btn.dataset.tabGroup==='workspace') renderTab(currentSubTab);
  else if(btn.dataset.tabGroup==='steps') renderTab(currentStepsSubTab);
});
document.getElementById('sub-tab-nav').addEventListener('click', e=>{
  const btn=e.target.closest('button');
  if(btn&&btn.dataset.tab) renderTab(btn.dataset.tab);
});
document.getElementById('steps-sub-nav').addEventListener('click', e=>{
  const btn=e.target.closest('button');
  if(btn&&btn.dataset.tab) renderTab(btn.dataset.tab);
});
document.getElementById('btn-edit-proj').addEventListener('click',()=>showProjectModal(false));
document.getElementById('btn-agent-settings').addEventListener('click',openAgentSettings);
document.getElementById('btn-export').addEventListener('click',exportData);
document.getElementById('btn-import').addEventListener('click',()=>document.getElementById('import-input').click());
document.getElementById('btn-import-queue').addEventListener('click',()=>importFromQueue());
document.getElementById('import-input').addEventListener('change',e=>{
  importData(e.target.files[0]);
  e.target.value='';
});
let _modalMousedownOnOverlay = false;
document.getElementById('modal-overlay').addEventListener('mousedown', e=>{
  _modalMousedownOnOverlay = e.target === document.getElementById('modal-overlay');
});
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(_modalMousedownOnOverlay && e.target === document.getElementById('modal-overlay') && e.target.dataset.preventClose!=='1') closeModal();
  _modalMousedownOnOverlay = false;
});
document.getElementById('modal-close').addEventListener('click', closeModal);

// global search
document.getElementById('btn-global-search').addEventListener('click', openGlobalSearch);
document.getElementById('gsearch-close-kbd').addEventListener('click', closeGlobalSearch);
document.getElementById('gsearch-overlay').addEventListener('click', e=>{
  if(e.target===document.getElementById('gsearch-overlay')) closeGlobalSearch();
});
document.getElementById('gsearch-input').addEventListener('input', e=>{
  renderGsearchResults(e.target.value);
});
document.getElementById('gsearch-input').addEventListener('keydown', e=>{
  const items = document.querySelectorAll('.gsearch-item');
  if(e.key==='ArrowDown'){
    e.preventDefault();
    gsearchFocusIdx = Math.min(gsearchFocusIdx+1, items.length-1);
    items.forEach((el,i)=>el.classList.toggle('focused',i===gsearchFocusIdx));
    if(items[gsearchFocusIdx]) items[gsearchFocusIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    gsearchFocusIdx = Math.max(gsearchFocusIdx-1, 0);
    items.forEach((el,i)=>el.classList.toggle('focused',i===gsearchFocusIdx));
    if(items[gsearchFocusIdx]) items[gsearchFocusIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    const focused = items[gsearchFocusIdx];
    if(focused) gsearchGo(focused);
  } else if(e.key==='Escape'){
    closeGlobalSearch();
  }
});
document.getElementById('gsearch-results').addEventListener('click', e=>{
  const item = e.target.closest('.gsearch-item');
  if(item) gsearchGo(item);
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){
    e.preventDefault();
    openGlobalSearch();
  }
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){
    const tag = document.activeElement?.tagName;
    const editable = tag==='INPUT'||tag==='TEXTAREA'||document.activeElement?.isContentEditable;
    if(editable) return;
    e.preventDefault();
    undoLast();
  }
});

// ── THEME ─────────────────────────────────────────────────────────
function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  document.getElementById('btn-theme').dataset.theme = theme;
}
function getSystemTheme(){
  return window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
}
(function initTheme(){
  const saved = localStorage.getItem('mce-theme');
  applyTheme(saved || getSystemTheme());
})();
document.getElementById('btn-theme').addEventListener('click',()=>{
  const next = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem('mce-theme', next);
});

// ── START ────────────────────────────────────────────────────────
init();
