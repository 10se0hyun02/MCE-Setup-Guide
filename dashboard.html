<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ── Modern Minimal ── */
:root {
  --blue:#2563eb; --blue-bg:rgba(37,99,235,.07);
  --green:#16a34a; --green-bg:rgba(22,163,74,.07);
  --amber:#d97706; --amber-bg:rgba(217,119,6,.07);
  --red:#dc2626; --red-bg:rgba(220,38,38,.07);
  --purple:#7c3aed; --purple-bg:rgba(124,58,237,.07);
  --bg:#f4f4f5; --bg2:#ffffff; --bg3:#e4e4e7;
  --text:#111111; --text2:#52525b; --text3:#a1a1aa;
  --border:rgba(0,0,0,.07); --border2:rgba(0,0,0,.12);
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.09);
  --radius:5px; --radius-lg:8px;
  --header-h:48px;
  --sidebar-w:212px;
  --proj-color:#2563eb;
  --proj-color-bg:color-mix(in srgb,var(--proj-color) 10%,transparent);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --blue:#3b82f6; --blue-bg:rgba(59,130,246,.12);
    --green:#22c55e; --green-bg:rgba(34,197,94,.12);
    --amber:#f59e0b; --amber-bg:rgba(245,158,11,.12);
    --red:#ef4444; --red-bg:rgba(239,68,68,.12);
    --purple:#a78bfa; --purple-bg:rgba(167,139,250,.12);
    --bg:#0f0f0f; --bg2:#1a1a1a; --bg3:#242424;
    --text:#f0f0f0; --text2:#a0a0a0; --text3:#555555;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  }
}
[data-theme="dark"]{
  --blue:#3b82f6; --blue-bg:rgba(59,130,246,.12);
  --green:#22c55e; --green-bg:rgba(34,197,94,.12);
  --amber:#f59e0b; --amber-bg:rgba(245,158,11,.12);
  --red:#ef4444; --red-bg:rgba(239,68,68,.12);
  --purple:#a78bfa; --purple-bg:rgba(167,139,250,.12);
  --bg:#0f0f0f; --bg2:#1a1a1a; --bg3:#242424;
  --text:#f0f0f0; --text2:#a0a0a0; --text3:#555555;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 8px 24px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --blue:#2563eb; --blue-bg:rgba(37,99,235,.07);
  --green:#16a34a; --green-bg:rgba(22,163,74,.07);
  --amber:#d97706; --amber-bg:rgba(217,119,6,.07);
  --red:#dc2626; --red-bg:rgba(220,38,38,.07);
  --purple:#7c3aed; --purple-bg:rgba(124,58,237,.07);
  --bg:#f4f4f5; --bg2:#ffffff; --bg3:#e4e4e7;
  --text:#111111; --text2:#52525b; --text3:#a1a1aa;
  --border:rgba(0,0,0,.07); --border2:rgba(0,0,0,.12);
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.09);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Pretendard Variable','Noto Sans KR',sans-serif;
  font-size:14px;line-height:1.6;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ── LAYOUT ── */
#app-body{display:flex;height:100%;overflow:hidden}
#main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--bg);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
#sidebar-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;overflow-x:hidden}
#sidebar-footer{
  border-top:1px solid var(--border);padding:10px 8px;
  display:flex;flex-direction:column;gap:2px;flex-shrink:0;
}
.sb-footer-btn{
  display:flex;align-items:center;width:100%;
  padding:6px 8px;border-radius:var(--radius);border:none;background:none;
  font-size:12px;color:var(--text3);cursor:pointer;text-align:left;
  text-decoration:none;transition:background .1s,color .1s;white-space:nowrap;
}
.sb-footer-btn:hover{background:var(--bg3);color:var(--text2)}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb-group-label{
  font-size:10px;font-weight:500;letter-spacing:.01em;
  color:var(--text3);padding:0 8px;margin-bottom:5px;display:block;
}
.sb-item{
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;border-radius:var(--radius);
  font-size:13px;color:var(--text3);
  cursor:pointer;border:none;background:none;
  width:100%;text-align:left;
  transition:background .12s,color .12s;white-space:nowrap;
}
.sb-item:hover{background:var(--bg3);color:var(--text2)}
.sb-item.active{
  background:color-mix(in srgb,var(--proj-color) 12%,transparent);
  color:var(--proj-color);font-weight:600;
}
.sb-item-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--proj-color);flex-shrink:0;
  opacity:0;transition:opacity .12s;
}
.sb-item.active .sb-item-dot{opacity:1}

/* ── HEADER (hidden — content moved to sidebar) ── */
#app-header{display:none!important}

/* ── SIDEBAR TOP (brand + project) ── */
#sb-top{
  padding:14px 12px 12px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.sb-brand{
  display:flex;align-items:center;gap:6px;
  margin-bottom:10px;
}
.sb-brand-icon{
  width:22px;height:22px;border-radius:6px;
  background:var(--proj-color);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sb-brand-icon svg{display:block}
.sb-brand-name{
  flex:1;font-size:12px;font-weight:700;color:var(--text);
  letter-spacing:-.01em;
}
#btn-edit-proj{
  background:none;border:none;color:var(--text3);
  border-radius:var(--radius);padding:2px 5px;font-size:10px;cursor:pointer;
  opacity:0;transition:opacity .1s,background .1s,color .1s;flex-shrink:0;
}
#sb-top:hover #btn-edit-proj{opacity:1}
#btn-edit-proj:hover{background:var(--bg3);color:var(--text2)}
#proj-info{display:flex;flex-direction:column;gap:0}
#btn-proj-switch{
  display:flex;align-items:center;gap:6px;
  background:none;border:none;
  border-radius:var(--radius);padding:5px 6px;margin:0 -6px;
  font-size:13px;font-weight:600;color:var(--text);
  cursor:pointer;width:calc(100% + 12px);text-align:left;
  transition:background .1s;
}
#btn-proj-switch:hover{background:var(--bg3)}
#proj-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#proj-meta{
  font-size:11px;color:var(--text3);
  padding:2px 6px;
}
.meta-item+.meta-item::before{content:'·';margin:0 3px;color:var(--text3)}

/* ── SIDEBAR FOOTER ── */
#sb-bottom-actions{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;border-top:1px solid var(--border);
  flex-shrink:0;
}
#btn-global-search{
  flex:1;display:flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius);padding:5px 8px;
  font-size:12px;color:var(--text3);cursor:pointer;
  transition:background .1s,color .1s;text-align:left;
}
#btn-global-search:hover{background:var(--border2);color:var(--text)}
#btn-theme{
  width:32px;height:32px;border-radius:var(--radius);padding:0;
  background:var(--bg3);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;cursor:pointer;font-size:14px;transition:background .15s;
}
#btn-theme:hover{background:var(--border2)}
[data-theme="dark"] #btn-theme .icon-moon{display:none}
[data-theme="dark"] #btn-theme .icon-sun{display:block!important}

/* ── TAB NAV (hidden — moved to sidebar) ── */
#tab-nav,#sub-tab-nav,#steps-sub-nav{display:none!important}

/* ── SESCO EDIT MODE ── */
.sesco-edit-mode td[contenteditable="true"]{
  outline:1px dashed var(--blue);
  background:rgba(59,130,246,.06);
  cursor:text;
  min-width:30px;
}
.sesco-edit-mode td[contenteditable="true"]:focus{
  outline:2px solid var(--blue);
  background:rgba(59,130,246,.12);
}
.sesco-edit-mode td.sesco-cell-sel,
.sesco-edit-mode th.sesco-cell-sel{
  background:rgba(59,130,246,.22)!important;
  outline:2px solid var(--blue)!important;
  outline-offset:-1px;
}
.sesco-edit-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border2);
  font-size:12px;font-weight:500;cursor:pointer;
  background:none;color:var(--text2);transition:background .1s,border-color .1s,color .1s;
}
.sesco-edit-btn:hover{background:var(--proj-color-bg);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);color:var(--proj-color)}
.sesco-edit-btn.saving{background:var(--proj-color);color:#fff;border-color:var(--proj-color)}

/* ── SESCO TABLE HEADER ── */
.sesco-resizable thead th,
.sesco-resizable tr:first-child th{
  position:relative;overflow:visible;
  background:var(--bg3)!important;
  color:var(--text)!important;
  font-weight:700!important;
  font-size:13px!important;
  letter-spacing:.02em;
  border:1px solid var(--border2)!important;
  border-bottom:2px solid var(--blue)!important;
  padding:9px 10px!important;
  white-space:nowrap;
}
/* 데이터 행 경계선도 조금 강화 */
.sesco-resizable tbody td{
  border-color:var(--border2)!important;
}
.sesco-resizable tbody tr:hover td{
  background:rgba(59,130,246,.04);
}

/* ── COLUMN RESIZE ── */
.col-resize-handle{
  position:absolute;right:-2px;top:0;bottom:0;width:5px;
  cursor:col-resize;z-index:2;user-select:none;
}
.col-resize-handle:hover,.col-resize-handle.dragging{
  background:var(--blue);opacity:.5;border-radius:2px;
}

/* ── COLUMN FILTER ── */
.th-inner{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%}
.th-filter-btn{
  flex-shrink:0;width:14px;height:14px;border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;cursor:pointer;color:var(--text2);
  border:1px solid transparent;line-height:1;
  transition:all .1s;
}
.th-filter-btn:hover{background:rgba(255,255,255,.1);border-color:var(--border);color:var(--text)}
.th-filter-btn.active{background:var(--proj-color-bg);color:var(--proj-color);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);font-weight:600}
#sesco-ctx-menu{
  position:fixed;z-index:10003;display:none;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--radius);padding:4px;min-width:150px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
#sesco-ctx-menu button{
  display:block;width:100%;text-align:left;
  padding:7px 13px;border:none;background:none;
  cursor:pointer;border-radius:5px;font-size:13px;color:var(--text);
}
#sesco-ctx-menu button:hover{background:var(--bg3)}
#sesco-ctx-menu .ctx-sep{border:none;border-top:1px solid var(--border);margin:3px 0}
#col-filter-dd{
  position:fixed;z-index:10000;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:6px;
  min-width:160px;max-width:240px;max-height:300px;
  overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.5);
  font-size:12px;
}
.filter-dd-head{
  display:flex;gap:4px;margin-bottom:6px;
}
.filter-dd-head button{
  flex:1;padding:3px 0;border-radius:4px;border:1px solid var(--border);
  background:var(--bg3);color:var(--text2);font-size:11px;cursor:pointer;
}
.filter-dd-head button:hover{border-color:var(--blue);color:var(--blue)}
.filter-sep{height:1px;background:var(--border);margin:4px 0}
.filter-option{
  display:flex;align-items:center;gap:6px;
  padding:3px 4px;border-radius:4px;cursor:pointer;
  color:var(--text2);
}
.filter-option:hover{background:rgba(255,255,255,.07);color:var(--text)}
.filter-option input[type=checkbox]{
  accent-color:var(--blue);cursor:pointer;width:12px;height:12px;flex-shrink:0;
}
.filter-option span{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.filter-search{
  width:100%;box-sizing:border-box;
  padding:4px 7px;margin-bottom:4px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:5px;color:var(--text);font-size:11px;outline:none;
}
.filter-search:focus{border-color:var(--blue)}

/* ── SESCO FORMAT TOOLBAR ── */
#sesco-fmt-toolbar{
  position:fixed;z-index:9999;
  display:none;
  align-items:center;gap:2px;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:7px;padding:4px 6px;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
  user-select:none;
}
#sesco-fmt-toolbar.visible{display:flex}
#sesco-fmt-toolbar button{
  border:none;background:none;cursor:pointer;
  border-radius:4px;padding:3px 7px;font-size:12px;
  color:var(--text);transition:background .1s;line-height:1;
}
#sesco-fmt-toolbar button:hover{background:var(--bg3)}
#sesco-fmt-toolbar .fmt-sep{width:1px;height:16px;background:var(--border2);margin:0 2px}
.fmt-color{width:14px;height:14px;border-radius:3px;display:inline-block;cursor:pointer;border:1px solid var(--border2)}
#sesco-fmt-toolbar .color-btn{padding:3px 4px;border-radius:4px}
#sesco-fmt-toolbar .color-btn:hover{background:var(--bg3)}
.fmt-size-select{
  background:var(--bg3);color:var(--text);
  border:1px solid var(--border2);border-radius:4px;
  font-size:11px;padding:2px 4px;cursor:pointer;outline:none;
  height:22px;
}
.fmt-size-select:focus{border-color:var(--blue)}

/* ── TAB CONTENT ── */
#tab-content{flex:1;display:flex;overflow:hidden}
.list-pane{flex:1;overflow-y:auto;padding:24px 28px;min-width:0}
/* ── THREAD PANE ── */
.thread-pane{
  width:0;min-width:0;overflow:hidden;flex-shrink:0;
  border-left:none;
  display:flex;flex-direction:column;
  background:var(--bg);
  transition:width .2s ease;
}
.thread-pane.open{border-left:1px solid var(--border2)}
.thread-pane.overlay-mode{position:absolute;right:0;top:0;height:100%;z-index:50;box-shadow:-4px 0 20px rgba(0,0,0,.12);}
.pane-resizer{
  width:0;flex-shrink:0;cursor:col-resize;
  background:var(--border2);position:relative;
  transition:width .2s ease, background .15s;
  user-select:none;
}
.pane-resizer.visible{width:4px}
.pane-resizer.visible:hover,.pane-resizer.dragging{background:var(--blue)}
.pane-resizer::after{
  content:'';position:absolute;
  top:0;bottom:0;left:-6px;right:-6px;
}
.thread-header{
  display:flex;align-items:center;gap:10px;
  padding:13px 16px;border-bottom:1px solid var(--border);
  background:var(--bg2);flex-shrink:0;
}
.thread-header-title{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread-close{background:none;border:none;cursor:pointer;font-size:16px;color:var(--text3);padding:2px 6px;border-radius:4px}
.thread-close:hover{background:var(--bg3);color:var(--text)}
.thread-original-meta{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap}
.thread-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.thread-orig-block{padding-bottom:16px;margin-bottom:4px;border-bottom:1px solid var(--border2)}
.thread-msg{background:var(--bg2);border-radius:var(--radius);padding:10px 12px}
.thread-msg-meta{font-size:11px;color:var(--text3);margin-bottom:4px}
.thread-empty{text-align:center;padding:30px 0;color:var(--text3);font-size:13px}
.thread-compose{
  padding:12px 16px;border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:8px;flex-shrink:0;
}
.thread-compose .note-toolbar{border-radius:var(--radius) var(--radius) 0 0;margin-bottom:0}
.thread-compose textarea{
  width:100%;border:1px solid var(--border2);border-top:none;border-radius:0 0 var(--radius) var(--radius);
  padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.6;
  color:var(--text);background:var(--bg);resize:none;min-height:68px;
}
.thread-compose textarea:focus{outline:none;border-color:var(--blue)}
.thread-compose-row{display:flex;justify-content:flex-end}
.thread-trigger{cursor:pointer}
.thread-trigger:hover{color:var(--blue)}
.card-selected{outline:2px solid var(--blue);outline-offset:-1px}

/* ── PROGRESS TAB ── */
.progress-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.progress-bar-wrap{flex:1;background:var(--bg3);border-radius:99px;height:8px;overflow:hidden}
.progress-bar-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.progress-label{font-size:13px;color:var(--text2);white-space:nowrap}
.step-group{margin-bottom:24px}
.step-group-title{
  font-size:12px;font-weight:600;letter-spacing:0;
  color:var(--text2);margin-bottom:8px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.step-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--bg2);
  margin-bottom:6px;box-shadow:var(--shadow);
}
.step-item:hover{border-color:var(--border2)}
.step-num{font-size:11px;color:var(--text3);min-width:40px;font-weight:500}
.step-toggle{
  font-size:18px;cursor:pointer;line-height:1;
  background:none;border:none;padding:0;
  transition:transform .15s;
}
.step-toggle:hover{transform:scale(1.1)}
.step-title{flex:1;font-weight:500}
.step-status-badge{
  font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;
}
.step-status-badge.pending{background:var(--bg3);color:var(--text3)}
.step-status-badge.in-progress{background:var(--blue-bg);color:var(--blue-text)}
.step-status-badge.done{background:var(--green-bg);color:var(--green)}
.step-guide-link{
  font-size:11px;color:var(--blue);text-decoration:none;white-space:nowrap;
}
.step-guide-link:hover{text-decoration:underline}

/* ── COMM TAB ── */
.tab-toolbar{display:flex;gap:8px;margin-bottom:0;align-items:center}
.slack-member-section{
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg2);padding:10px 14px;margin-bottom:14px;
}
.slack-member-row{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--border2)}
.slack-member-row:last-of-type{border-bottom:none}
.slack-thread-preview{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden;margin-bottom:12px;max-height:320px;overflow-y:auto}
.slack-date-header{font-size:11px;font-weight:600;color:var(--text3);background:var(--bg2);border-bottom:1px solid var(--border);padding:4px 12px;letter-spacing:.02em;position:sticky;top:0}
.slack-msg{padding:7px 12px;border-bottom:1px solid var(--border2);font-size:13px;line-height:1.5}
.slack-msg:last-child{border-bottom:none}
.slack-msg-meta{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.slack-msg-time{color:var(--text3);font-variant-numeric:tabular-nums;font-size:11px;flex-shrink:0}
.slack-msg-speaker{color:var(--proj-color);font-weight:600;font-size:12px;white-space:nowrap}
.slack-msg-text{color:var(--text2);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.slack-code{background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:11px;font-family:monospace}
.slack-codeblock{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12px;font-family:monospace;white-space:pre;overflow-x:auto;margin:4px 0;line-height:1.5;color:var(--text)}
.tab-toolbar input[type=text]{
  flex:1;padding:7px 12px;border:1px solid var(--border2);
  border-radius:var(--radius);background:var(--bg);color:var(--text);
  font-size:13px;
}
.tab-toolbar input[type=text]:focus{outline:none;border-color:var(--blue)}
.btn-primary{
  background:var(--proj-color);color:#fff;border:1px solid transparent;
  border-radius:var(--radius);padding:7px 16px;font-size:13px;
  display:inline-flex;align-items:center;gap:5px;
  cursor:pointer;white-space:nowrap;font-weight:600;
  transition:background .1s,transform .05s;
}
.btn-primary:hover{background:color-mix(in srgb,var(--proj-color) 86%,#000)}
.btn-primary:active{transform:scale(.98)}
.btn-icon{
  background:var(--proj-color);color:#fff;border:none;
  border-radius:var(--radius);padding:7px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .1s,transform .05s;flex-shrink:0;
}
.btn-icon:hover{background:color-mix(in srgb,var(--proj-color) 86%,#000)}
.btn-icon:active{transform:scale(.96)}
.btn-ghost{
  background:none;border:1px solid var(--border2);color:var(--text2);
  border-radius:var(--radius);padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;
  transition:background .1s,border-color .1s,color .1s;
  display:inline-flex;align-items:center;gap:5px;
}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.comm-list{display:flex;flex-direction:column;gap:10px}
.comm-card{
  border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--bg2);overflow:hidden;box-shadow:var(--shadow);
}
.comm-card-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);
}
.comm-date{font-weight:600;font-size:13px}
.comm-type-badge{
  font-size:11px;padding:2px 8px;border-radius:99px;
  background:var(--blue-bg);color:var(--blue-text);font-weight:500;
}
.comm-participants{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-actions{display:flex;gap:4px}
.card-actions button{
  background:none;border:none;cursor:pointer;
  padding:3px 4px;border-radius:4px;
  color:var(--text3);display:flex;align-items:center;line-height:1;
}
.card-actions button:hover{background:var(--bg3);color:var(--text)}
.comm-card-body{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.comm-field label{font-size:11px;font-weight:600;color:var(--text3);display:block;margin-bottom:2px}
.comm-field p{font-size:13px;line-height:1.6;color:var(--text)}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text3);
}
.empty-state p{font-size:15px;margin-bottom:6px}
.empty-state span{font-size:13px}

/* ── FILES TAB ── */
.file-upload-zone{
  border:2px dashed var(--border2);border-radius:var(--radius-lg);
  padding:30px;text-align:center;margin-bottom:20px;
  cursor:pointer;transition:border-color .2s,background .2s;
}
.file-upload-zone:hover,.file-upload-zone.drag-over{
  border-color:var(--blue);background:var(--blue-bg);
}
.file-upload-zone p{color:var(--text2);font-size:13px}
.file-upload-zone span{font-size:12px;color:var(--text3)}
#file-input{display:none}
.file-category-filter{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{
  background:none;border:1px solid var(--border2);color:var(--text2);
  border-radius:var(--radius);padding:3px 10px;font-size:12px;cursor:pointer;
}
.filter-btn:hover{background:var(--proj-color-bg);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);color:var(--proj-color)}
.filter-btn.active{background:var(--proj-color-bg);color:var(--proj-color);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);font-weight:600}
.file-list{display:flex;flex-direction:column;gap:6px}
.file-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg2);box-shadow:var(--shadow);
}
.file-icon{font-size:20px}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11px;color:var(--text3);display:flex;gap:8px}
.file-cat-badge{
  font-size:11px;padding:1px 7px;border-radius:99px;
  background:var(--bg3);color:var(--text2);
}

/* ── ISSUES TAB ── */
.issue-filter-tabs{display:flex;gap:4px;margin-bottom:14px}
.issue-filter-tabs button{
  background:none;border:1px solid var(--border2);color:var(--text2);
  border-radius:var(--radius);padding:4px 12px;font-size:12px;cursor:pointer;
  transition:background .1s,border-color .1s,color .1s;
}
.issue-filter-tabs button:hover:not(.active){background:var(--bg3);color:var(--text)}
.issue-filter-tabs button.active{background:var(--proj-color-bg);color:var(--proj-color);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);font-weight:600}
.issue-list{display:flex;flex-direction:column;gap:8px}
.issue-card{
  border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--bg2);padding:14px;box-shadow:var(--shadow);
}
.issue-card.high{border-left:3px solid var(--red)}
.issue-card.medium{border-left:3px solid var(--amber)}
.issue-card.low{border-left:3px solid var(--green)}
.issue-card-header{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.issue-title{font-weight:600;font-size:14px;flex:1}
.priority-badge{
  font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap;
}
.priority-badge.high{background:var(--red-bg);color:var(--red)}
.priority-badge.medium{background:var(--amber-bg);color:var(--amber)}
.priority-badge.low{background:var(--green-bg);color:var(--green)}
.status-select{
  font-size:11px;padding:2px 6px;border-radius:99px;cursor:pointer;
  border:1px solid var(--border2);background:var(--bg);color:var(--text2);
}
.issue-meta{display:flex;gap:10px;font-size:11px;color:var(--text3);margin-bottom:6px}
.issue-content{font-size:13px;color:var(--text2);line-height:1.6}

/* ── ISSUE BOARD ── */
.issue-board{width:100%;border-collapse:collapse;font-size:13px}
.issue-board thead tr{border-bottom:2px solid var(--border)}
.issue-board th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);white-space:nowrap;user-select:none}
.issue-board th.col-num{width:36px;text-align:center}
.issue-board th.col-cat{width:160px}
.issue-board th.col-pri{width:80px;text-align:right}
.issue-board th.col-status{width:96px;text-align:right}
.issue-board th.col-date{width:80px;text-align:right}
.issue-board th.col-act{width:56px}
.issue-board tbody tr.issue-row{border-bottom:1px solid var(--border2);cursor:pointer;transition:background .1s}
.issue-board tbody tr.issue-row:hover td{background:var(--bg3)}
.issue-board tbody tr.issue-row.card-selected td{background:color-mix(in srgb,var(--proj-color) 8%,var(--bg2))}
.issue-board td{padding:10px 12px;color:var(--text);vertical-align:middle}
.issue-board td.col-num{text-align:center;font-size:11px;color:var(--text3)}
.issue-board td.col-cat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.issue-board td.col-pri,.issue-board td.col-status,.issue-board td.col-date{text-align:right}
.issue-board .ib-title{font-weight:500;display:flex;align-items:center;gap:6px}
.issue-board .ib-pri-bar{width:3px;height:14px;border-radius:2px;flex-shrink:0}
.issue-board .ib-pri-bar.high{background:var(--red)}
.issue-board .ib-pri-bar.medium{background:var(--amber)}
.issue-board .ib-pri-bar.low{background:var(--green)}
.issue-board .ib-cat{font-size:11px;color:var(--text3)}
.issue-board .ib-acts{display:flex;gap:2px;opacity:0;transition:opacity .1s}
.issue-board tr.issue-row:hover .ib-acts{opacity:1}
.issue-board .ib-acts button{background:none;border:none;cursor:pointer;padding:3px;border-radius:4px;color:var(--text3);display:flex;align-items:center;line-height:1}
.issue-board .ib-acts button:hover{background:var(--bg3);color:var(--text)}

/* ── NOTES TAB ── */
.note-card{
  border:1px solid var(--border);border-radius:var(--radius-lg);
  background:var(--bg2);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);
}
.note-card-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);
}
.note-card-title{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-card-date{font-size:11px;color:var(--text3);white-space:nowrap}
.note-card-body{padding:12px 14px;max-height:120px;overflow:hidden;position:relative}
.note-card-body.expanded{max-height:none}
.note-card-fade{
  position:absolute;bottom:0;left:0;right:0;height:40px;
  background:linear-gradient(transparent,var(--bg));
  pointer-events:none;
}
.note-card-body.expanded .note-card-fade{display:none}
/* drag & drop */
.note-drag-handle{cursor:grab;color:var(--text3);font-size:15px;padding:0 4px 0 0;flex-shrink:0;user-select:none;line-height:1}
.note-drag-handle:hover{color:var(--text2)}
.note-card.dragging{opacity:.3;outline:2px dashed var(--blue)}
.note-card.drag-over{outline:2px solid var(--blue);outline-offset:-2px;background:var(--bg3)}
/* category */
.note-cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#EAF4FF;color:var(--blue);white-space:nowrap;flex-shrink:0;letter-spacing:.02em}
.note-cat-bar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:10px;margin-bottom:2px;scrollbar-width:none;min-height:34px;align-items:center}
.note-cat-bar::-webkit-scrollbar{display:none}
.cat-chip{border:1px solid var(--border2);border-radius:var(--radius);padding:4px 12px;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .1s}
.cat-chip:hover{background:var(--proj-color-bg);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);color:var(--proj-color)}
.cat-chip.active{background:var(--proj-color-bg);color:var(--proj-color);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);font-weight:600}
.note-expand-btn{
  background:none;border:none;color:var(--blue);font-size:12px;
  cursor:pointer;padding:4px 14px 10px;display:block;width:100%;text-align:left;
}
#note-modal-textarea{
  width:100%;border:1px solid var(--border2);
  border-radius:0 0 var(--radius) var(--radius);
  padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Pretendard Variable','Noto Sans KR',sans-serif;font-size:13px;line-height:1.7;
  color:var(--text);background:var(--bg);resize:vertical;min-height:220px;
}
#note-modal-textarea:focus{outline:none;border-color:var(--blue)}
.note-toolbar{
  display:flex;align-items:center;gap:2px;flex-wrap:wrap;
  padding:5px 7px;background:var(--bg2);
  border:1px solid var(--border2);border-bottom:none;
  border-radius:var(--radius) var(--radius) 0 0;
}
.note-toolbar button{
  background:none;border:none;cursor:pointer;
  padding:3px 7px;border-radius:4px;
  font-size:12px;color:var(--text2);line-height:1.5;
  white-space:nowrap;
}
.note-toolbar button:hover{background:var(--bg3);color:var(--text)}
.note-toolbar .tb-sep{width:1px;height:14px;background:var(--border2);margin:0 3px;flex-shrink:0}
/* Markdown rendered output */
.note-rendered{font-size:13px;line-height:1.7;color:var(--text)}
.note-rendered h3{font-size:15px;font-weight:700;margin:10px 0 4px;color:var(--text)}
.note-rendered h4{font-size:13px;font-weight:700;margin:8px 0 3px;color:var(--text)}
.note-rendered h5{font-size:12px;font-weight:700;margin:6px 0 2px;color:var(--text)}
.note-rendered h6{font-size:11px;font-weight:600;margin:4px 0 2px;color:var(--text2)}
.note-rendered p{margin:2px 0}
.note-rendered br{display:block;content:'';margin:1px 0}
.note-rendered ul{margin:4px 0;padding-left:18px;list-style:disc}
.note-rendered ol{margin:4px 0;padding-left:18px;list-style:decimal}
.note-rendered li{margin:1px 0}
.note-rendered hr{border:none;border-top:1px solid var(--border2);margin:10px 0}
.note-rendered code{font-family:monospace;background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:12px}
.note-rendered pre{background:var(--bg3);border-radius:6px;padding:10px 12px;margin:6px 0;overflow-x:auto}
.note-rendered pre code{background:none;padding:0;font-size:12px;line-height:1.6;white-space:pre}
.note-rendered blockquote{border-left:3px solid var(--blue);margin:6px 0;padding:4px 10px;color:var(--text2);background:var(--bg2);border-radius:0 4px 4px 0}
.note-rendered blockquote p{margin:1px 0}
.note-rendered strong{font-weight:700}
.note-rendered em{font-style:italic;color:var(--text2)}
.note-rendered del{text-decoration:line-through;color:var(--text3)}
.note-rendered a{color:var(--blue);text-decoration:underline}
.note-rendered mark{background:rgba(255,220,0,.28);border-radius:2px;padding:0 2px}
.note-rendered .md-check{display:flex;align-items:flex-start;gap:6px;margin:2px 0}
.note-rendered .md-check.done{color:var(--text3);text-decoration:line-through}
.note-rendered .md-check.clickable{cursor:pointer;border-radius:4px;padding:1px 4px;margin:1px -4px}
.note-rendered .md-check.clickable:hover{background:var(--bg3)}

/* ── MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.modal-overlay.hidden{display:none}
.modal{
  background:var(--bg2);border-radius:var(--radius-lg);
  border:1px solid var(--border2);
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
}
.modal.modal-wide{max-width:900px}
/* split editor */
.editor-split{display:flex;border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;min-height:260px}
.editor-pane-write{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border2);min-width:0}
.editor-pane-write .note-toolbar{border-radius:0;border:none;border-bottom:1px solid var(--border2)}
.editor-pane-write textarea{flex:1;border:none !important;border-radius:0 !important;min-height:220px;resize:none;padding:10px 12px;font-family:inherit;font-size:13px;line-height:1.7;color:var(--text);background:var(--bg)}
.editor-pane-write textarea:focus{outline:none}
.editor-pane-preview{flex:1;display:flex;flex-direction:column;background:var(--bg2);min-width:0}
.eprev-label{font-size:11px;font-weight:600;color:var(--text3);padding:5px 10px;border-bottom:1px solid var(--border);letter-spacing:.04em}
.eprev-body{flex:1;padding:10px 12px;overflow-y:auto;min-height:220px}
.eprev-body:empty::after{content:'미리보기';color:var(--text3);font-size:13px}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--bg);z-index:1;
}
.modal-title{font-weight:700;font-size:15px}
.modal-close{
  background:none;border:none;font-size:18px;cursor:pointer;
  color:var(--text3);padding:2px 6px;border-radius:4px;
}
.modal-close:hover{background:var(--bg2);color:var(--text)}
.modal-body{padding:20px}
.modal-footer{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;
  position:sticky;bottom:0;background:var(--bg);
}

/* ── COMM SIDE PANEL ── */
.comm-side-panel{
  position:fixed;top:0;right:0;width:min(640px,50vw);height:100vh;
  background:var(--bg2);border-left:1px solid var(--border2);
  box-shadow:-6px 0 32px rgba(0,0,0,.14);
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;z-index:500;
}
.comm-side-panel.open{transform:translateX(0)}
.comm-panel-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  background:var(--bg2);position:sticky;top:0;z-index:1;
}
.comm-panel-title{font-weight:700;font-size:15px}
.comm-panel-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);padding:2px 6px;border-radius:4px}
.comm-panel-close:hover{background:var(--bg3);color:var(--text)}
.comm-panel-body{flex:1;overflow-y:auto;padding:20px}
.comm-panel-footer{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;background:var(--bg2);
}
.comm-panel-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:499;
}
.comm-panel-backdrop.open{opacity:1;pointer-events:auto}

/* ── FORM ── */
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border2);
  border-radius:var(--radius);background:var(--bg);color:var(--text);
  font-family:inherit;font-size:13px;
}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{
  outline:none;border-color:var(--blue);
}
.form-row textarea{resize:vertical;min-height:80px}
.form-row select{cursor:pointer}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:11px;color:var(--text3);margin-top:4px}
.btn-danger{
  background:none;border:1px solid var(--red);color:var(--red);
  border-radius:var(--radius);padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;
  transition:background .1s,transform .05s;
  display:inline-flex;align-items:center;gap:5px;
}
.btn-danger:hover{background:#fee2e2}
.btn-danger:active{transform:scale(.98)}

/* ── UPLOAD MODAL ── */
.upload-preview{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:var(--bg2);border-radius:var(--radius);
  margin-top:8px;
}
.upload-preview .file-name-preview{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-preview .file-size-preview{font-size:12px;color:var(--text3)}

/* ── TODO TAB ── */
.todo-layout{display:flex;flex:1;overflow:hidden}
.todo-left-pane{width:220px;flex-shrink:0;border-right:1px solid var(--border2);display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
.todo-cal-pane{flex-shrink:0;overflow-y:auto;padding:16px;background:var(--bg2);border-bottom:1px solid var(--border)}
.todo-list-pane{flex:1;overflow:hidden;padding:20px;min-width:0;display:flex;flex-direction:column}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-month-label{font-weight:700;font-size:14px;color:var(--text)}
.cal-nav{background:none;border:none;cursor:pointer;font-size:18px;padding:2px 8px;border-radius:4px;color:var(--text2);line-height:1}
.cal-nav:hover{background:var(--bg3);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding:4px 0}
.cal-day{text-align:center;font-size:12px;padding:5px 2px;border-radius:4px;cursor:pointer;position:relative;user-select:none;min-height:32px}
.cal-day:hover{background:var(--bg3)}
.cal-day.empty{cursor:default;pointer-events:none;background:none}
.cal-day.today{font-weight:700;color:var(--proj-color)}
.cal-day.selected{background:var(--proj-color-bg) !important;color:var(--proj-color) !important;font-weight:600;border:1px solid color-mix(in srgb,var(--proj-color) 30%,transparent)}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--proj-color);margin:2px auto 0}
.cal-day.selected .cal-dot{background:var(--proj-color)}
.todo-date-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.todo-date-label{font-size:15px;font-weight:700;color:var(--text)}
.todo-count-badge{font-size:12px;color:var(--text3)}
.todo-add-section{border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);margin-bottom:16px;overflow:hidden}
.todo-add-main{display:flex}
.todo-add-main input{flex:1;border:none;padding:10px 12px;background:transparent;color:var(--text);font-family:inherit;font-size:13px}
.todo-add-main input:focus{outline:none}
.todo-add-toggle{background:none;border:none;border-left:1px solid var(--border2);padding:8px 10px;cursor:pointer;color:var(--text3);font-size:12px;white-space:nowrap}
.todo-add-toggle:hover{color:var(--text);background:var(--bg2)}
.todo-add-btn{background:var(--proj-color);color:#fff;border:none;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;border-left:1px solid rgba(0,0,0,.1);transition:background .1s}
.todo-add-btn:hover{background:color-mix(in srgb,var(--proj-color) 86%,#000)}
.todo-detail-fields{padding:10px 12px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.todo-detail-fields.hidden{display:none}
.todo-detail-fields input{width:100%;padding:6px 8px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;font-size:12px}
.todo-detail-fields input:focus{outline:none;border-color:var(--blue)}
.todo-detail-fields .memo-row{grid-column:1/-1}
.todo-rollover-section{margin-bottom:14px;border:1px solid var(--amber);border-radius:var(--radius-lg);overflow:hidden}
.todo-rollover-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--amber-bg);cursor:pointer;user-select:none}
.todo-rollover-header-label{font-size:12px;font-weight:700;color:var(--amber);flex:1}
.todo-rollover-count{font-size:11px;background:var(--amber);color:var(--bg);border-radius:99px;padding:1px 7px;font-weight:600}
.btn-rollover-all{font-size:11px;padding:3px 9px;border:1px solid var(--amber);color:var(--amber);background:none;border-radius:6px;cursor:pointer;white-space:nowrap;transition:background .1s,color .1s}
.btn-rollover-all:hover{background:#fef3c7;color:var(--amber)}
.todo-rollover-list{padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.todo-rollover-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}
.todo-rollover-from{font-size:10px;font-weight:600;color:var(--amber);background:var(--amber-bg);border-radius:99px;padding:1px 6px;white-space:nowrap;flex-shrink:0}
.btn-rollover-one{font-size:11px;padding:2px 8px;border:1px solid var(--border2);color:var(--text2);background:none;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:border-color .1s,color .1s}
.btn-rollover-one:hover{border-color:var(--proj-color);color:var(--proj-color)}
.todo-rolled-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--amber);background:var(--amber-bg);border-radius:99px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
.btn-restore-one{font-size:10px;padding:1px 6px;border:1px solid var(--amber);color:var(--amber);background:none;border-radius:6px;cursor:pointer;transition:background .1s}
.btn-restore-one:hover{background:#fef3c7}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);margin-bottom:6px;box-shadow:var(--shadow)}
.todo-item:hover{border-color:var(--border2)}
.todo-item.done-item .todo-text{text-decoration:line-through;color:var(--text3)}
.todo-checkbox{width:16px;height:16px;flex-shrink:0;cursor:pointer;margin-top:2px;accent-color:var(--blue)}
.todo-body{flex:1;min-width:0}
.todo-text{font-size:13px;color:var(--text);line-height:1.5;word-break:break-word}
.todo-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.todo-chip{font-size:11px;color:var(--text3)}
.todo-chip-comm{font-size:11px;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.todo-chip-comm:hover{color:var(--proj-color)}
.todo-memo-text{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.5}
.todo-item-actions{display:flex;gap:2px;flex-shrink:0}
.todo-item-actions button{background:none;border:none;cursor:pointer;padding:3px 4px;border-radius:4px;color:var(--text3);display:flex;align-items:center;line-height:1}
.todo-item-actions button:hover{background:var(--bg3);color:var(--text)}

/* ── TODO VIEW TOGGLE ── */
.todo-view-toolbar{display:flex;justify-content:flex-end;padding:0 0 14px 0;flex-shrink:0}
.todo-view-btn{background:none;border:1px solid var(--border2);color:var(--text2);padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer;margin-left:-1px}
.todo-view-btn:first-child{border-radius:6px 0 0 6px}
.todo-view-btn:last-child{border-radius:0 6px 6px 0}
.todo-view-btn.active{background:var(--proj-color-bg);color:var(--proj-color);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);font-weight:600;z-index:1;position:relative}
.todo-view-btn:hover:not(.active){background:var(--bg2);color:var(--text)}
/* ── DEADLINE VIEW ── */
.deadline-view{flex:1;overflow-y:auto;padding:0 4px}
.deadline-group{margin-bottom:18px}
.deadline-group-header{display:flex;align-items:center;gap:8px;padding:4px 4px 6px;border-bottom:1px solid var(--border);margin-bottom:6px}
.deadline-group-label{font-size:12px;font-weight:600;flex:1}
.deadline-group-count{font-size:11px;padding:1px 8px;border-radius:99px}
.deadline-group.overdue .deadline-group-label{color:var(--red)}
.deadline-group.overdue .deadline-group-count{background:var(--red-bg);color:var(--red)}
.deadline-group.this-week .deadline-group-label{color:var(--amber)}
.deadline-group.this-week .deadline-group-count{background:var(--amber-bg);color:var(--amber)}
.deadline-group.next-week .deadline-group-label{color:var(--blue)}
.deadline-group.next-week .deadline-group-count{background:var(--blue-bg);color:var(--blue)}
.deadline-group.this-month .deadline-group-label,.deadline-group.later .deadline-group-label{color:var(--text2)}
.deadline-group.this-month .deadline-group-count,.deadline-group.later .deadline-group-count{background:var(--bg3);color:var(--text3)}
.deadline-item-date{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0;text-align:right;line-height:1.4}
.deadline-item-date.overdue{color:var(--red);font-weight:700}
.deadline-item-date.soon{color:var(--amber);font-weight:600}
.deadline-no-items{padding:40px 20px;text-align:center;color:var(--text3);font-size:13px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
/* ── WEEKLY VIEW ── */
.todo-weekly-grid{display:grid;grid-template-columns:repeat(5,1fr) 0.65fr 0.65fr;gap:8px;flex:1;min-height:0;min-width:640px}
.todo-week-col{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);min-height:0;overflow:hidden;transition:border-color .15s,background .15s}
.todo-week-col.weekend{background:var(--bg2)}
.todo-week-col.drop-target{border:2px dashed var(--blue);background:var(--blue-bg)}
.todo-week-col.drop-target .todo-week-col-header{background:var(--blue-bg)}
.drag-handle{color:var(--text3);font-size:13px;cursor:grab;flex-shrink:0;padding:0 2px;user-select:none}
.todo-rollover-item[draggable="true"]{cursor:grab}
.todo-rollover-item[draggable="true"]:active{cursor:grabbing}
.todo-rollover-item.is-dragging{opacity:.35}
.todo-week-card.rolled-card{border-left:2px solid var(--amber);padding-left:6px}
.todo-week-card.is-dragging{opacity:.35}
.todo-rollover-section.rollover-drop-active .todo-rollover-header{background:var(--blue-bg);border-color:var(--blue)}
.todo-rollover-section.rollover-drop-active{border-color:var(--proj-color)}
.week-rollover-dropzone{padding:12px;text-align:center;font-size:12px;color:var(--text3);border:1px dashed var(--border2);border-radius:var(--radius);margin:4px}
.todo-week-col-header{padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.todo-week-col-header.today-col{background:var(--proj-color-bg)}
.todo-week-dow{font-size:11px;font-weight:600;color:var(--text3)}
.todo-week-date{font-size:15px;font-weight:700;color:var(--text);line-height:1.2}
.todo-week-date.today-date{color:var(--proj-color)}
.todo-week-items{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.todo-week-card{font-size:12px;padding:5px 8px;border-radius:4px;background:var(--bg2);border:1px solid var(--border);cursor:pointer;line-height:1.4;word-break:break-word}
.todo-week-card.done-card{text-decoration:line-through;color:var(--text3);opacity:.7}
.todo-week-card:hover{border-color:var(--proj-color)}
/* 요일별 컬럼 색상 */
.day-col-0 .todo-week-dow{color:var(--blue)}
.day-col-0 .todo-week-card:not(.rolled-card){border-left:2px solid var(--blue)}
.day-col-1 .todo-week-dow{color:var(--green)}
.day-col-1 .todo-week-card:not(.rolled-card){border-left:2px solid var(--green)}
.day-col-2 .todo-week-dow{color:var(--amber)}
.day-col-2 .todo-week-card:not(.rolled-card){border-left:2px solid var(--amber)}
.day-col-3 .todo-week-dow{color:var(--red)}
.day-col-3 .todo-week-card:not(.rolled-card){border-left:2px solid var(--red)}
.day-col-4 .todo-week-dow{color:var(--purple)}
.day-col-4 .todo-week-card:not(.rolled-card){border-left:2px solid var(--purple)}
/* ── BACKLOG PANE ── */
.todo-backlog-pane{flex:1;display:flex;flex-direction:column;background:var(--bg2);overflow:hidden;min-height:0}
.todo-backlog-header{display:flex;align-items:center;padding:12px 12px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.todo-backlog-title{font-size:12px;font-weight:700;color:var(--text2);flex:1;letter-spacing:.04em}
.todo-backlog-count{font-size:11px;color:var(--text3);background:var(--bg3);border-radius:99px;padding:1px 7px;margin-right:6px}
.todo-backlog-add-row{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;gap:4px}
.todo-backlog-add-row input{flex:1;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--bg)}
.todo-backlog-add-row input:focus{outline:none;border-color:var(--proj-color)}
.todo-backlog-add-row button{background:var(--proj-color);color:#fff;border:none;border-radius:var(--radius);padding:5px 8px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1}
.todo-backlog-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px}
.todo-backlog-item{display:flex;align-items:flex-start;gap:6px;padding:7px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:grab;font-size:12px;color:var(--text);line-height:1.4;word-break:break-word;transition:border-color .1s,box-shadow .1s}
.todo-backlog-item:hover{border-color:var(--proj-color);box-shadow:0 2px 6px rgba(0,0,0,.07)}
.todo-backlog-item:active{cursor:grabbing}
.todo-backlog-item.is-dragging{opacity:.3}
.backlog-drag-handle{color:var(--text3);flex-shrink:0;font-size:13px;line-height:1.4;user-select:none}
.backlog-text{flex:1}
.backlog-del{background:none;border:none;cursor:pointer;color:var(--text3);padding:0 2px;font-size:15px;line-height:1;flex-shrink:0;opacity:0;transition:opacity .1s}
.todo-backlog-item:hover .backlog-del{opacity:1}
.todo-backlog-empty{text-align:center;font-size:12px;color:var(--text3);padding:24px 8px;line-height:1.8}
.backlog-group-header{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.05em;padding:10px 4px 4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.backlog-group-header::after{content:'';flex:1;height:1px;background:var(--border)}
.backlog-group-header:first-child{padding-top:4px}
.backlog-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--proj-color-bg);color:var(--proj-color);flex-shrink:0;white-space:nowrap}
.backlog-step-header{font-size:11px;font-weight:600;color:var(--text2);padding:8px 4px 3px;border-top:1px solid var(--border);margin-top:4px}
.todo-list-dropzone{border-radius:var(--radius-lg);border:2px dashed transparent;transition:border-color .15s,background .15s;min-height:40px}
.todo-list-dropzone.drop-active{border-color:var(--blue)!important;background:var(--blue-bg)!important}
.todo-week-col.backlog-drop-target{border:2px dashed var(--blue)!important;background:var(--blue-bg)!important}
.todo-week-add{flex-shrink:0;border:none;border-top:1px solid var(--border);width:100%;padding:6px;background:none;color:var(--text3);font-size:12px;cursor:pointer;text-align:left}
.todo-week-add:hover{background:var(--bg3);color:var(--text)}
/* ── MONTHLY VIEW ── */
.todo-monthly-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.todo-month-dow-header{background:var(--bg2);text-align:center;padding:6px 0;font-size:11px;font-weight:600;color:var(--text3)}
.todo-month-cell{background:var(--bg);padding:4px 6px;min-height:80px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.todo-month-cell:hover{background:var(--bg2)}
.todo-month-cell.empty{background:var(--bg2);cursor:default;pointer-events:none}
.todo-month-cell.today-cell{background:var(--proj-color-bg)}
.todo-month-day-num{font-size:12px;font-weight:600;color:var(--text2);line-height:1}
.todo-month-cell.today-cell .todo-month-day-num{color:var(--proj-color)}
.todo-month-item-preview{font-size:11px;padding:2px 4px;border-radius:3px;background:var(--proj-color-bg);color:var(--proj-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.todo-month-item-preview.done-preview{background:var(--bg3);color:var(--text3);text-decoration:line-through}
.todo-month-more{font-size:10px;color:var(--text3);padding-left:2px}

/* ── SNIPPET TAB ── */
.snippet-search{flex:1;min-width:160px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:13px;color:var(--text);outline:none;font-family:inherit}
.snippet-search:focus{border-color:var(--blue)}
.snippet-search::placeholder{color:var(--text3)}
.snippet-cats{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.snippet-cat-chip{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;white-space:nowrap}
.snippet-cat-chip:hover{background:var(--proj-color-bg);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);color:var(--proj-color)}
.snippet-cat-chip.active{background:var(--proj-color-bg);color:var(--proj-color);border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);font-weight:600}
.snippet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
.snippet-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.snippet-card:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.snippet-card-head{display:flex;align-items:center;gap:6px;padding:12px 14px 8px;flex-shrink:0}
.snippet-cat-badge{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--blue-bg);color:var(--blue);font-weight:600;white-space:nowrap}
.snippet-card-title{font-size:13px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snippet-card-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.snippet-card:hover .snippet-card-actions{opacity:1}
.snippet-card-actions button{background:none;border:none;cursor:pointer;padding:3px 4px;border-radius:4px;color:var(--text3);display:flex;align-items:center;line-height:1}
.snippet-card-actions button:hover{background:var(--bg3);color:var(--text)}
.snippet-card-body{padding:0 14px 10px;flex:1}
.snippet-card-preview{font-size:12px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.snippet-card-foot{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border);flex-shrink:0}
.snippet-copy-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer;font-family:inherit;transition:background .15s}
.snippet-copy-btn:hover,.snippet-card:hover .snippet-copy-btn{background:var(--blue);border-color:var(--blue);color:#fff}
.snippet-use-count{font-size:11px;color:var(--text3);margin-left:auto}
.snippet-empty{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text3);font-size:13px}
/* ── MEETING TAB ── */
.meeting-layout{display:flex;flex:1;overflow:hidden;min-height:0}
.meeting-list-pane{width:252px;min-width:200px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--bg2)}
.meeting-list-header{padding:10px 12px 10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.meeting-list-title{font-size:12px;font-weight:700;color:var(--text2)}
.meeting-search-wrap{padding:6px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.meeting-search-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text);outline:none;font-family:inherit;box-sizing:border-box}
.meeting-search-input:focus{border-color:var(--blue)}
.meeting-search-input::placeholder{color:var(--text3)}
.meeting-list-scroll{flex:1;overflow-y:auto;padding:6px}
.meeting-list-item{padding:8px 10px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px}
.meeting-list-item:hover{background:var(--bg3)}
.meeting-list-item.active{background:var(--blue-bg)}
.meeting-list-item.active .meeting-item-title{color:var(--blue)}
.meeting-item-date{font-size:11px;color:var(--text3);margin-bottom:2px}
.meeting-item-title{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meeting-item-badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;align-items:center}
.meeting-item-status{font-size:10px;padding:1px 6px;border-radius:99px;display:inline-block}
.meeting-item-status.draft{background:var(--bg3);color:var(--text3)}
.meeting-item-status.exported{background:var(--green-bg);color:var(--green)}
.meeting-item-count{font-size:10px;padding:1px 5px;border-radius:99px;background:var(--amber-bg);color:var(--amber);display:inline-block}
.meeting-editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
.meeting-editor-topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.meeting-meta-input{border:none;background:transparent;color:var(--text);font-family:inherit;outline:none;font-size:13px}
.meeting-meta-input::placeholder{color:var(--text3)}
.meeting-meta-input.title{font-size:15px;font-weight:600;flex:1;min-width:160px}
.meeting-meta-input.date{width:130px;color:var(--text2)}
.meeting-meta-input.participants{flex:1;min-width:120px;color:var(--text2)}
.meeting-topbar-sep{color:var(--border2);user-select:none}
.meeting-content-area{flex:1;display:flex;flex-direction:row;overflow:hidden;padding:0}
.meeting-editor-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.meeting-editor-col .note-toolbar{border-radius:0;border:none;border-bottom:1px solid var(--border2);flex-shrink:0}
.meeting-textarea{flex:1;width:100%;border:none;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Pretendard Variable','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.8;padding:20px 24px;resize:none;outline:none;box-sizing:border-box}
.meeting-textarea::placeholder{color:var(--text3)}
.meeting-live-panel{width:236px;min-width:160px;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--bg2);flex-shrink:0}
.live-panel-header{padding:8px 12px;font-size:12px;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);flex-shrink:0}
.live-panel-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.live-panel-empty{font-size:12px;color:var(--text3);text-align:center;padding:20px 4px;line-height:1.7}
.live-panel-section{display:flex;flex-direction:column;gap:3px}
.live-panel-section-title{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:2px}
.live-panel-item{font-size:12px;color:var(--text);padding:4px 8px;background:var(--bg);border-radius:4px;border-left:2px solid var(--border2);line-height:1.4;word-break:break-word}
.live-panel-item.lp-issue{border-left-color:var(--amber)}
.live-panel-item.lp-todo{border-left-color:var(--blue)}
.live-panel-item.lp-decision{border-left-color:var(--purple)}
.live-panel-item.lp-share{border-left-color:var(--green)}
.live-panel-meta{font-size:10px;color:var(--text3);margin-top:1px}
.meeting-bottombar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.meeting-save-status{font-size:11px;color:var(--text3);flex:1}
.meeting-empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text3)}
.meeting-hint{font-size:11px;color:var(--text3);padding:5px 12px;line-height:1.6;flex-shrink:0;border-top:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.meeting-hint-label{font-size:10px;color:var(--text3);flex-shrink:0;white-space:nowrap}
.meeting-marker-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;border:1px solid var(--border2);background:none;color:var(--text2);font-size:11px;font-weight:500;cursor:pointer;transition:background .1s,border-color .1s,color .1s;white-space:nowrap;line-height:1.6;font-family:monospace}
.meeting-marker-badge:hover{border-color:color-mix(in srgb,var(--proj-color) 30%,transparent);color:var(--proj-color);background:var(--proj-color-bg)}
.meeting-marker-badge.mb-issue:hover{border-color:#fcd34d;color:#b45309;background:#fef3c7}
.meeting-marker-badge.mb-decision:hover{border-color:#d8b4fe;color:#6d28d9;background:#ede9fe}
.meeting-marker-badge.mb-share:hover{border-color:#6ee7b7;color:#065f46;background:#d1fae5}
/* 추출 미리보기 모달 */
.extract-section{margin-bottom:16px}
.extract-section-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.extract-item{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;background:var(--bg2);border-radius:6px;margin-bottom:4px;font-size:13px}
.extract-item-icon{flex-shrink:0;font-size:14px}
.extract-item-body{flex:1;min-width:0}
.extract-item-text{color:var(--text);font-weight:500;line-height:1.4}
.extract-item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.extract-item-meta span{margin-right:8px}
.extract-empty{font-size:13px;color:var(--text3);padding:6px 8px;font-style:italic}
/* ── BRIEFING TAB ── */
.briefing-pane{flex:1;padding:32px 48px;overflow-y:auto;height:100%;box-sizing:border-box}
.briefing-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:0 40px;align-items:start}
.briefing-full{grid-column:1/-1}
.briefing-section{margin-bottom:32px}
.briefing-section-title{
  font-size:13px;font-weight:600;letter-spacing:0;
  color:var(--text2);margin-bottom:14px;padding-bottom:8px;
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
}
.briefing-section-title .bs-count{
  font-size:11px;font-weight:500;background:var(--bg3);color:var(--text2);
  border-radius:4px;padding:1px 7px;letter-spacing:0;text-transform:none;
}
.briefing-agent-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:10px;
}
.briefing-agent-meta{font-size:11px;color:var(--text3);margin-bottom:8px}
.briefing-agent-summary{font-size:14px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.5}
.briefing-insight{
  display:flex;align-items:flex-start;gap:8px;padding:7px 0;
  font-size:13px;color:var(--text);border-bottom:1px solid var(--border);line-height:1.5;
}
.briefing-insight:last-child{border-bottom:none}
.briefing-calendar-item{
  display:flex;align-items:center;gap:10px;padding:6px 0;
  font-size:13px;color:var(--text);border-bottom:1px solid var(--border);
}
.briefing-calendar-time{font-size:12px;font-weight:600;color:var(--blue);min-width:48px}
.briefing-calendar-item:last-child{border-bottom:none}
.briefing-gmail-item{
  display:flex;align-items:flex-start;gap:8px;padding:6px 0;
  font-size:13px;color:var(--text2);border-bottom:1px solid var(--border);
}
.briefing-gmail-item:last-child{border-bottom:none}
.briefing-todo-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg);margin-bottom:5px;font-size:13px;
}
.briefing-todo-done{opacity:.5;text-decoration:line-through}
.briefing-issue-row{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg);margin-bottom:5px;
}
.briefing-issue-row.high{border-left:3px solid var(--red)}
.briefing-issue-row.medium{border-left:3px solid var(--amber)}
.briefing-issue-row.low{border-left:3px solid var(--green)}
.briefing-step-current{
  background:var(--bg2);border:1px solid var(--border);
  border-left:3px solid var(--proj-color);
  border-radius:var(--radius);padding:8px 12px;
  font-size:13px;color:var(--text);margin-bottom:5px;
}
.briefing-step-next{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:8px 12px;
  font-size:13px;color:var(--text2);margin-bottom:5px;
}
.briefing-empty{
  text-align:center;padding:30px 20px;color:var(--text3);font-size:13px;
  border:1px dashed var(--border2);border-radius:var(--radius-lg);
}
.briefing-weekly-card{
  border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;background:var(--bg2);
}
.briefing-weekly-summary{font-size:13px;color:var(--text);margin-bottom:10px;line-height:1.6}
.briefing-weekly-stat{
  display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap;
}
.briefing-stat-chip{
  font-size:12px;background:var(--bg3);border-radius:99px;
  padding:3px 10px;color:var(--text2);
}
.briefing-next-action{
  display:flex;align-items:center;gap:8px;font-size:12px;
  color:var(--text2);padding:3px 0;
}
.briefing-setup-banner{
  background:var(--amber-bg);border:1px solid var(--amber);
  border-radius:var(--radius-lg);padding:14px 16px;
  display:flex;align-items:center;gap:12px;margin-bottom:20px;
}
.briefing-setup-banner p{font-size:13px;color:var(--text);flex:1}
.briefing-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:0}
.briefing-kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow)}
.briefing-kpi-card.kpi-warn{border-color:var(--amber);background:var(--amber-bg)}
.briefing-kpi-num{font-size:22px;font-weight:600;color:var(--text);line-height:1.1}
.briefing-kpi-total{font-size:14px;font-weight:400;color:var(--text3)}
.briefing-kpi-label{font-size:12px;color:var(--text3);margin-top:6px}

/* ── KICKOFF TAB ── */
.kickoff-pane{flex:1;padding:32px 48px;overflow-y:auto;height:100%;box-sizing:border-box}
.kickoff-inner{max-width:1380px;margin:0 auto}
.ko-header{padding:0 0 24px 0;margin-bottom:32px;border-bottom:1px solid var(--border)}
.ko-header h1{font-size:22px;font-weight:700;color:var(--text1);margin-bottom:6px;letter-spacing:-.02em}
.ko-header p{font-size:13px;color:var(--text3);margin:0}
.ko-header .ko-badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ko-badge{background:var(--proj-color-bg);border:1px solid color-mix(in srgb,var(--proj-color) 25%,transparent);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:600;color:var(--proj-color);white-space:nowrap}
.ko-section{margin-bottom:36px}
.ko-section-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--proj-color);display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.ko-grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:0}
.ko-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;box-shadow:var(--shadow)}
.ko-card-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0;margin-bottom:12px}
.ko-info-table{width:100%;border-collapse:collapse;font-size:13px}
.ko-info-table tr{border-bottom:1px solid var(--border)}
.ko-info-table tr:last-child{border-bottom:none}
.ko-info-table th{width:130px;padding:8px 0;color:var(--text3);font-weight:500;vertical-align:top;white-space:nowrap}
.ko-info-table td{padding:8px 0 8px 8px;color:var(--text);line-height:1.5}
.ko-obj-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.ko-obj-item:last-child{border-bottom:none}
.ko-obj-num{width:24px;height:24px;border-radius:50%;background:var(--proj-color-bg);color:var(--proj-color);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ko-obj-body h4{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.ko-obj-body p{font-size:12px;color:var(--text2);line-height:1.6;margin:0}
.ko-scope-table{width:100%;border-collapse:collapse;font-size:12px}
.ko-scope-table th{background:var(--bg3);color:var(--text2);font-weight:600;padding:8px 10px;text-align:left;border:1px solid var(--border2);font-size:11px;white-space:nowrap}
.ko-scope-table td{padding:8px 10px;border:1px solid var(--border);color:var(--text);vertical-align:top;line-height:1.5}
.ko-scope-table tr:hover td{background:#f8fafc}
.ko-cat-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap}
.ko-cat-pm{background:#ede9fe;color:#6d28d9}
.ko-cat-design{background:#fef3c7;color:#b45309}
.ko-cat-dc{background:#d1fae5;color:#065f46}
.ko-cat-sales{background:#dbeafe;color:#1e40af}
.ko-cat-mca{background:#fee2e2;color:#b91c1c}
.ko-phase-list{display:flex;flex-direction:column;gap:10px}
.ko-phase-item{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.ko-phase-num{width:28px;height:28px;border-radius:50%;background:var(--proj-color);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ko-phase-body h4{font-size:13px;font-weight:600;color:var(--text);margin:0 0 3px}
.ko-phase-body p{font-size:12px;color:var(--text3);margin:0}
.ko-phase-body .ko-phase-who{font-size:11px;color:var(--proj-color);font-weight:600;margin-top:4px}
.ko-stake-list{display:flex;flex-direction:column;gap:8px}
.ko-stake-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.ko-stake-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px}
.ko-stake-roles{font-size:11px;color:var(--text2);line-height:1.7;padding-left:2px}
/* 간트 차트 */
.ko-gantt-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
.ko-gantt{width:100%;border-collapse:collapse;font-size:12px}
.ko-gantt th{background:var(--bg3);color:var(--text2);font-weight:600;padding:8px 10px;text-align:center;border:1px solid var(--border2);white-space:nowrap;font-size:11px}
.ko-gantt th:first-child{text-align:left;width:220px}
.ko-gantt td{padding:6px 10px;border:1px solid var(--border);color:var(--text2);font-size:11px;vertical-align:middle}
.ko-gantt td:first-child{font-weight:500;color:var(--text);background:var(--bg2);white-space:nowrap}
.ko-gantt .gantt-bar{background:var(--proj-color);border-radius:3px;height:18px;width:100%;display:block}
.ko-gantt .gantt-bar.bar-pm{background:#a78bfa}
.ko-gantt .gantt-bar.bar-design{background:#fbbf24}
.ko-gantt .gantt-bar.bar-dc{background:#34d399}
.ko-gantt .gantt-bar.bar-mca{background:#f87171}
.ko-gantt .gantt-bar.bar-post{background:#94a3b8}
.ko-gantt .gantt-ms{text-align:center;font-size:10px;font-weight:700;color:var(--proj-color)}
.ko-gantt .gantt-ms-diamond{font-size:14px}
.ko-milestone-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ko-milestone-item{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;box-shadow:var(--shadow)}
.ko-milestone-date{font-size:11px;font-weight:700;color:var(--proj-color);white-space:nowrap}
.ko-milestone-label{font-size:12px;color:var(--text)}
/* 조직도 */
.ko-org-tier{margin-bottom:16px}
.ko-org-tier-label{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.01em;margin-bottom:8px}
.ko-org-members{display:flex;flex-wrap:wrap;gap:8px}
.ko-member-chip{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
.ko-member-avatar{width:30px;height:30px;border-radius:50%;background:#e0e7ff;color:#4338ca;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ko-member-info h5{font-size:12px;font-weight:600;color:var(--text);margin:0 0 1px}
.ko-member-info p{font-size:10px;color:var(--text3);margin:0}
.ko-parts-table{width:100%;border-collapse:collapse;font-size:12px}
.ko-parts-table th{background:var(--bg3);color:var(--text2);font-weight:600;padding:8px 10px;text-align:left;border:1px solid var(--border2);font-size:11px}
.ko-parts-table td{padding:8px 10px;border:1px solid var(--border);color:var(--text);line-height:1.5}
.ko-note{background:#fffbeb;border:1px solid #fcd34d;border-radius:var(--radius);padding:10px 14px;font-size:12px;color:var(--text2);margin-top:12px;line-height:1.6}
/* ── COMM TYPE COLORS ── */
.ct-email { --ct-c:#2e7de9; --ct-b:#dce8fb }
.ct-phone { --ct-c:#587539; --ct-b:#ddeec8 }
.ct-video { --ct-c:#9854f1; --ct-b:#ece0fd }
.ct-meet  { --ct-c:#8c6c3e; --ct-b:#f0e4cc }
.ct-msg   { --ct-c:#007197; --ct-b:#c3e7f0 }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .ct-email { --ct-c:#7aa2f7; --ct-b:#1a2744 }
  :root:not([data-theme="light"]) .ct-phone { --ct-c:#9ece6a; --ct-b:#1a2b14 }
  :root:not([data-theme="light"]) .ct-video { --ct-c:#bb9af7; --ct-b:#1e1535 }
  :root:not([data-theme="light"]) .ct-meet  { --ct-c:#e0af68; --ct-b:#2b200f }
  :root:not([data-theme="light"]) .ct-msg   { --ct-c:#0db9d7; --ct-b:#0d2b30 }
}
[data-theme="dark"] .ct-email { --ct-c:#7aa2f7; --ct-b:#1a2744 }
[data-theme="dark"] .ct-phone { --ct-c:#9ece6a; --ct-b:#1a2b14 }
[data-theme="dark"] .ct-video { --ct-c:#bb9af7; --ct-b:#1e1535 }
[data-theme="dark"] .ct-meet  { --ct-c:#e0af68; --ct-b:#2b200f }
[data-theme="dark"] .ct-msg   { --ct-c:#0db9d7; --ct-b:#0d2b30 }
.comm-type-badge.ct-colored { background:var(--ct-b); color:var(--ct-c); }
.comm-card.ct-colored { border-left:3px solid var(--ct-c); }
/* ── COMM NEW SCHEMA STYLES ── */
.dir-badge{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.dir-badge.internal{background:var(--blue-bg);color:var(--blue)}
.dir-badge.external{background:var(--green-bg);color:var(--green)}
.ch-badge{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--bg3);color:var(--text2);white-space:nowrap}
.comm-title-row{display:flex;align-items:center;gap:8px;min-width:0}
.comm-card-subject{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comm-owner-inline{display:flex;gap:4px;flex-shrink:0}
.comm-summary{font-size:12.5px;color:var(--text2);line-height:1.65}
.comm-action-items{padding:8px 14px;display:flex;flex-direction:column;gap:3px}
.comm-action-item{font-size:12px;color:var(--text2);display:flex;gap:6px;align-items:baseline}
.comm-action-item::before{content:'→';color:var(--blue);font-size:11px;flex-shrink:0}
.comm-messages-wrap{padding:10px 14px;border-top:1px solid var(--border)}
.comm-messages-toggle{font-size:12px;color:var(--blue);cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.comm-msg-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.comm-msg-row{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.comm-msg-row:last-child{border-bottom:none}
.comm-msg-speaker{font-weight:600;color:var(--text);white-space:nowrap;min-width:60px;max-width:100px;overflow:hidden;text-overflow:ellipsis}
.comm-msg-time{color:var(--text3);font-size:11px;white-space:nowrap;flex-shrink:0}
.comm-msg-content{flex:1;color:var(--text2);line-height:1.5}
.comm-owner-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.owner-chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--purple-bg);color:var(--purple);font-weight:500}
/* AI 파싱 UI */
.ai-parse-section{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.ai-parse-header{padding:10px 14px;background:var(--bg3);display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.ai-parse-textarea{width:100%;border:none;border-top:1px solid var(--border);padding:12px 14px;font-family:inherit;font-size:13px;line-height:1.6;color:var(--text);background:var(--bg2);resize:vertical;min-height:140px;outline:none}
.btn-ai-parse{background:var(--proj-color);color:#fff;border:1px solid transparent;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .1s,transform .05s}
.btn-ai-parse:hover{background:color-mix(in srgb,var(--proj-color) 86%,#000)}
.btn-ai-parse:active{transform:scale(.98)}
.proj-switch-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background .15s}
.proj-switch-item:hover{background:var(--bg3)}
.proj-switch-item.active{background:var(--blue-bg)}
.btn-ai-parse:disabled{opacity:.5;cursor:not-allowed}
.ai-parsing-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.parsed-fields{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--bg);font-size:13px;margin-bottom:14px;display:none}
.parsed-field-row{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--border)}
.parsed-field-row:last-child{border-bottom:none}
.parsed-field-label{font-size:11px;font-weight:600;color:var(--text3);min-width:56px;flex-shrink:0}
.parsed-field-val{color:var(--text2);flex:1}
/* 뷰 토글 버튼 */
.comm-view-btn { background:none; border:1px solid var(--border2); color:var(--text2); padding:5px 12px; font-size:12px; font-weight:500; cursor:pointer; margin-left:-1px; transition:background .1s,border-color .1s,color .1s; }
.comm-view-btn:first-child { border-radius:6px 0 0 6px; }

  undoStack.push({store, data, label, refresh});
  if(undoStack.length > 20) undoStack.shift();
}
async function undoLast(){
  const entry = undoStack.pop();
  if(!entry){ showToast('실행 취소할 항목이 없습니다'); return; }
