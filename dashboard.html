// ── DB ────────────────────────────────────────────────────────────
class DB {
  constructor(){this.db=null}
  init(){
    return new Promise((res,rej)=>{
      const req=indexedDB.open(DB_NAME,DB_VERSION);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('projects')){
          db.createObjectStore('projects',{keyPath:'id'});
        }
        if(!db.objectStoreNames.contains('communications')){
          const s=db.createObjectStore('communications',{keyPath:'id'});
          s.createIndex('projectId','projectId',{unique:false});
        }
        if(!db.objectStoreNames.contains('files')){
          const s=db.createObjectStore('files',{keyPath:'id'});
          s.createIndex('projectId','projectId',{unique:false});
        }
        if(!db.objectStoreNames.contains('issues')){
          const s=db.createObjectStore('issues',{keyPath:'id'});
          s.createIndex('projectId','projectId',{unique:false});
        }
        if(!db.objectStoreNames.contains('notes')){
          const ns=db.createObjectStore('notes',{keyPath:'id'});
          ns.createIndex('projectId','projectId',{unique:false});
        }
        if(!db.objectStoreNames.contains('threads')){
          const ts=db.createObjectStore('threads',{keyPath:'id'});
          ts.createIndex('parentId','parentId',{unique:false});
        }
        if(!db.objectStoreNames.contains('todos')){
          const td=db.createObjectStore('todos',{keyPath:'id'});
          td.createIndex('projectId','projectId',{unique:false});
          td.createIndex('date','date',{unique:false});
        }
        if(!db.objectStoreNames.contains('settings')){
          db.createObjectStore('settings',{keyPath:'key'});
        }
        if(!db.objectStoreNames.contains('meetings')){
          const ms=db.createObjectStore('meetings',{keyPath:'id'});
          ms.createIndex('projectId','projectId',{unique:false});
          ms.createIndex('date','date',{unique:false});
        }
        if(!db.objectStoreNames.contains('snippets')){
          const sn=db.createObjectStore('snippets',{keyPath:'id'});
          sn.createIndex('category','category',{unique:false});
        }
      };
      req.onsuccess=e=>{this.db=e.target.result;res()};
      req.onerror=e=>rej(e.target.error);
    });
  }
  _tx(stores,mode='readonly'){
    return this.db.transaction(stores,mode);
  }
  get(store,key){
    return new Promise((res,rej)=>{
      const req=this._tx(store).objectStore(store).get(key);
      req.onsuccess=e=>res(e.target.result);
      req.onerror=e=>rej(e.target.error);
    });
  }
  getAll(store){
    return new Promise((res,rej)=>{
      const req=this._tx(store).objectStore(store).getAll();
      req.onsuccess=e=>res(e.target.result);
      req.onerror=e=>rej(e.target.error);
    });
  }
  getByIndex(store,indexName,value){
    return new Promise((res,rej)=>{
      const req=this._tx(store).objectStore(store).index(indexName).getAll(value);
      req.onsuccess=e=>res(e.target.result);
      req.onerror=e=>rej(e.target.error);
    });
  }
  put(store,obj){
    return new Promise((res,rej)=>{
      const req=this._tx(store,'readwrite').objectStore(store).put(obj);
      req.onsuccess=e=>res(e.target.result);
      req.onerror=e=>rej(e.target.error);
    });
  }
  delete(store,key){
    return new Promise((res,rej)=>{
      const req=this._tx(store,'readwrite').objectStore(store).delete(key);
      req.onsuccess=()=>res();
      req.onerror=e=>rej(e.target.error);
    });
  }
}

// ── HELPERS ──────────────────────────────────────────────────────
function genId(){
  return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
}
function esc(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtSize(bytes){
  if(bytes<1024) return bytes+'B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}
function fileIcon(mimeType){
  if(!mimeType) return '📄';
  if(mimeType.includes('pdf')) return '📕';
  if(mimeType.includes('image')) return '🖼️';
  if(mimeType.includes('word')||mimeType.includes('document')) return '📝';
  if(mimeType.includes('excel')||mimeType.includes('sheet')) return '📊';
  if(mimeType.includes('powerpoint')||mimeType.includes('presentation')) return '📊';
  if(mimeType.includes('zip')||mimeType.includes('compressed')) return '📦';
  return '📄';
}

async function getSyncDirHandle(){
  try{
    const rec = await db.get('settings','syncDir');
    if(rec?.handle){
      const perm = await rec.handle.queryPermission({mode:'readwrite'});
      if(perm==='granted') return rec.handle;
      const req = await rec.handle.requestPermission({mode:'readwrite'});
      if(req==='granted') return rec.handle;
    }
  }catch(e){}
  return null;
}

async function setupSyncDir(){
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    await db.put('settings',{key:'syncDir', handle});
    showToast('Agent 폴더 연결 완료');
    await autoSaveDashboard(handle);
    return handle;
  }catch(e){ return null; }
}

async function autoSaveDashboard(dirHandle){
  const handle = dirHandle || await getSyncDirHandle();
  if(!handle) return;
  try{
    const p = await db.get('projects', PROJECT_ID);
    const comms = await db.getByIndex('communications','projectId',PROJECT_ID);
    const issues = await db.getByIndex('issues','projectId',PROJECT_ID);
    const notes = await db.getByIndex('notes','projectId',PROJECT_ID);
    const todos = await db.getByIndex('todos','projectId',PROJECT_ID);
    const threads = await db.getAll('threads');
    const data = {
      version:4, exportedAt:new Date().toISOString(),
      project:p, communications:comms, issues, notes, todos, threads
    };
    const json = JSON.stringify(data,null,2);

    // 1. 메인 파일 저장
    const fileH = await handle.getFileHandle('dashboard-data.json',{create:true});
    const writable = await fileH.createWritable();
    await writable.write(json);
    await writable.close();

    // 2. 날짜별 백업 (backups/ 폴더, 7일치 보관)
    try{
      const backupDir = await handle.getDirectoryHandle('backups',{create:true});
      const today = new Date().toISOString().slice(0,10);
      const bh = await backupDir.getFileHandle(`dashboard-backup-${today}.json`,{create:true});
      const bw = await bh.createWritable();
      await bw.write(json);
      await bw.close();
      // 7일 초과 백업 삭제
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
      for await(const [name] of backupDir.entries()){
        if(name.startsWith('dashboard-backup-') && name.endsWith('.json')){
          const d = new Date(name.replace('dashboard-backup-','').replace('.json',''));
          if(d < cutoff) await backupDir.removeEntry(name).catch(()=>{});
        }
      }
    }catch(e){ console.warn('backup save failed',e); }

    // 3. localStorage 비상 백업 (notes·todos·issues·comms만, 용량 절약)
    try{
      localStorage.setItem('mce-emergency-backup', JSON.stringify({
        savedAt: new Date().toISOString(),
        notes, todos, issues, communications: comms
      }));
    }catch(e){}

  }catch(e){ console.warn('autoSave failed',e); }
}

async function readSyncFile(filename){
  const handle = await getSyncDirHandle();
  if(!handle) return null;
  try{
    const fileH = await handle.getFileHandle(filename);
    const f = await fileH.getFile();
    return JSON.parse(await f.text());
  }catch(e){ return null; }
}

async function deleteSyncFile(filename){
  const handle = await getSyncDirHandle();
  if(!handle) return;
  try{ await handle.removeEntry(filename); }catch(e){}
}

  showModal(`${esc(q.meetingTitle||'회의록')} 가져오기`,`
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">${esc(q.meetingDate||'')} · ${esc(q.participants||'')}</div>
    <div style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">할일 ${(q.todos||[]).length}개</div>
      ${todosHtml}
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">이슈 ${(q.issues||[]).length}개</div>
      ${issuesHtml}
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">커뮤니케이션 ${(q.communications||[]).length}건</div>
      ${commHtml}

      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">노트 ${(q.notes||[]).length}개</div>
      ${notesHtml}
    </div>`,
    [{label:'가져오기', cls:'btn-primary', action: async()=>{
      const now = Date.now();
      // 중복 체크용 기존 데이터 로드
      const [exTodos, exIssues, exComms, exNotes, exMeetings] = await Promise.all([
        db.getByIndex('todos','projectId',PROJECT_ID),
        db.getByIndex('issues','projectId',PROJECT_ID),
        db.getByIndex('communications','projectId',PROJECT_ID),
        db.getByIndex('notes','projectId',PROJECT_ID),
        db.getByIndex('meetings','projectId',PROJECT_ID),
      ]);
      let added={todos:0,issues:0,comms:0,notes:0,meetings:0};
      for(const [i,t] of (q.todos||[]).entries()){
        if(exTodos.some(e=>e.content===t.content&&e.date===t.date)) continue;
        await db.put('todos',{id:genId(),projectId:PROJECT_ID,content:t.content||'',date:t.date||new Date().toISOString().slice(0,10),assignee:t.assignee||'',memo:t.memo||'',time:'',deadline:'',done:false,sourceCommId:t.sourceCommId||'',createdAt:now+i});
        added.todos++;
      }
      for(const [i,is] of (q.issues||[]).entries()){
        if(exIssues.some(e=>e.title===is.title)) continue;
        await db.put('issues',{id:genId(),projectId:PROJECT_ID,title:is.title||'',priority:is.priority||'medium',description:is.description||'',status:'open',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
        added.issues++;
      }
      for(const [i,c] of (q.communications||[]).entries()){
        if(exComms.some(e=>e.date===c.date&&e.summary===c.summary)) continue;
        await db.put('communications',{id:genId(),projectId:PROJECT_ID,date:c.date||new Date().toISOString().slice(0,10),type:c.type||'대면미팅',participants:c.participants||'',summary:c.summary||'',nextAction:c.nextAction||'',createdAt:now+i});
        added.comms++;
      }
      for(const [i,n] of (q.notes||[]).entries()){
        if(exNotes.some(e=>e.title===n.title)) continue;
        await db.put('notes',{id:genId(),projectId:PROJECT_ID,title:n.title||'',category:n.category||'',content:n.content||'',order:null,createdAt:now+i,updatedAt:now+i});
        added.notes++;
      }
      for(const [i,m] of (q.meetings||[]).entries()){
        if(exMeetings.some(e=>e.title===m.title&&e.date===m.date)) continue;
        await db.put('meetings',{id:genId(),projectId:PROJECT_ID,title:m.title||'',date:m.date||new Date().toISOString().slice(0,10),participants:m.participants||'',content:m.content||'',status:'draft',createdAt:now+i,updatedAt:now+i});
        added.meetings++;
      }
      await deleteSyncFile('import-queue.json');
      showToast(`추가됨 — 할일 ${added.todos}, 이슈 ${added.issues}, 커뮤니케이션 ${added.comms}, 노트 ${added.notes}, 회의록 ${added.meetings} (중복 제외)`);
      closeModal();
      renderBriefing();
    }},
    {label:'취소', cls:'btn-ghost', action:()=>closeModal()}]
  );
}

function parseMeetingItems(content){
  const issues = [], todos = [], decisions = [];
  if(!content) return {issues, todos, decisions};
  const lines = content.split('\n');
  for(const line of lines){
    const t = line.trim();
    if(!t) continue;
    const issueM = t.match(/^(?:이슈|issue)\s*[:：]\s*(.+)/i);
    if(issueM){ issues.push(parseMeta(issueM[1],'issue')); continue; }
    const todoM = t.match(/^(?:할일|액션|todo|action)\s*[:：]\s*(.+)/i);
    if(todoM){ todos.push(parseMeta(todoM[1],'todo')); continue; }
    const decM = t.match(/^(?:결정|decision)\s*[:：]\s*(.+)/i);
    if(decM){ decisions.push(parseMeta(decM[1],'decision')); }
  }
  return {issues, todos, decisions};
}

function parseMeta(raw, type){
  let text = raw, assignee = '', deadline = '';
  text = text.replace(/@(\S+)/g, (_, n)=>{ assignee=n; return ''; }).trim();
  text = text.replace(/~(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2})/g, (_,d)=>{
    if(d.includes('/')){
      const [m2,day]=d.split('/');
      deadline=`${new Date().getFullYear()}-${m2.padStart(2,'0')}-${day.padStart(2,'0')}`;
    } else { deadline=d; }
    return '';
  }).trim();
  return {text: text.trim(), assignee, deadline};
}

function renderLivePanel(issues, todos, decisions){
  const body = document.getElementById('live-panel-body');
  if(!body) return;
  const total = issues.length + todos.length + decisions.length;
  if(total === 0){
    body.innerHTML = `<div class="live-panel-empty">마커를 입력하면<br>여기에 실시간으로 표시됩니다<br><br><span style="font-size:10px;opacity:.7">이슈: · 할일: · 결정:</span></div>`;
    return;
  }
  const renderSec = (title, items, cls) => !items.length ? '' : `
    <div class="live-panel-section">
      <div class="live-panel-section-title">${title} (${items.length})</div>
      ${items.map(it=>`<div class="live-panel-item ${cls}">${esc(it.text)}${it.assignee||it.deadline?`<div class="live-panel-meta">${it.assignee?`${esc(it.assignee)} `:''}${it.deadline?it.deadline:''}</div>`:''}</div>`).join('')}
    </div>`;
  body.innerHTML =
    renderSec('이슈', issues, 'lp-issue') +
    renderSec('할일', todos, 'lp-todo') +
    renderSec('결정', decisions, 'lp-decision');
}

    const before = ta.value.slice(0, start);
    const after = ta.value.slice(end);
    const needNewline = before.length > 0 && !before.endsWith('\n');
    const insert = (needNewline ? '\n' : '') + marker;
    ta.value = before + insert + after;
    const pos = before.length + insert.length;
    ta.setSelectionRange(pos, pos);
    ta.focus();
    debounceSave();
    refreshLivePanel();
  });

  document.getElementById('btn-meeting-delete').addEventListener('click', async()=>{
    const mData = await db.get('meetings', id);
    if(!mData) return;
    const mId = id;
    pushUndo('meetings', mData, mData.title||'회의록', async()=>{currentMeetingId=mId;await renderMeeting();});
    await db.delete('meetings', id);
    showToast('삭제됨 · Ctrl+Z로 실행 취소');
    currentMeetingId = null;
    renderMeeting();
  });

  document.getElementById('btn-meeting-extract').addEventListener('click', async()=>{
    await autoSave(false);
    const fresh = await db.get('meetings', id);
    await showMeetingExtractModal(fresh);
  });
}

async function showMeetingExtractModal(m){
  if(!m) return;
  const {issues, todos, decisions} = parseMeetingItems(m.content||'');
  const today = new Date().toISOString().slice(0,10);

  const renderRows = (list, icon, emptyMsg)=> list.length
    ? list.map(it=>`<div class="extract-item">
        <span class="extract-item-icon">${icon}</span>
        <div class="extract-item-body">
          <div class="extract-item-text">${esc(it.text)}</div>
          <div class="extract-item-meta">
            ${it.assignee?`<span>${esc(it.assignee)}</span>`:''}
            ${it.deadline?`<span>${it.deadline}</span>`:''}
          </div>
        </div>
      </div>`).join('')
    : `<div class="extract-empty">${emptyMsg}</div>`;

  const totalCount = issues.length + todos.length + decisions.length;
  const hasItems = totalCount > 0;

  showModal('항목 추출 미리보기', `
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px">
      ${esc(m.title||'(제목 없음)')} &middot; ${m.date||''}
      ${hasItems?'':'<br><span style="color:var(--amber)">마커가 없습니다. 확인 후 Agent 루틴으로 내보낼 수 있습니다.</span>'}
    </div>
    <div class="extract-section">
      <div class="extract-section-title">이슈 → 이슈탭 (${issues.length})</div>
      ${renderRows(issues,'','이슈 항목 없음 (<code>이슈: 내용</code> 형식으로 입력)')}
    </div>
    <div class="extract-section">
      <div class="extract-section-title">할일 → 할일탭 (${todos.length})</div>
      ${renderRows(todos,'','할일 항목 없음 (<code>할일:</code> / <code>액션:</code> 형식으로 입력)')}
    </div>
    <div class="extract-section">
      <div class="extract-section-title">결정 → 노트탭 (${decisions.length})</div>
      ${renderRows(decisions,'','결정 항목 없음 (<code>결정: 내용</code> 형식으로 입력)')}
    </div>
    <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px">확인하면 위 항목이 각 탭에 즉시 등록됩니다.</div>
    </div>`,
    [
      {label: hasItems?`등록하기 (${totalCount}건)`:'등록하기', cls:'btn-primary', action: async()=>{
        const now = Date.now();
        await Promise.all([
          ...issues.map(it=>db.put('issues',{
            id:genId(), projectId:PROJECT_ID,
            title:it.text, priority:'medium', description:'',
            status:'open', assignee:it.assignee||'',
            createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
          })),
          ...todos.map((it,i)=>db.put('todos',{
            id:genId(), projectId:PROJECT_ID,
            content:it.text, date:it.deadline||today, time:'',
            assignee:it.assignee||'', deadline:it.deadline||'',
            memo:`회의록: ${m.title||''} (${m.date||''})`,
            done:false, createdAt:now+i
          })),
          ...decisions.map((it,i)=>db.put('notes',{
            id:genId(), projectId:PROJECT_ID,
            title:it.text.slice(0,40),
            content:it.text,
            category:'결정사항',
            order:null,
            createdAt:now+1000+i, updatedAt:now+1000+i
          })),
        ]);
        // meeting-draft.txt 저장 (Agent 루틴용)
        const txtContent = `회의 제목: ${m.title||'(없음)'}\n날짜: ${m.date||''}\n참석자: ${m.participants||''}\n\n--- 회의 내용 ---\n${m.content||''}`;
        const handle = await getSyncDirHandle();
        if(handle){
          try{
            const fh=await handle.getFileHandle('meeting-draft.txt',{create:true});
            const w=await fh.createWritable(); await w.write(txtContent); await w.close();
          }catch(e){}
        }
        m.status='exported'; m.updatedAt=Date.now();
        await db.put('meetings',m);
        const badge=document.querySelector(`[data-mid="${m.id}"] .meeting-item-status`);
        if(badge){badge.className='meeting-item-status exported';badge.textContent='추출완료';}
        const cntEl=document.querySelector(`[data-mid="${m.id}"] .meeting-item-count`);
        if(!cntEl && totalCount>0){
          const badges=document.querySelector(`[data-mid="${m.id}"] .meeting-item-badges`);
          if(badges){const s=document.createElement('span');s.className='meeting-item-count';s.textContent=`항목 ${totalCount}`;badges.appendChild(s);}
        }
        closeModal();
        showToast(`이슈 ${issues.length} · 할일 ${todos.length} · 결정 ${decisions.length}건 등록됨`);
      }},
      {label:'닫기', cls:'btn-ghost', action:()=>closeModal()}
    ]
  );
}

  const glRows = GL.map(r => {

      ${cells(r, glColor, '10px', '6px', '0.85')}

  }).join('');

  const monthHd = monthSpans.map(m =>
    `<th colspan="${m.span}" style="background:var(--bg3,#f1f5f9);font-size:11px;font-weight:700;color:var(--text2);padding:4px 6px;text-align:center;border-right:1px solid var(--border2);border-bottom:1px solid var(--border2)">${m.label}</th>`
  ).join('');

  const weekHd = weeks.map(w => {
    const tw = isTW(w);
    return `<th style="background:${tw?'var(--proj-color-bg,#e8f0fe)':'var(--bg2)'};font-size:9px;font-weight:${tw?700:400};color:${tw?'var(--proj-color,#2563eb)':'var(--text3)'};padding:2px 1px;text-align:center;min-width:34px;border-right:1px solid var(--border);border-bottom:1px solid var(--border2)">${fmtMD(w)}</th>`;
  }).join('');

  const sectionRow = (label, bg, color) =>
    `<tr><td colspan="${W+1}" style="background:${bg};padding:3px 8px;font-size:11px;font-weight:700;color:${color};letter-spacing:.05em">${label}</td></tr>`;

  el.innerHTML = `
    <div class="kickoff-pane"><div class="kickoff-inner" style="max-width:none">
      <div class="ko-header">
        <h1>Solta Medical Korea — 일정 캘린더</h1>
        <p>WBS Gantt Chart · 주 단위 (2026.10 ~ 2027.03)</p>
        <div class="ko-badges">
          <span class="ko-badge" style="background:var(--proj-color-bg,#e8f0fe);color:var(--proj-color,#2563eb)">■ Korea WBS — MILVUS</span>
          <span class="ko-badge" style="background:#f0fdfa;color:#0f766e">■ 글로벌 일정 — Accenture</span>
          <span class="ko-badge">강조 = 이번 주</span>
        </div>
      </div>
      <div class="ko-section" style="margin-top:0">
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table style="border-collapse:collapse;width:max-content;min-width:100%">
            <thead>
              <tr>
                <th style="min-width:180px;background:var(--bg3);border-right:2px solid var(--border2);border-bottom:1px solid var(--border2)"></th>
                ${monthHd}
              </tr>
              <tr>
                <th style="background:var(--bg2);border-right:2px solid var(--border2)"></th>
                ${weekHd}
              </tr>
            </thead>
            <tbody>
              ${sectionRow('KOREA WBS — MILVUS', 'var(--proj-color-bg,#e8f0fe)', 'var(--proj-color,#2563eb)')}
              ${krRows}

async function renderBriefing(){
  const el = document.getElementById('tab-content');
  el.innerHTML = '<div class="briefing-pane" id="briefing-root"></div>';

  const today = new Date().toISOString().slice(0,10);
  const DOW_KO = ['일','월','화','수','목','금','토'];
  const now = new Date();
  const todayLabel = `${now.getMonth()+1}월 ${now.getDate()}일 (${DOW_KO[now.getDay()]})`;

  // 이번 주 월~일 범위
  const dow = now.getDay();
  const monOffset = dow === 0 ? -6 : 1 - dow;
  const mon = new Date(now); mon.setDate(now.getDate() + monOffset);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const fmt = d => d.toISOString().slice(0,10);
  const week = {
    start: fmt(mon), end: fmt(sun),
    label: `${mon.getMonth()+1}/${mon.getDate()}~${sun.getMonth()+1}/${sun.getDate()}`
  };

  const [todos, issues, comms] = await Promise.all([
    db.getByIndex('todos','projectId',PROJECT_ID),
    db.getByIndex('issues','projectId',PROJECT_ID),
    db.getByIndex('communications','projectId',PROJECT_ID),
  ]);

  // ── 통계 계산
  const todayTodos   = todos.filter(t => t.date === today);
  const doneTodos    = todayTodos.filter(t => t.done);
  const openIssues   = issues.filter(i => i.status !== 'resolved')
    .sort((a,b) => ({high:0,medium:1,low:2}[a.priority]||1) - ({high:0,medium:1,low:2}[b.priority]||1));
  const highIssues   = openIssues.filter(i => i.priority === 'high');
  const urgentTodos  = todos.filter(t => {
    if(t.done) return false;
    const d = t.deadline || t.date;
    return d && d >= today && d <= week.end;
  }).sort((a,b) => (a.deadline||a.date).localeCompare(b.deadline||b.date));
  const weekComms    = comms.filter(c => c.date >= week.start && c.date <= week.end);
  const weekDoneTodos = todos.filter(t => t.done && t.date >= week.start && t.date <= week.end);
  const weekResolvedIssues = issues.filter(i => i.status === 'resolved' &&
    fmt(new Date(i.updatedAt)) >= week.start);

  const steps       = project?.steps || {};
  const stepsDone   = STEPS.filter(s => (steps[s.id]||'pending') === 'done').length;
  const inProgress  = STEPS.filter(s => (steps[s.id]||'pending') === 'in-progress');
  const pending     = STEPS.filter(s => (steps[s.id]||'pending') === 'pending');
  const pct         = Math.round(stepsDone / STEPS.length * 100);
  const PRIORITY_KO = {high:'높음', medium:'보통', low:'낮음'};

  // ── 섹션 A: 오늘 현황 KPI (full width)
  const secA = `<div class="briefing-section briefing-full">
    <div class="briefing-section-title">오늘 현황
      <span style="font-weight:400;color:var(--text3);font-size:12px;text-transform:none;letter-spacing:0">${todayLabel}</span>
    </div>
    <div class="briefing-kpi-grid">
      <div class="briefing-kpi-card">
        <div class="briefing-kpi-num">${doneTodos.length}<span class="briefing-kpi-total"> / ${todayTodos.length}</span></div>
        <div class="briefing-kpi-label">오늘 할일 완료</div>
      </div>
      <div class="briefing-kpi-card${highIssues.length ? ' kpi-warn' : ''}">
        <div class="briefing-kpi-num">${openIssues.length}<span class="briefing-kpi-total"> 건${highIssues.length ? ` (고 ${highIssues.length})` : ''}</span></div>
        <div class="briefing-kpi-label">미해결 이슈</div>
      </div>
      ${project?.projectType === 'Salesforce Marketing Cloud 구축'
        ? `<div class="briefing-kpi-card">
        <div class="briefing-kpi-num">${pct}<span class="briefing-kpi-total"> %</span></div>
        <div class="briefing-kpi-label">MCE 구축 진행률</div>
      </div>`
        : `<div class="briefing-kpi-card">
        <div class="briefing-kpi-num">${weekComms.length}<span class="briefing-kpi-total"> 건</span></div>
        <div class="briefing-kpi-label">이번 주 커뮤니케이션</div>
      </div>`}
      <div class="briefing-kpi-card${urgentTodos.length ? ' kpi-warn' : ''}">
        <div class="briefing-kpi-num">${urgentTodos.length}<span class="briefing-kpi-total"> 건</span></div>
        <div class="briefing-kpi-label">이번 주 마감 임박</div>
      </div>
    </div>
  </div>`;

  // ── 섹션 B: 오늘 할일 (좌)
  let secB = `<div class="briefing-section">
    <div class="briefing-section-title">오늘의 할일
      <span class="bs-count">${doneTodos.length}/${todayTodos.length}</span>
    </div>`;
  if(!todayTodos.length){
    secB += `<div class="briefing-empty">오늘 등록된 할일이 없습니다.</div>`;
  } else {
    secB += todayTodos.sort((a,b) => a.done - b.done).map(t => `
      <div class="briefing-todo-item ${t.done ? 'briefing-todo-done' : ''}">
        <span>${t.done ? '✓' : '·'}</span>
        <span style="flex:1">${esc(t.content||'')}</span>
        ${t.time ? `<span style="font-size:11px;color:var(--text3)">${esc(t.time)}</span>` : ''}
      </div>`).join('');
  }
  secB += `</div>`;

  // ── 섹션 D: 구축 진행현황(구축) / 최근 커뮤니케이션(운영/기타)
  let secD;
  if(project?.projectType === 'Salesforce Marketing Cloud 구축'){
    secD = `<div class="briefing-section">
    <div class="briefing-section-title">구축 진행현황</div>
    <div style="margin-bottom:10px">
      <div class="progress-bar-wrap" style="margin-bottom:6px"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <span style="font-size:12px;color:var(--text2)">${stepsDone}/${STEPS.length} 완료 (${pct}%)</span>
    </div>`;
    if(inProgress.length){
      secD += inProgress.map(s => `<div class="briefing-step-current">진행 중: ${esc(s.title)}</div>`).join('');
    }
    if(pending.length){
      secD += `<div class="briefing-step-next">▶ 다음: ${esc(pending[0].title)}</div>`;
    }
    secD += `</div>`;
  } else {
    const recentComms = [...comms].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
    secD = `<div class="briefing-section">
    <div class="briefing-section-title">최근 커뮤니케이션

          <span style="font-size:10px;color:var(--text3)">${esc(c.direction||'')}</span>

    secD += `</div>`;

  let secC = `<div class="briefing-section">

      <span class="bs-count">${openIssues.length}건</span>
    </div>`;
  if(!openIssues.length){
    secC += `<div class="briefing-empty">미해결 이슈가 없습니다.</div>`;
  } else {

  let secE = `<div class="briefing-section">
    <div class="briefing-section-title">이번 주 요약

        <span class="briefing-stat-chip">할일 ${weekDoneTodos.length}개 완료</span>

    secE += `<div style="margin-top:10px;font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">마감 임박</div>`;
    secE += urgentTodos.slice(0,5).map(t => `
      <div style="font-size:12px;padding:4px 0;display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--border)">
        <span style="color:var(--amber);font-size:11px;font-weight:600;white-space:nowrap;min-width:44px">${(t.deadline||t.date)?.slice(5)||''}</span>
        <span style="color:var(--text);flex:1">${esc(t.content||'')}</span>
        ${t.assignee?`<span style="font-size:10px;color:var(--text3)">${esc(t.assignee)}</span>`:''}
      </div>`).join('');

    secE += `<div style="font-size:12px;color:var(--text3);margin-top:8px">이번 주 마감 임박 항목 없음</div>`;
  }
  secE += `</div></div>`;

  document.getElementById('briefing-root').innerHTML = `<div class="briefing-grid">
    ${secA}
    <div>${secB}${secD}</div>
    <div>${secC}${secE}</div>
  </div>`;
}

// ── STEPS TAB ────────────────────────────────────────────────────
async function renderSteps(){
  const steps = project?.steps || {};
  const done = STEPS.filter(s=>(steps[s.id]||'pending')==='done').length;
  const pct = Math.round(done/STEPS.length*100);

  const el = document.getElementById('tab-content');
  el.innerHTML = `<div class="list-pane">
    <div class="progress-header">
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">${done}/${STEPS.length} 완료 (${pct}%)</span>
    </div>
    <div id="step-groups"></div>
  </div>`;

  const groups = [...new Set(STEPS.map(s=>s.group))];
  const groupEl = document.getElementById('step-groups');
  groups.forEach(g=>{
    const items = STEPS.filter(s=>s.group===g);
    const div = document.createElement('div');
    div.className = 'step-group';
    div.innerHTML = `<div class="step-group-title">${esc(g)}</div>`;
    items.forEach(s=>{
      const st = steps[s.id]||'pending';
      const item = document.createElement('div');
      item.className = 'step-item';
      item.innerHTML = `
        <span class="step-num">Step ${s.num}</span>
        <button class="step-toggle" data-id="${s.id}" title="클릭하여 상태 변경">${STATUS_EMOJI[st]}</button>
        <span class="step-title">${esc(s.title)}</span>
        <span class="step-status-badge ${st}">${STATUS_LABEL[st]}</span>
        <a class="step-guide-link" href="../MCE-Guide/index.html#${s.id}" target="_blank">가이드 →</a>
      `;
      div.appendChild(item);
    });
    groupEl.appendChild(div);
  });

  groupEl.addEventListener('click', async e=>{
    const btn = e.target.closest('.step-toggle');
    if(!btn) return;
    const id = btn.dataset.id;
    const cur = (project.steps||{})[id]||'pending';
    const next = STATUS_CYCLE[cur];
    if(!project.steps) project.steps={};
    project.steps[id] = next;
    project.updatedAt = Date.now();
    await db.put('projects', project);
    renderTab('steps');
  });
}

async function saveSescoHtml(key, html){
  if(!project.sescoHtml) project.sescoHtml = {};
  project.sescoHtml[key] = html;
  project.updatedAt = Date.now();
  await db.put('projects', project);

function toggleSescoEdit(key){
  const content = document.getElementById(`sesco-${key}-content`);
  const btn = document.getElementById(`sesco-${key}-edit-btn`);
  if(!content || !btn) return;
  const isEditing = content.classList.contains('sesco-edit-mode');
  if(isEditing){
    // 저장
    btn.textContent = '💾 저장 중...';
    btn.disabled = true;
    content.classList.remove('sesco-edit-mode');
    content.querySelectorAll('td').forEach(td => td.contentEditable = 'false');
    saveSescoHtml(key, content.innerHTML).then(()=>{
      btn.textContent = '편집';
      btn.classList.remove('saving');
      btn.disabled = false;
    });
  } else {
    // 편집 모드
    content.classList.add('sesco-edit-mode');
    content.querySelectorAll('td').forEach(td => td.contentEditable = 'true');
    btn.textContent = '완료';
    btn.classList.add('saving');
  }
}

// ── SESCO 다중 셀 선택 ────────────────────────────────────────────
let _selCells = new Set();
let _dragStartCell = null;
let _isDragging = false;

function clearSelCells(hideBar = true){
  _selCells.forEach(td => td.classList.remove('sesco-cell-sel'));
  _selCells.clear();
  _dragStartCell = null;
  if(hideBar) hideSescoToolbar();
}

function toggleSelCell(td){
  if(_selCells.has(td)){ td.classList.remove('sesco-cell-sel'); _selCells.delete(td); }
  else { td.classList.add('sesco-cell-sel'); _selCells.add(td); }
}

function expandSelToCell(td, table){
  // clear prev drag sel then fill rectangle between _dragStartCell and td
  _selCells.forEach(c => c.classList.remove('sesco-cell-sel'));
  _selCells.clear();
  const allCells = Array.from(table.querySelectorAll('td, th'));
  const si = allCells.indexOf(_dragStartCell), ei = allCells.indexOf(td);
  if(si < 0 || ei < 0) return;
  const lo = Math.min(si,ei), hi = Math.max(si,ei);
  for(let i=lo; i<=hi; i++){ allCells[i].classList.add('sesco-cell-sel'); _selCells.add(allCells[i]); }
}

function showToolbarForCells(){
  if(_selCells.size === 0) return;
  const rect = [..._selCells][0].getBoundingClientRect();
  showSescoToolbar(rect.left + rect.width/2 - 200, rect.top + window.scrollY);
}

function addCellSelectionListeners(table){
  const content = table.closest('[id^="sesco-"][id$="-content"]');
  if(!content) return;

  table.addEventListener('mousedown', e=>{
    if(!content.classList.contains('sesco-edit-mode')) return;
    const td = e.target.closest('td, th');
    if(!td) return;
    if(e.ctrlKey || e.metaKey){
      e.preventDefault();
      toggleSelCell(td);
      if(_selCells.size > 0) showToolbarForCells();
      else hideSescoToolbar();
    } else {
      // normal click: clear multi-sel, allow text editing
      if(_selCells.size > 0){ clearSelCells(true); }
      _dragStartCell = td;
      _isDragging = false;
    }
  });

  table.addEventListener('mousemove', e=>{
    if(!(e.buttons & 1) || !_dragStartCell) return;
    if(!content.classList.contains('sesco-edit-mode')) return;
    const td = e.target.closest('td, th');
    if(!td || td === _dragStartCell) return;
    _isDragging = true;
    e.preventDefault();
    expandSelToCell(td, table);
    if(_selCells.size > 0) showToolbarForCells();
  });

  table.addEventListener('mouseup', e=>{
    if(_isDragging && _selCells.size > 0) showToolbarForCells();
    _isDragging = false;
  });
}

// ── 다중 셀에 서식 적용 헬퍼 ─────────────────────────────────────
function applyToSelCells(fn){
  _selCells.forEach(fn);
  // keep toolbar & selection visible after applying
  showToolbarForCells();
}

// ── SESCO 행/열 숨기기 ────────────────────────────────────────────
const _sescoHidden = new WeakMap();
function _getHidden(t){ if(!_sescoHidden.has(t)) _sescoHidden.set(t,{rows:new Set(),cols:new Set()}); return _sescoHidden.get(t); }

let _ctxTable=null, _ctxTr=null, _ctxColIdx=-1;

function openSescoCtx(e, table){
  e.preventDefault(); e.stopPropagation();
  _ctxTable = table;
  _ctxTr = e.target.closest('tr');
  const cell = e.target.closest('td,th');
  _ctxColIdx = cell ? cell.cellIndex : -1;
  const isBody = _ctxTr && !!_ctxTr.closest('tbody');
  const isHead = cell && cell.tagName==='TH';
  const h = _getHidden(table);
  const menu = document.getElementById('sesco-ctx-menu');
  document.getElementById('ctx-hide-row').style.display = isBody ? '' : 'none';
  document.getElementById('ctx-hide-col').style.display = isHead ? '' : 'none';
  document.getElementById('ctx-restore-all').style.display = (h.rows.size||h.cols.size) ? '' : 'none';
  // 아무것도 표시할 항목이 없으면 메뉴 열지 않음
  if(!isBody && !isHead && !(h.rows.size||h.cols.size)) return;
  menu.style.left = Math.min(e.clientX, window.innerWidth-180)+'px';
  menu.style.top  = Math.min(e.clientY, window.innerHeight-120)+'px';
  menu.style.display = 'block';
}

document.addEventListener('click', ()=> document.getElementById('sesco-ctx-menu').style.display='none', true);
document.addEventListener('contextmenu', e=>{ if(!e.target.closest('#sesco-ctx-menu')) document.getElementById('sesco-ctx-menu').style.display='none'; }, true);

document.getElementById('ctx-hide-row').addEventListener('click', ()=>{
  if(!_ctxTr||!_ctxTable) return;
  _ctxTr.style.display='none';
  _getHidden(_ctxTable).rows.add(_ctxTr);
});

document.getElementById('ctx-hide-col').addEventListener('click', ()=>{
  if(_ctxColIdx<0||!_ctxTable) return;
  const h = _getHidden(_ctxTable);
  h.cols.add(_ctxColIdx);
  // colgroup col 으로 컬럼 숨김 (colspan/rowspan 대응)
  const cols = _ctxTable.querySelectorAll('colgroup col');
  if(cols[_ctxColIdx]) cols[_ctxColIdx].style.visibility='collapse';
  // th 도 숨김 (colgroup collapse가 thead에 미적용되는 브라우저 대응)
  const ths = [..._ctxTable.querySelectorAll('thead tr:first-child th, tr:first-child th')];
  if(ths[_ctxColIdx]) ths[_ctxColIdx].style.display='none';
});

document.getElementById('ctx-restore-all').addEventListener('click', ()=>{
  if(!_ctxTable) return;
  const h = _getHidden(_ctxTable);
  h.rows.forEach(tr=>tr.style.display='');
  h.rows.clear();
  h.cols.forEach(ci=>{
    const cols = _ctxTable.querySelectorAll('colgroup col');
    if(cols[ci]) cols[ci].style.visibility='';
    const ths = [..._ctxTable.querySelectorAll('thead tr:first-child th, tr:first-child th')];
    if(ths[ci]) ths[ci].style.display='';
  });
  h.cols.clear();
});

// ── SESCO 컬럼 리사이즈 ───────────────────────────────────────────
function makeSescoTableResizable(table){
  if(!table) return;
  table.classList.add('sesco-resizable');
  const ths = Array.from(table.querySelectorAll('thead tr:first-child th, tr:first-child th'));
  if(!ths.length) return;
  // 1) colgroup 생성 (열 숨기기에 사용)
  let cg = table.querySelector('colgroup');
  if(!cg){ cg=document.createElement('colgroup'); table.prepend(cg); }
  cg.innerHTML = Array(ths.length).fill('<col>').join('');
  // 2) 자연 너비 고정 후 fixed layout
  ths.forEach(th=>{ th.style.width = th.offsetWidth + 'px'; });
  table.style.tableLayout = 'fixed';
  // 3) 필터 초기화 (th.innerHTML 복사 — 이 시점에 핸들이 없어야 이벤트 보존)
  initSescoFilters(table);
  addCellSelectionListeners(table);
  // 4) 우클릭 메뉴 (열/행 숨기기)
  table.addEventListener('contextmenu', e=>openSescoCtx(e, table));
  // 3) 핸들은 필터 이후 추가 (이벤트 소실 방지)
  ths.forEach(th=>{
    th.querySelector('.col-resize-handle')?.remove();
    const handle = document.createElement('div');
    handle.className = 'col-resize-handle';
    th.appendChild(handle);
    handle.addEventListener('mousedown', e=>{
      e.preventDefault();
      const startX = e.clientX, startW = th.offsetWidth;
      handle.classList.add('dragging');
      const onMove = e=>{
        const w = Math.max(30, startW + e.clientX - startX);
        th.style.width = w + 'px';
        th.style.minWidth = w + 'px';
      };
      const onUp = ()=>{
        handle.classList.remove('dragging');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

// ── SESCO 컬럼 필터 ───────────────────────────────────────────────
const sescoFilters = new WeakMap();
let _fdd = null, _fTable = null, _fCol = null;

function buildCellMatrix(table){
  const rows = Array.from(table.querySelectorAll('tbody tr'));
  const mat = [];
  rows.forEach((tr, ri)=>{
    if(!mat[ri]) mat[ri]=[];
    let ci=0;
    Array.from(tr.children).forEach(td=>{
      while(mat[ri][ci]) ci++;
      const rs=parseInt(td.getAttribute('rowspan')||1);
      const cs=parseInt(td.getAttribute('colspan')||1);
      for(let r=0;r<rs;r++) for(let c=0;c<cs;c++){
        if(!mat[ri+r]) mat[ri+r]=[];
        mat[ri+r][ci+c]=td;
      }
      ci+=cs;
    });
  });
  return mat;
}

function initSescoFilters(table){
  if(!sescoFilters.has(table)) sescoFilters.set(table, new Map());
  const ths = Array.from(table.querySelectorAll('thead tr:first-child th, tr:first-child th'));
  ths.forEach((th, i)=>{
    th.querySelector('.th-filter-btn')?.remove();
    // Wrap existing content in th-inner if not already
    if(!th.querySelector('.th-inner')){
      const inner = document.createElement('span');
      inner.className='th-inner';
      inner.innerHTML = th.innerHTML;
      th.innerHTML='';
      th.appendChild(inner);
    }
    const btn = document.createElement('span');
    btn.className='th-filter-btn';
    btn.textContent='▼';
    btn.title='필터';
    btn.addEventListener('click', e=>{ e.stopPropagation(); openFilterDd(table,i,btn); });
    th.querySelector('.th-inner').appendChild(btn);
  });
}

function openFilterDd(table, colIdx, anchorEl){
  closeFilterDd();
  _fTable=table; _fCol=colIdx;
  const filters = sescoFilters.get(table);
  const active = filters.get(colIdx);
  const mat = buildCellMatrix(table);
  const rows = Array.from(table.querySelectorAll('tbody tr'));

  // collect unique values
  const allVals = new Set();
  mat.forEach(row=>{ const td=row[colIdx]; if(td) allVals.add(td.textContent.trim()); });
  const sortedVals = [...allVals].sort((a,b)=>a.localeCompare(b,'ko'));

  const dd = document.createElement('div');
  dd.id='col-filter-dd';

  // search box
  const search = document.createElement('input');
  search.className='filter-search'; search.placeholder='검색'; search.type='text';
  dd.appendChild(search);

  // head buttons
  const head = document.createElement('div');
  head.className='filter-dd-head';
  const allBtn = document.createElement('button'); allBtn.textContent='전체 선택';
  const noneBtn = document.createElement('button'); noneBtn.textContent='전체 해제';
  head.appendChild(allBtn); head.appendChild(noneBtn);
  dd.appendChild(head);
  dd.appendChild(Object.assign(document.createElement('div'),{className:'filter-sep'}));

  const optWrap = document.createElement('div');
  dd.appendChild(optWrap);

  function renderOpts(filter){
    optWrap.innerHTML='';
    sortedVals.filter(v=>v.toLowerCase().includes(filter.toLowerCase())).forEach(val=>{
      const lbl = document.createElement('label');
      lbl.className='filter-option';
      const cb = document.createElement('input'); cb.type='checkbox'; cb.value=val;
      cb.checked = !active || active.has(val);
      cb.addEventListener('change',()=>{
        let set = filters.get(colIdx);
        if(!set){ set=new Set(allVals); filters.set(colIdx,set); }
        cb.checked ? set.add(val) : set.delete(val);
        if(set.size===allVals.size) filters.delete(colIdx);
        applySescoFilter(table, mat, rows);
        updateFilterBtns(table);
      });
      const sp = document.createElement('span');
      sp.textContent = val||'(빈값)';
      lbl.appendChild(cb); lbl.appendChild(sp);
      optWrap.appendChild(lbl);
    });
  }
  renderOpts('');

  search.addEventListener('input', ()=>renderOpts(search.value));
  allBtn.addEventListener('click', ()=>{
    filters.delete(colIdx);
    applySescoFilter(table, mat, rows);
    updateFilterBtns(table);
    closeFilterDd();
  });
  noneBtn.addEventListener('click', ()=>{
    filters.set(colIdx, new Set());
    applySescoFilter(table, mat, rows);
    updateFilterBtns(table);
    optWrap.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);
  });

  document.body.appendChild(dd);
  _fdd=dd;
  const rect=anchorEl.getBoundingClientRect();
  dd.style.left = Math.min(rect.left, window.innerWidth-250)+'px';
  dd.style.top  = (rect.bottom+4)+'px';
  search.focus();
}

function applySescoFilter(table, mat, rows){
  const filters = sescoFilters.get(table);
  rows.forEach((tr,ri)=>{
    let show=true;
    filters.forEach((allowedSet,ci)=>{
      if(!show) return;
      const td = mat[ri]?.[ci];
      const val = td ? td.textContent.trim() : '';
      if(!allowedSet.has(val)) show=false;
    });
    tr.style.display=show?'':'none';
  });
}

function updateFilterBtns(table){
  const filters=sescoFilters.get(table);
  table.querySelectorAll('thead tr:first-child th .th-filter-btn, tr:first-child th .th-filter-btn')
    .forEach((btn,i)=>btn.classList.toggle('active', filters.has(i)));
}

function closeFilterDd(){
  _fdd?.remove(); _fdd=null; _fTable=null; _fCol=null;
}
document.addEventListener('click', e=>{
  if(_fdd && !_fdd.contains(e.target) && !e.target.classList.contains('th-filter-btn'))
    closeFilterDd();
});

// ── SESCO 서식 툴바 ───────────────────────────────────────────────
let _sescoSavedRange = null;

function sescoFmt(cmd){
  if(_selCells.size > 0){
    const toggle = {bold:['fontWeight','bold',''],italic:['fontStyle','italic',''],underline:['textDecoration','underline','']};
    const t = toggle[cmd];
    if(t){
      const allBold = [..._selCells].every(td=>td.style[t[0]]===t[1]);
      applyToSelCells(td=>{ td.style[t[0]] = allBold ? t[2] : t[1]; });
    } else if(cmd==='removeFormat'){
      applyToSelCells(td=>{
        ['fontWeight','fontStyle','textDecoration','color','backgroundColor','fontSize'].forEach(p=>td.style[p]='');
      });
    }
    return;
  }
  restoreSescoRange();
  document.execCommand(cmd, false, null);
  hideSescoToolbar();
}

function sescoAlign(align){
  if(_selCells.size > 0){ applyToSelCells(td=>{ td.style.textAlign = align; }); return; }
  restoreSescoRange();
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0){ hideSescoToolbar(); return; }
  let node = sel.getRangeAt(0).commonAncestorContainer;
  while(node && node.nodeName!=='TD' && node.nodeName!=='TH' && node !== document.body)
    node = node.parentNode;
  if(node && (node.nodeName==='TD'||node.nodeName==='TH')) node.style.textAlign = align;
  hideSescoToolbar();
}

function sescoFontSize(size){
  if(!size) return;
  if(_selCells.size > 0){ applyToSelCells(td=>{ td.style.fontSize = size; }); return; }
  restoreSescoRange();
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0){ hideSescoToolbar(); return; }
  const range = sel.getRangeAt(0);
  if(range.collapsed){ hideSescoToolbar(); return; }
  const span = document.createElement('span');
  span.style.fontSize = size;
  try {
    const frag = range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
    const newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(newRange);
  } catch(e) {
    document.execCommand('fontSize', false, '7');
    const content = document.querySelector('.sesco-edit-mode');
    if(content) content.querySelectorAll('font[size="7"]').forEach(el=>{
      el.removeAttribute('size'); el.style.fontSize = size;
    });
  }
  hideSescoToolbar();
}

function sescoHighlight(color){
  if(_selCells.size > 0){
    const bg = color==='transparent' ? '' : color;
    applyToSelCells(td=>{ td.style.backgroundColor = bg; });
    return;
  }
  restoreSescoRange();
  if(color==='transparent'){
    document.execCommand('hiliteColor', false, 'transparent');
    document.execCommand('backColor', false, 'transparent');
  } else {
    document.execCommand('hiliteColor', false, color);
  }
  hideSescoToolbar();
}

function sescoColor(color){
  if(_selCells.size > 0){
    const c = color || getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
    applyToSelCells(td=>{ td.style.color = c; });
    return;
  }
  restoreSescoRange();
  if(color===''){
    document.execCommand('removeFormat', false, null);
  } else {
    document.execCommand('foreColor', false, color);
  }
  hideSescoToolbar();
}

function restoreSescoRange(){
  if(!_sescoSavedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(_sescoSavedRange);
}

function hideSescoToolbar(){
  document.getElementById('sesco-fmt-toolbar').classList.remove('visible');
  _sescoSavedRange = null;
}

function showSescoToolbar(x, y){
  const tb = document.getElementById('sesco-fmt-toolbar');
  tb.style.left = Math.min(Math.max(4, x), window.innerWidth - 420) + 'px';
  tb.style.top  = Math.max(10, y - window.scrollY - 44) + 'px';
  tb.classList.add('visible');
  // 기본색 스와치를 현재 테마 텍스트 색으로 업데이트
  const sw = document.getElementById('fmt-color-default');
  if(sw) sw.style.background = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
}

// 편집 모드에서 텍스트 선택 시 툴바 표시
document.addEventListener('mouseup', e=>{
  const tb = document.getElementById('sesco-fmt-toolbar');
  if(tb.contains(e.target)) return; // 툴바 클릭은 무시
  const content = e.target.closest('[id^="sesco-"][id$="-content"]');
  if(content && content.classList.contains('sesco-edit-mode')){
    setTimeout(()=>{
      const sel = window.getSelection();
      if(sel && sel.toString().trim().length > 0){
        const range = sel.getRangeAt(0);
        _sescoSavedRange = range.cloneRange();
        const rect = range.getBoundingClientRect();
        showSescoToolbar(rect.left + rect.width/2 - 160, rect.top + window.scrollY);
      } else {
        hideSescoToolbar();
      }
    }, 10);
  } else {
    hideSescoToolbar();
  }
});

// ── SLACK FETCH ──────────────────────────────────────────────────
function parseSlackUrl(url){
  // https://workspace.slack.com/archives/C12345678/p1234567890123456
  // https://app.slack.com/client/TXXXXXXXX/C12345678/thread/C12345678-1234567890.123456
  try{
    const u = new URL(url);
    const parts = u.pathname.split('/').filter(Boolean);
    // /archives/CXXXXX/pTIMESTAMP
    const archIdx = parts.indexOf('archives');
    if(archIdx>=0 && parts[archIdx+1] && parts[archIdx+2]){
      const channelId = parts[archIdx+1];
      const raw = parts[archIdx+2]; // p1234567890123456
      if(raw.startsWith('p')){
        const ts = raw.slice(1,11)+'.'+raw.slice(11); // 1234567890.123456
        return {channelId, ts};
      }
    }
    // thread/CXXXXX-TIMESTAMP
    const threadIdx = parts.indexOf('thread');
    if(threadIdx>=0 && parts[threadIdx+1]){
      const [channelId, ts] = parts[threadIdx+1].split('-');
      if(channelId && ts) return {channelId, ts};
    }
  }catch(_){}
  return null;
}

async function fetchSlackThread(url){
  const saved = await db.get('settings','slackToken');
  if(!saved?.value) throw new Error('Slack 토큰이 없습니다. Agent 설정에서 Slack 토큰을 입력해주세요.');
  const urlParsed = parseSlackUrl(url.trim());
  if(!urlParsed) throw new Error('Slack 스레드 URL 형식을 인식할 수 없습니다.\n예: https://xxx.slack.com/archives/C.../p...');

  const {channelId, ts} = urlParsed;
  const token = saved.value;

  const slackFetch = (endpoint, params) =>
    fetch('http://localhost:3099', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token, endpoint, params: params||{}}),
    }).then(r=>r.json());

  // 로컬 멤버 매핑 로드
  const membersSaved = await db.get('settings','slackMembers');
  const localMap = {};
  (membersSaved?.value||[]).forEach(m=>{ localMap[m.code]=m.name; });

  const [threadData, channelData] = await Promise.all([
    slackFetch('conversations.replies', {channel:channelId, ts, limit:'200', inclusive:'true'}),
    slackFetch('conversations.info', {channel:channelId}),
  ]);
  if(!threadData.ok) throw new Error(`Slack 오류: ${threadData.error}`);

  const channelName = channelData.ok
    ? (channelData.channel?.name || channelData.channel?.id || channelId)
    : channelId;

  // 사용자 이름 해석: 로컬 매핑 우선, 없으면 API 조회
  const userIds = [...new Set((threadData.messages||[]).map(m=>m.user).filter(Boolean))];
  const resolvedMap = {...localMap};
  await Promise.all(userIds.filter(uid=>!resolvedMap[uid]).map(async uid=>{
    try{
      const d = await slackFetch('users.info', {user:uid});
      if(d.ok) resolvedMap[uid] = d.user?.profile?.display_name || d.user?.real_name || uid;
    }catch(_){ resolvedMap[uid]=uid; }
  }));

  function cleanText(text){
    return (text||'')
      .replace(/:[a-z0-9_+\-]+:/g, '')
      .replace(/<@[A-Z0-9]+(?:\|[^>]*)?>/g, '')
      .replace(/[ \t]{2,}/g, ' ')
      .trim();
  }

  function extractSubject(text){
    const stripped = (text||'').replace(/<@[A-Z0-9]+(?:\|[^>]*)?>/g,'').trim();
    const m = stripped.match(/\*?\[([^\]]+)\]\*?/);
    return m ? m[1].trim() : cleanText(stripped).slice(0,80);
  }

  const rawMsgs = threadData.messages||[];
  const [firstMsg, ...bodyMsgs] = rawMsgs;

  // 첫 메시지 → 제목
  const subject = firstMsg ? extractSubject(firstMsg.text||'') : '';

  // 나머지 → 본문 메시지
  const messages = bodyMsgs.map(m=>{
    const speaker = resolvedMap[m.user] || m.username || m.user || '알수없음';
    const tsNum = parseFloat(m.ts||'0');
    const dt = new Date(tsNum*1000);
    const date = dt.toISOString().slice(0,10);
    const time = dt.toTimeString().slice(0,5);
    const recipientIds = [...(m.text||'').matchAll(/<@([A-Z0-9]+)>/g)].map(r=>r[1]);
    const recipients = [...new Set(recipientIds.map(uid=>resolvedMap[uid]||uid))];
    const text = cleanText(m.text||'');
    return {date, time, speaker, recipients, text};
  });

  const participants = [...new Set(messages.map(m=>m.speaker))].filter(Boolean);

  // 날짜별 그룹
  const dateGroupMap = {};
  const dateGroups = [];
  messages.forEach(m=>{
    if(!dateGroupMap[m.date]){ dateGroupMap[m.date]=[]; dateGroups.push({date:m.date, messages:dateGroupMap[m.date]}); }
    dateGroupMap[m.date].push(m);
  });

  return {subject, messages, participants, channelName, dateGroups};
}

    .replace(/```([\s\S]*?)```/g, (_,c)=>`<pre class="slack-codeblock">${c.replace(/^[\n\r]+/,'').replace(/[\n\r]+$/,'')}</pre>`)
    .replace(/``([\s\S]*?)``/g, (_,c)=>`<code class="slack-code" style="white-space:pre-wrap">${c}</code>`)
    .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
    .replace(/_([^_\n]+)_/g, '<em>$1</em>')
    .replace(/`([^`\n]+)`/g, '<code class="slack-code">$1</code>')
    .replace(/~([^~\n]+)~/g, '<del>$1</del>')
    .replace(/\n/g, '<br>');
}

async function parseSlackSummaryWithAI(subject, msgText){

  const prompt = `다음은 Slack 스레드 메시지입니다. 제목: "${subject}"

${msgText}

JSON으로만 응답하세요. 설명 없이 JSON만 출력하세요.

추출 규칙:
- summary: 대화 흐름과 결론. 누가 무엇을 요청/제안했고 어떻게 논의됐으며 결론이 무엇인지 서술. 줄바꿈은 \\n으로 이스케이프
- action_items: 명확한 할일/액션아이템 배열. 없으면 []

{"summary":"","action_items":[]}`;
  const res = await fetch('http://localhost:3099',{

function stripSlackMarkdown(text){
  if(!text) return text;
  return text
    .replace(/\[#[A-Z0-9]+\]\s*/g, '')   // [#C09AA4VBSSH] 채널 ID 제거
    .replace(/\*([^*]+)\*/g, '$1')         // *bold* → bold
    .replace(/_([^_]+)_/g, '$1')           // _italic_ → italic
    .replace(/`([^`]+)`/g, '$1')           // `code` → code
    .replace(/~([^~]+)~/g, '$1')           // ~strike~ → strike
    .trim();
}

async function parseCommWithAI(rawText){
  const saved = await db.get('settings','anthropicApiKey');
  if(!saved?.value) throw new Error('API 키가 없습니다. ⚙️ Agent 설정에서 Anthropic API 키를 입력해주세요.');

  const prompt = `아래 커뮤니케이션 원문을 분석해서 JSON으로만 응답하세요. 설명 없이 JSON만 출력하세요.

원문:
${rawText}

추출 규칙:
- channel: 원문 형식으로 자동 감지. Gmail 형식(From:/Date:/Subject: 헤더) → "Gmail", Slack 형식(이름 + 시간 패턴) → "Slack", 그 외 → "전화"/"대면미팅"/"기타"
- direction: 모두 같은 조직이면 "내부", 외부 회사/이메일 도메인이 있으면 "외부"
- subject: 이메일이면 Subject 줄, Slack이면 첫 번째 메시지 내용 한 줄로. Slack 마크다운 제거 필수: *bold* → bold, \`code\` → code, ~strike~ → strike, [#채널ID] 같은 채널 태그 제거
- counterparty: direction이 "외부"일 때 상대방 회사명 또는 이름. 없으면 null
- owner: @멘션된 사람 배열. 없으면 []
- summary: 핵심 내용을 마크다운 불릿 리스트(- 항목)로 정리. 결정사항·요청·논의 포인트를 항목별로 구분. 쉼표로 이어 쓰지 말고 항목 하나당 한 줄. 줄바꿈은 \\n으로 이스케이프
- action_items: 명확한 할일/액션아이템 배열. 없으면 []

중요: 모든 문자열 값 안에서 줄바꿈은 \\n으로, 큰따옴표는 \\"로 이스케이프하세요.
JSON 외 어떤 텍스트도 출력하지 마세요.

JSON 형식:
{
  "channel": "",
  "direction": "",
  "subject": "",
  "counterparty": null,
  "owner": [],
  "summary": "",
  "action_items": []
}`;

  const res = await fetch('http://localhost:3099',{
    method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({
      service: 'anthropic',
      apiKey: saved.value,
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 4096,
      messages:[{role:'user', content: prompt}]
    })
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err?.error?.message || `API 오류 ${res.status}`);
  }
  const data = await res.json();
  const text = data.content[0].text.trim();
  const jsonMatch = text.match(/\{[\s\S]*\}/);
  if(!jsonMatch) throw new Error('AI 응답을 파싱할 수 없습니다.');
  let jsonStr = jsonMatch[0];
  // JSON 문자열 내부 제어문자 이스케이프 (문자 단위 파서)
  function fixJsonStr(s) {
    let out = '', inStr = false, esc = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (esc) { out += c; esc = false; continue; }
      if (c === '\\' && inStr) { out += c; esc = true; continue; }
      if (c === '"') { out += c; inStr = !inStr; continue; }
      if (inStr) {
        if (c === '\n') { out += '\\n'; continue; }
        if (c === '\r') { out += '\\r'; continue; }
        if (c === '\t') { out += '\\t'; continue; }
      }
      out += c;
    }
    return out;
  }
  jsonStr = fixJsonStr(jsonStr).replace(/,\s*([}\]])/g, '$1');
  try {
    return JSON.parse(jsonStr);
  } catch(e) {
    console.error('JSON 파싱 실패:', e.message);
    console.error('파싱 시도한 JSON (앞 300자):', jsonStr.slice(0,300));
    throw new Error('AI 응답을 파싱할 수 없습니다: ' + e.message);
  }
}

async function loadComm(){
  let items = await db.getByIndex('communications','projectId',PROJECT_ID);
  // Sort: new schema uses messages[0].datetime, fallback to date field
  items.sort((a,b)=>{
    const da = a.date||(a.messages?.[0]?.datetime||'').slice(0,10)||'';
    const db2 = b.date||(b.messages?.[0]?.datetime||'').slice(0,10)||'';
    return db2.localeCompare(da);
  });
  if(commSearch){
    const q = commSearch.toLowerCase();
    items = items.filter(i=>
      (i.content||'').toLowerCase().includes(q)||
      (i.participants||'').toLowerCase().includes(q)||
      (i.subject||'').toLowerCase().includes(q)||
      (i.summary||'').toLowerCase().includes(q)||
      (i.counterparty||'').toLowerCase().includes(q)||
      (i.owner||[]).join(' ').toLowerCase().includes(q)||
      (Array.isArray(i.actionItems)?i.actionItems.join(' '):(i.actionItems||'')).toLowerCase().includes(q)||
      (i.messages||[]).some(m=>(m.content||'').toLowerCase().includes(q)||(m.speaker||'').toLowerCase().includes(q))
    );
  }
  const el = document.getElementById('comm-list');
  if(!el) return;
  if(!items.length){
    el.innerHTML = `<div class="empty-state"><p>커뮤니케이션 기록이 없습니다</p><span>+ 버튼으로 첫 기록을 추가해보세요</span></div>`;
    return;
  }
  if(commView === 'timeline'){
    renderCommTimeline(items, el);
  } else {
    renderCommCards(items, el);
  }
}

function _commCardMeta(c){
  // New schema: use channel field; fallback to legacy type
  const ch = c.channel || c.type || '기타';
  const meta = COMM_CHANNEL_META[ch] || COMM_TYPE_META[ch] || {cls:'ct-etc', icon:'📋'};
  const date = c.date || (c.messages?.[0]?.datetime||'').slice(0,10) || '';
  const displayDate = date ? date.slice(5).replace('-','/') : '';
  const subject = c.subject || c.participants || '';
  const summary = c.summary || c.content || '';
  const previewLines = summary.split('\n').map(l=>l.trim()).filter(Boolean);
  const preview = previewLines.slice(0,3).join('\n').slice(0,250);
  return {ch, meta, date, displayDate, subject, preview};
}

function renderCommCards(items, el){
  el.innerHTML = items.map(c=>{
    const {ch, meta, date, displayDate, subject, preview} = _commCardMeta(c);
    const dirBadge = c.direction ? `<span class="dir-badge ${c.direction==='내부'?'internal':'external'}">${c.direction}</span>` : '';
    const chBadge = `<span class="ch-badge ${meta.cls}">${meta.icon} ${esc(ch)}</span>`;
    const owners = (c.owner||[]).filter(Boolean);
    const ownerInline = owners.length ? `<div class="comm-owner-inline">${owners.map(o=>`<span class="owner-chip">${esc(o)}</span>`).join('')}</div>` : '';
    const actions = (c.actionItems||[]).filter(Boolean);
    const actionHtml = actions.length ? `<div class="comm-action-items">${actions.map(a=>`<div class="comm-action-item">${esc(a)}</div>`).join('')}</div>` : '';
    const msgs = c.messages||[];
    const msgCount = msgs.length ? `<span style="font-size:11px;color:var(--text3);flex-shrink:0">${msgs.length}건</span>` : '';
    return `
    <div class="comm-card ct-colored ${meta.cls}${selectedItem?.id===c.id?' card-selected':''}" data-thread-id="${c.id}" data-thread-type="comm" style="cursor:pointer">
      <div class="comm-card-header">
        <span class="comm-date">${esc(displayDate||date)}</span>
        ${chBadge}${dirBadge}
        <span class="comm-participants" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.counterparty||c.participants||'')}</span>

        ${(subject||ownerInline)?`<div class="comm-title-row"><span class="comm-card-subject">${esc(subject||'')}</span>${ownerInline}</div>`:''}

function renderCommTimeline(items, el){
  const rows = items.map((c, idx)=>{
    const {ch, meta, date, subject, preview} = _commCardMeta(c);
    const dateParts = date.split('-');
    const dateLabel = dateParts.length===3 ? `${dateParts[1]}/${dateParts[2]}` : date;
    const yearLabel = dateParts[0]||'';
    const isFirst = idx===0;
    const isLast = idx===items.length-1;
    const showYear = isFirst || (dateParts[0] && dateParts[0]!==items[idx-1]?.date?.split('-')[0]);
    const dirBadge = c.direction ? `<span class="dir-badge ${c.direction==='내부'?'internal':'external'}">${c.direction}</span>` : '';
    return `
    <div class="tl-item ${meta.cls}">
      <div class="tl-date-col">
        ${showYear?`<div style="font-size:10px;color:var(--text3);margin-bottom:2px">${yearLabel}</div>`:''}
        ${dateLabel}
      </div>
      <div class="tl-line-col">
        ${isFirst?'':'<div class="tl-line"></div>'}
        <div class="tl-dot"></div>
        ${isLast?'':'<div class="tl-line"></div>'}
      </div>
      <div class="tl-card-col">
        <div class="tl-card ${meta.cls}${selectedItem?.id===c.id?' card-selected':''}" data-thread-id="${c.id}" data-thread-type="comm">
          <div class="tl-card-header">
            <span class="ch-badge ${meta.cls}">${meta.icon} ${esc(ch)}</span>
            ${dirBadge}
            <span style="font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.counterparty||c.participants||'')}</span>
            <div class="card-actions">
              <button onclick="showCommModal('${c.id}')" title="수정"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
              <button onclick="deleteComm('${c.id}')" title="삭제"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
            </div>

            <div class="tl-preview">${esc(preview)}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="timeline">${rows}</div>`;
}

      panelBody.scrollTop = 0;
      const summaryTa = document.getElementById('f-summary');
      if(summaryTa){ summaryTa.style.height='auto'; summaryTa.style.height=summaryTa.scrollHeight+'px'; }
    }catch(e){
      alert('AI 정리 실패: '+e.message);
    }finally{
      clearInterval(progressTid);
      if(bar){ bar.style.width='100%'; }
      setTimeout(()=>{ if(wrap) wrap.style.display='none'; }, 400);
      if(btn){btn.disabled=false;btn.textContent='AI 정리';}
    }
  };

  // If editing existing item, show parsed fields immediately
  if(parsed){
    setTimeout(()=>{
      const pf = document.getElementById('parsed-fields');
      if(pf) pf.style.display='block';
    },30);
  }
}

async function findSimilarComm(subject, counterparty){
  const all = await db.getByIndex('communications','projectId',PROJECT_ID);
  const thirtyDaysAgo = Date.now() - 30*24*60*60*1000;
  const recent = all.filter(c=>(c.loggedAt||c.createdAt||0) > thirtyDaysAgo);

  // 키워드 overlap 계산
  const subjectTokens = (subject||'').replace(/\[#[^\]]+\]/g,'').split(/[\s,\[\]·\-\/]+/).filter(s=>s.length>1);

  for(const c of recent){
    const cTokens = (c.subject||c.content||'').split(/[\s,\[\]·\-\/]+/).filter(s=>s.length>1);
    const overlap = subjectTokens.filter(t=>cTokens.some(ct=>ct.includes(t)||t.includes(ct)));
    const sameChannel = counterparty && c.counterparty && (
      c.counterparty.toLowerCase()===counterparty.toLowerCase()
    );
    if(sameChannel && overlap.length>=1) return c;
    if(!sameChannel && overlap.length>=3) return c;
  }
  return null;
}

function showMergeConfirm(existing, newObj){
  const existDate = existing.date||(existing.messages?.[0]?.datetime||'').slice(0,10)||'';
  const newMsgCount = (newObj.messages||[]).length;
  showModal('기존 기록과 합칠까요?', `
    <div style="background:var(--bg);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:4px">${esc(existDate)}</div>
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px">${esc(existing.subject||existing.content||'제목 없음')}</div>
      <div style="font-size:12px;color:var(--text2)">메시지 ${(existing.messages||[]).length}건 · ${esc(existing.counterparty||'')}</div>
    </div>
    <p style="font-size:13px;color:var(--text2);line-height:1.6">
      비슷한 기록이 있습니다.<br>
      새 메시지 <strong>${newMsgCount}건</strong>을 기존 기록에 이어서 추가할까요?
    </p>
  `,[
    {label:'이어서 저장', cls:'btn-primary', action: async()=>{
      // 기존 메시지에 새 메시지 병합 (datetime 기준 정렬, 중복 제거)
      const existMsgs = existing.messages||[];
      const newMsgs = newObj.messages||[];
      const existKeys = new Set(existMsgs.map(m=>m.datetime+m.speaker+m.content.slice(0,20)));
      const freshMsgs = newMsgs.filter(m=>!existKeys.has(m.datetime+m.speaker+(m.content||'').slice(0,20)));
      const merged = [...existMsgs, ...freshMsgs].sort((a,b)=>(a.datetime||'').localeCompare(b.datetime||''));
      // 액션아이템 병합
      const existActions = new Set(existing.actionItems||[]);
      const mergedActions = [...existActions, ...(newObj.actionItems||[]).filter(a=>!existActions.has(a))];
      const updated = {
        ...existing,
        messages: merged,
        actionItems: mergedActions,
        summary: existing.summary || newObj.summary,
        date: merged[0]?.datetime?.slice(0,10) || existing.date,
        loggedAt: Date.now(),
      };
      await db.put('communications', updated);
      closeModal(); renderTab('comm');
      showToast(`기존 기록에 메시지 ${freshMsgs.length}건 추가됨`);
    }},
    {label:'별도 저장', cls:'btn-ghost', action: async()=>{
      await db.put('communications', newObj);
      closeModal(); renderTab('comm');
    }},
    {label:'취소', cls:'btn-ghost', action:()=>closeModal()},
  ]);
}

function readFileAsArrayBuffer(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result);
    r.onerror=e=>rej(e);
    r.readAsArrayBuffer(file);
  });
}

async function downloadFile(id){
  const f = await db.get('files', id);
  if(!f) return;
  const blob = new Blob([f.data], {type:f.mimeType||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=f.name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ── MARKDOWN ─────────────────────────────────────────────────────
function inlineFmt(s){
  return s
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/~~(.+?)~~/g,'<del>$1</del>')
    .replace(/==(.+?)==/g,'<mark>$1</mark>')
    .replace(/``([^`]+)``/g,'<code>$1</code>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderSummaryAsBullets(text){
  if(!text) return '';
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const hasMd = lines.some(l=>/^[-*] |^\d+\. |^#+\s/.test(l));
  if(hasMd) return renderMarkdown(text);
  return renderMarkdown(lines.map(l=>`- ${l}`).join('\n'));
}
function renderMarkdown(raw, opts={}){
  if(!raw) return '';
  const lines=raw.split('\n');
  let html='',inUl=false,inOl=false,inBq=false,inCode=false,codeLines=[],codeLang='',chkIdx=0;
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const closeList=()=>{
    if(inUl){html+='</ul>';inUl=false;}
    if(inOl){html+='</ol>';inOl=false;}
  };
  const closeBq=()=>{if(inBq){html+='</blockquote>';inBq=false;}};
  for(const line of lines){
    // ── 코드 블록 ───────────────────────────────────────────────────
    const fence=line.match(/^```(\w*)$/);
    if(fence){
      if(!inCode){closeList();closeBq();inCode=true;codeLang=fence[1];codeLines=[];}
      else{
        html+=`<pre><code${codeLang?` class="lang-${codeLang}"`:''}>${codeLines.map(l=>e(l)).join('\n')}</code></pre>`;
        inCode=false;codeLines=[];codeLang='';
      }
      continue;
    }
    if(inCode){codeLines.push(line);continue;}
    // ── 인용구와 비-인용구 구분 ────────────────────────────────────
    const bqMatch=line.match(/^> ?(.*)/);
    if(!bqMatch) closeBq();
    // ── 제목 ───────────────────────────────────────────────────────
    if(/^#### /.test(line)){closeList();html+=`<h6>${inlineFmt(e(line.slice(5)))}</h6>`;continue;}
    if(/^### /.test(line)){closeList();html+=`<h5>${inlineFmt(e(line.slice(4)))}</h5>`;continue;}
    if(/^## /.test(line)){closeList();html+=`<h4>${inlineFmt(e(line.slice(3)))}</h4>`;continue;}
    if(/^# /.test(line)){closeList();html+=`<h3>${inlineFmt(e(line.slice(2)))}</h3>`;continue;}
    // ── 구분선 ─────────────────────────────────────────────────────
    if(/^---+$/.test(line)){closeList();html+='<hr>';continue;}
    // ── 인용구 ─────────────────────────────────────────────────────
    if(bqMatch){
      closeList();
      if(!inBq){html+='<blockquote>';inBq=true;}
      const inner=bqMatch[1];
      if(inner.trim()==='') html+='<br>';
      else html+=`<p>${inlineFmt(e(inner))}</p>`;
      continue;
    }
    // ── 체크박스 ───────────────────────────────────────────────────
    const chk=line.match(/^- \[(x| )\] (.+)/);
    if(chk){
      const done=chk[1]==='x';
      const idx=chkIdx++;
      const clickAttr=opts.checkClick?` data-chk="${idx}" role="checkbox" aria-checked="${done}" tabindex="0"`:'';
      closeList();
      html+=`<div class="md-check${done?' done':''}${opts.checkClick?' clickable':''}"${clickAttr}>${done?'☑':'☐'} ${inlineFmt(e(chk[2]))}</div>`;
      continue;
    }
    // ── 목록 ───────────────────────────────────────────────────────
    const ul=line.match(/^[-*] (.+)/);
    if(ul){if(!inUl){closeList();html+='<ul>';inUl=true;}html+=`<li>${inlineFmt(e(ul[1]))}</li>`;continue;}
    const ol=line.match(/^\d+\. (.+)/);
    if(ol){if(!inOl){closeList();html+='<ol>';inOl=true;}html+=`<li>${inlineFmt(e(ol[1]))}</li>`;continue;}
    // ── 일반 단락 ──────────────────────────────────────────────────
    closeList();
    if(line.trim()===''){html+='<br>';continue;}
    html+=`<p>${inlineFmt(e(line))}</p>`;
  }
  closeList();
  closeBq();
  if(inCode&&codeLines.length) html+=`<pre><code>${codeLines.map(l=>e(l)).join('\n')}</code></pre>`;
  return html;
}

// ── TOOLBAR INSERT ────────────────────────────────────────────────
function applyFormat(cmd, ta){
  const s=ta.selectionStart, e=ta.selectionEnd;
  const val=ta.value, sel=val.slice(s,e);
  const before=val.slice(0,s), after=val.slice(e);
  const lineStart=before.lastIndexOf('\n')+1;
  const linePrefix=before.slice(lineStart);

  const LINE_CMDS={'h1':'# ','h2':'## ','h3':'### ','h4':'#### ','ul':'- ','ol':'1. ','check':'- [ ] ','blockquote':'> '};
  if(LINE_CMDS[cmd]){
    const prefix=LINE_CMDS[cmd];
    let clean=linePrefix;
    for(const p of Object.values(LINE_CMDS)){if(clean.startsWith(p)){clean=clean.slice(p.length);break;}}
    const removed=linePrefix.length-clean.length;
    if(linePrefix.startsWith(prefix)&&removed===prefix.length){
      ta.value=val.slice(0,lineStart)+clean+val.slice(lineStart+linePrefix.length);
      ta.setSelectionRange(Math.max(lineStart,s-prefix.length),Math.max(lineStart,e-prefix.length));
    } else {
      ta.value=val.slice(0,lineStart)+prefix+clean+val.slice(lineStart+linePrefix.length);
      ta.setSelectionRange(s-removed+prefix.length,e-removed+prefix.length);
    }
    ta.focus();return;
  }
  if(cmd==='hr'){
    const ins='\n---\n';
    ta.value=before+ins+after;
    ta.setSelectionRange(s+ins.length,s+ins.length);
    ta.focus();return;
  }
  if(cmd==='codeblock'){
    if(sel){
      const ins='```\n'+sel+'\n```';
      ta.value=before+ins+after;
      ta.setSelectionRange(s+4,s+4+sel.length);
    } else {
      const ins='```\n코드\n```';
      ta.value=before+ins+after;
      ta.setSelectionRange(s+4,s+6);
    }
    ta.focus();return;
  }
  if(cmd==='link'){
    if(sel){
      const ins='['+sel+'](url)';
      ta.value=before+ins+after;
      ta.setSelectionRange(s+sel.length+3,s+sel.length+6);
    } else {
      const ins='[링크텍스트](url)';
      ta.value=before+ins+after;
      ta.setSelectionRange(s+1,s+6);
    }
    ta.focus();return;
  }
  const WRAP={bold:'**',italic:'*',code:'`',strike:'~~',highlight:'=='};
  if(WRAP[cmd]){
    const w=WRAP[cmd];
    const placeholder={bold:'굵게',italic:'기울임',code:'코드',strike:'취소선',highlight:'강조'}[cmd];
    if(sel){
      if(before.endsWith(w)&&after.startsWith(w)){
        ta.value=before.slice(0,-w.length)+sel+after.slice(w.length);
        ta.setSelectionRange(s-w.length,e-w.length);
      } else {
        ta.value=before+w+sel+w+after;
        ta.setSelectionRange(s,e+w.length*2);
      }
    } else {
      ta.value=before+w+placeholder+w+after;
      ta.setSelectionRange(s+w.length,s+w.length+placeholder.length);
    }
    ta.focus();
  }
}

function makeToolbarHtml(targetId){
  const btns=TB_ITEMS.map(t=>
    t.sep?'<span class="tb-sep"></span>'
    :`<button type="button" data-cmd="${t.cmd}" title="${t.title}">${t.label}</button>`
  ).join('');
  return `<div class="note-toolbar" data-target="${targetId}">${btns}</div>`;
}
function attachToolbars(root){
  (root||document).querySelectorAll('.note-toolbar[data-target]').forEach(tb=>{
    const ta=document.getElementById(tb.dataset.target);
    if(!ta) return;
    tb.addEventListener('click',e=>{
      const btn=e.target.closest('[data-cmd]');
      if(btn) applyFormat(btn.dataset.cmd,ta);
    });
  });
}

function attachLivePreview(taId, prevId){
  const ta=document.getElementById(taId);

  ta.addEventListener('input',update);

}

async function renderTimeline(){
  const el = document.getElementById('tab-content');
  if(!tlCalYM){ const n=new Date(); tlCalYM={year:n.getFullYear(),month:n.getMonth()}; }

  const [issues, notes] = await Promise.all([
    db.getByIndex('issues','projectId',PROJECT_ID),
    db.getByIndex('notes','projectId',PROJECT_ID),
  ]);

  const toDate = ts => {
    if(!ts) return '';
    try{ return new Date(ts).toISOString().slice(0,10); }catch(e){ return ''; }
  };

  tlItems = [
    ...issues.map(i=>({id:i.id,kind:'issue',title:i.title||'(제목 없음)',date:toDate(i.createdAt),priority:i.priority,status:i.status})),
    ...notes.map(n=>({id:n.id,kind:'note',title:n.title||'(제목 없음)',date:toDate(n.updatedAt||n.createdAt),category:n.category})),
  ].filter(x=>x.date).sort((a,b)=>b.date.localeCompare(a.date));

  tlGrouped = {};
  for(const item of tlItems){
    if(!tlGrouped[item.date]) tlGrouped[item.date]=[];
    tlGrouped[item.date].push(item);
  }

  tlRender(el);
}

function tlCalPrev(){
  let {year,month}=tlCalYM;
  if(month===0){year--;month=11;}else month--;
  tlCalYM={year,month};
  tlRender();
}
function tlCalNext(){
  let {year,month}=tlCalYM;
  if(month===11){year++;month=0;}else month++;
  tlCalYM={year,month};
  tlRender();
}
function tlCalClick(date){
  tlSelectedDate = tlSelectedDate===date ? null : date;
  tlRender();
}
function tlOpenItem(kind,id){
  renderTab(kind==='issue'?'issues':'notes');

async function tlImportFile(input){
  const file = input.files[0];
  if(!file){ return; }
  input.value = '';   // 동일 파일 재선택 허용

  let data;
  try {
    data = JSON.parse(await file.text());
  } catch(e) {
    alert('JSON 파일을 읽을 수 없습니다: ' + e.message);
    return;
  }
  if(data._format !== 'mce-dashboard-timeline-v1'){
    alert('지원하지 않는 형식입니다. migrate-to-dashboard.js로 생성한 파일을 사용하세요.');
    return;
  }

  const pid = PROJECT_ID;
  if(!pid){ alert('프로젝트를 먼저 선택해주세요.'); return; }

  const issues = data.issues || [];
  const notes  = data.notes  || [];

  let iOk=0, iSkip=0, nOk=0, nSkip=0;

  for(const item of issues){
    const exists = await db.get('issues', item.id);
    if(exists){ iSkip++; continue; }
    await db.put('issues', { ...item, projectId: pid });
    iOk++;
  }
  for(const item of notes){
    const exists = await db.get('notes', item.id);
    if(exists){ nSkip++; continue; }
    await db.put('notes', { ...item, projectId: pid });
    nOk++;
  }

  const msg = `가져오기 완료\n이슈  추가 ${iOk}건, 건너뜀 ${iSkip}건\n노트  추가 ${nOk}건, 건너뜀 ${nSkip}건`;
  alert(msg);
  renderTimeline();   // 새로 고침
}

async function renderSnippets(){

        ${(s.useCount||0)>0?`<span class="snippet-use-count">복사 ${s.useCount}회</span>`:''}
      </div>
    </div>`).join('')

  el.innerHTML = `
    <div class="list-pane">
      <div class="tab-toolbar">
        <input class="snippet-search" id="snippet-search-input" type="search" placeholder="제목·내용 검색" value="${esc(snippetSearch)}">
        <button class="btn-icon" id="btn-snippet-add" title="스니펫 추가"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

async function copySnippet(id){
  const s=await db.get('snippets',id);
  if(!s) return;
  await navigator.clipboard.writeText(s.content||'');
  s.useCount=(s.useCount||0)+1;
  s.updatedAt=Date.now();
  await db.put('snippets',s);
  showToast('📋 클립보드에 복사됐습니다');
  // 복사 횟수 즉시 갱신
  const countEl=document.querySelector(`[data-sid="${id}"] .snippet-use-count`);
  if(countEl){ countEl.textContent=`복사 ${s.useCount}회`; }
  else{
    const foot=document.querySelector(`[data-sid="${id}"] .snippet-card-foot`);
    if(foot){ const sp=document.createElement('span');sp.className='snippet-use-count';sp.textContent=`복사 ${s.useCount}회`;foot.appendChild(sp); }
  }
}

async function deleteSnippet(id){
  const item = await db.get('snippets', id);
  if(!item) return;
  confirmDelete(item.title||'스니펫', async()=>{
    pushUndo('snippets', item, item.title||'스니펫', ()=>renderSnippets());
    await db.delete('snippets', id);
    showToast('삭제됨 · Ctrl+Z로 실행 취소');
    closeModal();
    renderSnippets();
  });
}

async function loadNotes(){

  // order 필드 기준 정렬, 없으면 updatedAt 역순
  items.sort((a,b)=>{
    if(a.order!=null && b.order!=null) return a.order-b.order;
    if(a.order!=null) return -1;
    if(b.order!=null) return 1;
    return b.updatedAt-a.updatedAt;
  });

  if(noteSearch){
    const q=noteSearch.toLowerCase();
    items=items.filter(i=>(i.title||'').toLowerCase().includes(q)||(i.content||'').toLowerCase().includes(q));
  }

  const el=document.getElementById('note-list');
  if(!el) return;

  el.innerHTML=items.map(n=>{
    const rendered=renderMarkdown(n.content||'',{checkClick:true});
    const isLong=(n.content||'').split('\n').length>6||(n.content||'').length>300;

      draggable="true"
      ondragstart="noteDragStart(event,'${n.id}')"
      ondragover="noteDragOver(event)"
      ondragleave="noteDragLeave(event)"
      ondrop="noteDrop(event,'${n.id}')"
      ondragend="noteDragEnd(event)">
      <div class="note-card-header" data-thread-id="${n.id}" data-thread-type="note">
        <span class="note-drag-handle" title="드래그하여 순서 변경">⠿</span>
        ${catBadge}
        <span class="note-card-title thread-trigger">${esc(n.title)||'(제목 없음)'}</span>
        <span class="note-card-date">${new Date(n.updatedAt).toLocaleDateString('ko-KR')}</span>

        </div>

        <div class="note-rendered">${rendered}</div>
